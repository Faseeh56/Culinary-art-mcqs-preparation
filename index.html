: "D", "text": "Oxidation outside"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 95, "sourcePage": 13}, {"id": 381, "chapterId": "part2-dairy", "subtopic": "Dairy Products: Butter & Beyond", "question": "To prevent the green ring on hard-cooked eggs:", "options": [{"label": "A", "text": "Cook longer"}, {"label": "B", "text": "Don't overcook; shock immediately in ice water after cooking"}, {"label": "C", "text": "Add baking soda"}, {"label": "D", "text": "Use old eggs"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 96, "sourcePage": 13}, {"id": 382, "chapterId": "part2-dairy", "subtopic": "Dairy Products: Butter & Beyond", "question": "Poached eggs should be cooked in water at:", "options": [{"label": "A", "text": "Rolling boil"}, {"label": "B", "text": "Gentle simmer (160–180 °F / 71–82 °C) — vigorous boiling breaks the white apart"}, {"label": "C", "text": "Cold water"}, {"label": "D", "text": "Oil"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 97, "sourcePage": 13}, {"id": 383, "chapterId": "part2-dairy", "subtopic": "Dairy Products: Butter & Beyond", "question": "Adding vinegar/lemon juice to poaching water helps:", "options": [{"label": "A", "text": "Flavor"}, {"label": "B", "text": "Coagulate the white quickly, keeping it neat and compact"}, {"label": "C", "text": "Prevent sticking"}, {"label": "D", "text": "Add nutrition"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 98, "sourcePage": 13}, {"id": 384, "chapterId": "part2-dairy", "subtopic": "Dairy Products: Butter & Beyond", "question": "When frying eggs (sunny-side up), the white sets faster than the yolk due to:", "options": [{"label": "A", "text": "Fat content"}, {"label": "B", "text": "Lower coagulation temperature and higher protein/albumen content"}, {"label": "C", "text": "Size"}, {"label": "D", "text": "Position in pan"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 99, "sourcePage": 13}, {"id": 385, "chapterId": "part2-dairy", "subtopic": "Dairy Products: Butter & Beyond", "question": "An omelet is technically defined as:", "options": [{"label": "A", "text": "Scrambled eggs"}, {"label": "B", "text": "Beaten eggs cooked without stirring until set, often folded around a filling"}, {"label": "C", "text": "Poached eggs"}, {"label": "D", "text": "Boiled eggs"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 100, "sourcePage": 13}, {"id": 386, "chapterId": "part2-dairy", "subtopic": "Dairy Products: Butter & Beyond", "question": "A French omelet is cooked:", "options": [{"label": "A", "text": "Until brown"}, {"label": "B", "text": "Quickly over high heat, creamy/loose interior (baveuse), pale color, no browning"}, {"label": "C", "text": "Slowly until crisp"}, {"label": "D", "text": "Boiled"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 101, "sourcePage": 14}, {"id": 387, "chapterId": "part2-dairy", "subtopic": "Dairy Products: Butter & Beyond", "question": "An American-style omelet differs from French because it is:", "options": [{"label": "A", "text": "Smaller"}, {"label": "B", "text": "Usually firmer, often browned (golden), and sometimes finished under a broiler/topped"}, {"label": "C", "text": "Made with whites only"}, {"label": "D", "text": "Eaten cold"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 102, "sourcePage": 14}, {"id": 388, "chapterId": "part2-dairy", "subtopic": "Dairy Products: Butter & Beyond", "question": "A soufflé omelet (omelette soufflée) incorporates:", "options": [{"label": "A", "text": "Flour"}, {"label": "B", "text": "Beaten egg whites (meringue) into the yolk mixture before cooking, making it light/puffy"}, {"label": "C", "text": "Cream"}, {"label": "D", "text": "Butter only"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 103, "sourcePage": 14}, {"id": 389, "chapterId": "part2-rice", "subtopic": "Rice, Grains & Pasta", "question": "Rice is the seed of the grass species:", "options": [{"label": "A", "text": "Triticum"}, {"label": "B", "text": "Oryza sativa (Asian) or Oryza glaberrima (African)"}, {"label": "C", "text": "Zea mays"}, {"label": "D", "text": "Hordeum vulgare"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 104, "sourcePage": 15}, {"id": 390, "chapterId": "part2-rice", "subtopic": "Rice, Grains & Pasta", "question": "The three main grain lengths (classifications) of rice are:", "options": [{"label": "A", "text": "Long-grain, Medium-grain, Short-grain"}, {"label": "B", "text": "Red, White, Black"}, {"label": "C", "text": "Brown, White, Parboiled"}, {"label": "D", "text": "Aromatic, Non-aromatic, Sticky"}], "correctOption": "A", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 105, "sourcePage": 15}, {"id": 391, "chapterId": "part2-rice", "subtopic": "Rice, Grains & Pasta", "question": "Long-grain rice (e.g., Basmati, Jasmine, Carolina long grain) has a grain length of:", "options": [{"label": "A", "text": "Less than 5 mm"}, {"label": "B", "text": "6–8 mm or longer (typically >6 mm; basmati can be 7–9 mm)"}, {"label": "C", "text": "4–5 mm"}, {"label": "D", "text": "2–3 mm"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 106, "sourcePage": 15}, {"id": 392, "chapterId": "part2-rice", "subtopic": "Rice, Grains & Pasta", "question": "After cooking, long-grain rice characteristically:", "options": [{"label": "A", "text": "Sticks together"}, {"label": "B", "text": "Remains separate, fluffy, and light (high amylose starch)"}, {"label": "C", "text": "Becomes sticky/clumpy"}, {"label": "D", "text": "Turns to paste"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 107, "sourcePage": 15}, {"id": 393, "chapterId": "part2-rice", "subtopic": "Rice, Grains & Pasta", "question": "Medium-grain rice (e.g., Arborio, Valencia, Carnaroli) is approximately:", "options": [{"label": "A", "text": "8 mm long"}, {"label": "B", "text": "5–6 mm in length"}, {"label": "C", "text": "3 mm"}, {"label": "D", "text": "10 mm"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 108, "sourcePage": 15}, {"id": 394, "chapterId": "part2-rice", "subtopic": "Rice, Grains & Pasta", "question": "Medium-grain rice tends to cook up:", "options": [{"label": "A", "text": "Fluffy and separate"}, {"label": "B", "text": "Moist, tender, and slightly sticky/clinging (higher amylopectin)"}, {"label": "C", "text": "Dry and hard"}, {"label": "D", "text": "Into porridge only"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 109, "sourcePage": 15}, {"id": 395, "chapterId": "part2-rice", "subtopic": "Rice, Grains & Pasta", "question": "Short-grain rice (e.g., Japanese sushi rice, risotto rice, glutinous/sticky rice) is:", "options": [{"label": "A", "text": "Less than 4 mm"}, {"label": "B", "text": "Short, almost round/plump (approx. 4 mm or less)"}, {"label": "C", "text": "Very long"}, {"label": "D", "text": "Oval only"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 110, "sourcePage": 15}, {"id": 396, "chapterId": "part2-rice", "subtopic": "Rice, Grains & Pasta", "question": "Short-grain rice cooks up:", "options": [{"label": "A", "text": "Separate"}, {"label": "B", "text": "Very sticky, cohesive, and clumpy (very high amylopectin, ideal for sushi bonding or risotto creaminess)"}, {"label": "C", "text": "Like long-grain"}, {"label": "D", "text": "Fluffy"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 111, "sourcePage": 15}, {"id": 397, "chapterId": "part2-rice", "subtopic": "Rice, Grains & Pasta", "question": "Aromatic rice varieties (like Basmati and Jasmine) contain natural compounds that give them a:", "options": [{"label": "A", "text": "Bland smell"}, {"label": "B", "text": "Distinctive fragrance (popcorn-like or floral aroma) when cooked"}, {"label": "C", "text": "Fishy odor"}, {"label": "D", "text": "No smell"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 112, "sourcePage": 15}, {"id": 398, "chapterId": "part2-rice", "subtopic": "Rice, Grains & Pasta", "question": "Basmati rice is traditionally:", "options": [{"label": "A", "text": "Short-grain"}, {"label": "B", "text": "Aged for several months to a year after harvest to develop flavor and reduce moisture for better cooking"}, {"label": "C", "text": "Eaten raw"}, {"label": "D", "text": "Used only for desserts"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 113, "sourcePage": 16}, {"id": 399, "chapterId": "part2-rice", "subtopic": "Rice, Grains & Pasta", "question": "Jasmine rice is originally from:", "options": [{"label": "A", "text": "India"}, {"label": "B", "text": "Thailand (Southeast Asia)"}, {"label": "C", "text": "Italy"}, {"label": "D", "text": "Japan"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 114, "sourcePage": 16}, {"id": 400, "chapterId": "part2-rice", "subtopic": "Rice, Grains & Pasta", "question": "The milling/polishing process that produces white rice removes:", "options": [{"label": "A", "text": "Nothing"}, {"label": "B", "text": "The bran (outer layer) and germ (embryo), leaving mostly starchy endosperm"}, {"label": "C", "text": "Only dirt"}, {"label": "D", "text": "Water"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 115, "sourcePage": 16}, {"id": 401, "chapterId": "part2-rice", "subtopic": "Rice, Grains & Pasta", "question": "Brown rice retains:", "options": [{"label": "A", "text": "Only endosperm"}, {"label": "B", "text": "The bran and germ (whole grain), giving more fiber, nutrients, oils and a nuttier flavor"}, {"label": "C", "text": "Less nutrition than white"}, {"label": "D", "text": "No bran"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 116, "sourcePage": 16}, {"id": 402, "chapterId": "part2-rice", "subtopic": "Rice, Grains & Pasta", "question": "Brown rice requires:", "options": [{"label": "A", "text": "Less cooking time"}, {"label": "B", "text": "Longer cooking time and more water than white rice (due to bran barrier)"}, {"label": "C", "text": "No water"}, {"label": "D", "text": "Same time as white"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 117, "sourcePage": 16}, {"id": 403, "chapterId": "part2-rice", "subtopic": "Rice, Grains & Pasta", "question": "Parboiled (converted) rice is processed by:", "options": [{"label": "A", "text": "Frying"}, {"label": "B", "text": "Steaming under pressure BEFORE milling (drives nutrients into kernel, gelatinizes starch, firms grain)"}, {"label": "C", "text": "Freezing"}, {"label": "D", "text": "Smoking"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 118, "sourcePage": 16}, {"id": 404, "chapterId": "part2-rice", "subtopic": "Rice, Grains & Pasta", "question": "Advantages of parboiled rice include:", "options": [{"label": "A", "text": "Sticky texture"}, {"label": "B", "text": "More nutrients retained, firmer grains that separate well, resistant to overcooking"}, {"label": "C", "text": "Quick cooking (instant)"}, {"label": "D", "text": "Always brown color"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 119, "sourcePage": 16}, {"id": 405, "chapterId": "part2-rice", "subtopic": "Rice, Grains & Pasta", "question": "When cooking rice using the absorption (pilaf) method:", "options": [{"label": "A", "text": "Rice is boiled in excess water"}, {"label": "B", "text": "Measured rice is sautéed in fat (optional), then measured hot liquid is added, covered, and simmered until absorbed"}, {"label": "C", "text": "Steamed in bamboo"}, {"label": "D", "text": "Fried"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 120, "sourcePage": 16}, {"id": 406, "chapterId": "part2-rice", "subtopic": "Rice, Grains & Pasta", "question": "The typical ratio for cooking long-grain white rice by the absorption method is approximately:", "options": [{"label": "A", "text": "1:1"}, {"label": "B", "text": "1 part rice : 1.5 to 2 parts liquid (by volume)"}, {"label": "C", "text": "1:4"}, {"label": "D", "text": "4:1"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 121, "sourcePage": 17}, {"id": 407, "chapterId": "part2-rice", "subtopic": "Rice, Grains & Pasta", "question": "For risotto (using Arborio/Carnaroli), the technique differs because:", "options": [{"label": "A", "text": "All liquid is added at once"}, {"label": "B", "text": "Hot stock is added gradually (ladle by ladle) while stirring constantly to release starch for creaminess"}, {"label": "C", "text": "No stirring allowed"}, {"label": "D", "text": "It is boiled in excess water and drained"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 122, "sourcePage": 17}, {"id": 408, "chapterId": "part2-rice", "subtopic": "Rice, Grains & Pasta", "question": "You should NOT rinse Arborio or Carnaroli rice before making risotto because:", "options": [{"label": "A", "text": "It adds flavor"}, {"label": "B", "text": "You want to retain the surface starch that creates the creamy texture when released during stirring"}, {"label": "C", "text": "It removes dirt only"}, {"label": "D", "text": "It prevents sticking to the pan"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 123, "sourcePage": 17}, {"id": 409, "chapterId": "part2-rice", "subtopic": "Rice, Grains & Pasta", "question": "Long-grain rice (for pilaf or plain boiled) is often rinsed to:", "options": [{"label": "A", "text": "Add starch"}, {"label": "B", "text": "Remove excess surface starch that would make it gummy/sticky"}, {"label": "C", "text": "Remove flavor"}, {"label": "D", "text": "Cook faster"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 124, "sourcePage": 17}, {"id": 410, "chapterId": "part2-rice", "subtopic": "Rice, Grains & Pasta", "question": "Properly cooked rice (al dente for risotto; tender but separate for long-grain) should have:", "options": [{"label": "A", "text": "A crunchy center"}, {"label": "B", "text": "No hard chalky core (raw center) — fully hydrated but not mushy/overblown"}, {"label": "C", "text": "Exploded grains"}, {"label": "D", "text": "Pasted consistency"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 125, "sourcePage": 17}, {"id": 411, "chapterId": "special-thermo", "subtopic": "Thermometers", "question": "In professional kitchens, the most accurate type of thermometer for checking internal food temperatures is the:", "options": [{"label": "A", "text": "Candy/jam thermometer"}, {"label": "B", "text": "Digital instant-read thermometer (or high-quality bi-metallic stem thermometer)"}, {"label": "C", "text": "Oven mercury thermometer"}, {"label": "D", "text": "Infrared surface scanner only"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Special Topics", "sourceQuestionId": 1, "sourcePage": 2}, {"id": 412, "chapterId": "special-thermo", "subtopic": "Thermometers", "question": "A bi-metallic coil thermometer works by:", "options": [{"label": "A", "text": "Electronic sensor"}, {"label": "B", "text": "Two different metals bonded together that expand/contract at different rates when heated, causing the coil to unwind and turn the dial"}, {"label": "C", "text": "Liquid expansion (like alcohol)"}, {"label": "D", "text": "Infrared radiation"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Special Topics", "sourceQuestionId": 2, "sourcePage": 2}, {"id": 413, "chapterId": "special-thermo", "subtopic": "Thermometers", "question": "The thermocouple (digital probe) differs from standard bi-metallic thermometers because it:", "options": [{"label": "A", "text": "Is slower to read"}, {"label": "B", "text": "Uses two dissimilar metal wires joined at the tip and measures voltage change (extremely fast reading, about 2–5 seconds)"}, {"label": "C", "text": "Contains mercury"}, {"label": "D", "text": "Is only used for ovens"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Special Topics", "sourceQuestionId": 3, "sourcePage": 2}, {"id": 414, "chapterId": "special-thermo", "subtopic": "Thermometers", "question": "An infrared (laser) thermometer measures:", "options": [{"label": "A", "text": "Internal core temperature accurately"}, {"label": "B", "text": "Surface temperature only (by measuring emitted infrared energy); does NOT penetrate food"}, {"label": "C", "text": "Air temperature inside an oven"}, {"label": "D", "text": "Liquid temperature in a pot"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Special Topics", "sourceQuestionId": 4, "sourcePage": 2}, {"id": 415, "chapterId": "special-thermo", "subtopic": "Thermometers", "question": "Oven thermometers (the kind that hang or sit inside) typically measure:", "options": [{"label": "A", "text": "Food internal temperature"}, {"label": "B", "text": "The actual air temperature inside the oven cavity (to verify oven accuracy)"}, {"label": "C", "text": "Surface temperature of the rack"}, {"label": "D", "text": "Humidity"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Special Topics", "sourceQuestionId": 5, "sourcePage": 2}, {"id": 416, "chapterId": "special-thermo", "subtopic": "Thermometers", "question": "A candy/deep-fry thermometer is designed with:", "options": [{"label": "A", "text": "Short stem for thin foods"}, {"label": "B", "text": "Longer stem and higher temperature range (100–400 °F / 40–200 °C+) to measure sugar stages or hot oil"}, {"label": "C", "text": "Instant digital readout only"}, {"label": "D", "text": "Waterproof casing for sous-vide"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Special Topics", "sourceQuestionId": 6, "sourcePage": 2}, {"id": 417, "chapterId": "special-thermo", "subtopic": "Thermometers", "question": "Refrigerator/freezer thermometers should be placed:", "options": [{"label": "A", "text": "On the door shelf"}, {"label": "B", "text": "In the warmest area of the unit (usually near the door or top) to ensure the entire unit stays safe"}, {"label": "C", "text": "Inside a sealed container of food"}, {"label": "D", "text": "On the floor"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Special Topics", "sourceQuestionId": 7, "sourcePage": 2}, {"id": 418, "chapterId": "special-thermo", "subtopic": "Thermometers", "question": "When checking the internal temperature of a roast or turkey, the thermometer probe must be inserted:", "options": [{"label": "A", "text": "Just until it touches fat"}, {"label": "B", "text": "Into the thickest part of the muscle, avoiding bone, fat, or the pan bottom (which give false readings)"}, {"label": "C", "text": "From the top only"}, {"label": "D", "text": "After removing from the oven entirely"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Special Topics", "sourceQuestionId": 8, "sourcePage": 3}, {"id": 419, "chapterId": "special-thermo", "subtopic": "Thermometers", "question": "When checking a thin item (burger patty, chicken breast), insert the probe:", "options": [{"label": "A", "text": "Horizontally from the side"}, {"label": "B", "text": "From the side (horizontally) so the sensing element is centered in the thickest part, without exiting the other side"}, {"label": "C", "text": "Vertically from the top only"}, {"label": "D", "text": "At an angle through the crust only"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Special Topics", "sourceQuestionId": 9, "sourcePage": 3}, {"id": 420, "chapterId": "special-thermo", "subtopic": "Thermometers", "question": "To get an accurate reading, you must wait for the temperature to stabilize; for a standard bi-metallic stem thermometer this takes approximately:", "options": [{"label": "A", "text": "1 second"}, {"label": "B", "text": "10–15 seconds (or until the dial stops moving)"}, {"label": "C", "text": "2 minutes"}, {"label": "D", "text": "Instantly (no wait needed)"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Special Topics", "sourceQuestionId": 10, "sourcePage": 3}, {"id": 421, "chapterId": "special-thermo", "subtopic": "Thermometers", "question": "When checking liquid temperatures (stock, soup, oil), the probe should be:", "options": [{"label": "A", "text": "Touching the bottom of the pot"}, {"label": "B", "text": "Submerged in the center of the liquid, not touching the sides or bottom of the container"}, {"label": "C", "text": "Held above the steam"}, {"label": "D", "text": "Dipped quickly then removed"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Special Topics", "sourceQuestionId": 11, "sourcePage": 3}, {"id": 422, "chapterId": "special-thermo", "subtopic": "Thermometers", "question": "Calibration of thermometers means:", "options": [{"label": "A", "text": "Changing the battery"}, {"label": "B", "text": "Checking and adjusting accuracy against a known reference (ice water at 32 °F / 0 °C or boiling water at 212 °F / 100 °C)"}, {"label": "C", "text": "Cleaning the probe"}, {"label": "D", "text": "Sharpening the tip"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Special Topics", "sourceQuestionId": 12, "sourcePage": 3}, {"id": 423, "chapterId": "special-thermo", "subtopic": "Thermometers", "question": "The ice-point method for calibrating involves:", "options": [{"label": "A", "text": "Freezing the thermometer"}, {"label": "B", "text": "Submerging the stem in a slush of ice and water; it should read 32 °F (0 °C)"}, {"label": "C", "text": "Boiling water"}, {"label": "D", "text": "Putting it in the freezer"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Special Topics", "sourceQuestionId": 13, "sourcePage": 3}, {"id": 424, "chapterId": "special-thermo", "subtopic": "Thermometers", "question": "If a bi-metallic thermometer reads incorrectly after calibration and cannot be adjusted:", "options": [{"label": "A", "text": "Use it anyway with a mental note"}, {"label": "B", "text": "It must be replaced or marked with the correction factor (e.g., \"reads 5° high\")"}, {"label": "C", "text": "Be used only for cold foods"}, {"label": "D", "text": "Be used only for meats"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Special Topics", "sourceQuestionId": 14, "sourcePage": 3}, {"id": 425, "chapterId": "special-thermo", "subtopic": "Thermometers", "question": "Thermometer sanitization between uses requires:", "options": [{"label": "A", "text": "Wiping on apron"}, {"label": "B", "text": "Wiping clean, then sanitizing with an alcohol swab or sanitizing solution (or rinsing in hot water above 171 °F if waterproof)"}, {"label": "C", "text": "Rinsing in cold water only"}, {"label": "D", "text": "Air drying only"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Special Topics", "sourceQuestionId": 15, "sourcePage": 3}, {"id": 426, "chapterId": "special-immersion", "subtopic": "Immersion Blenders", "question": "An immersion blender (stick blender, hand blender) is primarily used to:", "options": [{"label": "A", "text": "Chop vegetables"}, {"label": "B", "text": "Purée, blend, or emulsify foods directly in the cooking vessel (pot, bowl, or container) without transferring"}, {"label": "C", "text": "Whip cream only"}, {"label": "D", "text": "Slice meat"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Special Topics", "sourceQuestionId": 16, "sourcePage": 4}, {"id": 427, "chapterId": "special-immersion", "subtopic": "Immersion Blenders", "question": "Compared to a countertop blender or food processor, a key advantage of the immersion blender is:", "options": [{"label": "A", "text": "More powerful motor"}, {"label": "B", "text": "Ability to work directly in the hot pot on the stove (safety, less cleanup, no transfer burns)"}, {"label": "C", "text": "Can chop ice only"}, {"label": "D", "text": "Cheaper replacement parts"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Special Topics", "sourceQuestionId": 17, "sourcePage": 4}, {"id": 428, "chapterId": "special-immersion", "subtopic": "Immersion Blenders", "question": "When puréeing a hot soup with an immersion blender, you should:", "options": [{"label": "A", "text": "Turn the stove to maximum heat while blending"}, {"label": "B", "text": "Remove the pot from heat (or turn off), let it cool slightly if very full, immerse the blender fully before turning it on, move slowly, and keep the blade submerged to avoid splashing hot liquid"}, {"label": "C", "text": "Blend while rapidly boiling over high flame"}, {"label": "D", "text": "Fill the pot to the brim before blending"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Special Topics", "sourceQuestionId": 18, "sourcePage": 4}, {"id": 429, "chapterId": "special-immersion", "subtopic": "Immersion Blenders", "question": "The shaft/tube of an immersion blender (the part surrounding the blade):", "options": [{"label": "A", "text": "Should be removed for cleaning only"}, {"label": "B", "text": "Acts as a guard and helps create suction and circulation to draw food into the blades for even puréeing"}, {"label": "C", "text": "Is purely decorative"}, {"label": "D", "text": "Must be made of plastic only"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Special Topics", "sourceQuestionId": 19, "sourcePage": 4}, {"id": 430, "chapterId": "special-immersion", "subtopic": "Immersion Blenders", "question": "To avoid damaging an immersion blender, you should:", "options": [{"label": "A", "text": "Blend frozen-solid blocks of ice"}, {"label": "B", "text": "Ensure the blade is fully submerged in liquid before turning it on (to prevent air cavitation and burning out the motor)"}, {"label": "C", "text": "Use it to grind coffee beans"}, {"label": "D", "text": "Submerge the motor housing (handle) in liquid"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Special Topics", "sourceQuestionId": 20, "sourcePage": 4}, {"id": 431, "chapterId": "special-immersion", "subtopic": "Immersion Blenders", "question": "For making emulsions (vinaigrette, mayonnaise) with an immersion blender:", "options": [{"label": "A", "text": "Blend oil alone first"}, {"label": "B", "text": "Place ingredients in a tall, narrow container (taller than the blender shaft), start the blender at the bottom, and slowly incorporate oil while running"}, {"label": "C", "text": "Add all oil at once at top speed immediately"}, {"label": "D", "text": "Use a flat, wide bowl"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Special Topics", "sourceQuestionId": 21, "sourcePage": 4}, {"id": 432, "chapterId": "special-immersion", "subtopic": "Immersion Blenders", "question": "Cleaning an immersion blender that is NOT fully waterproof (many are not submersible above the seal):", "options": [{"label": "A", "text": "Put the entire unit in the dishwasher"}, {"label": "B", "text": "Detach the shaft/blade (if designed) and wash that part; wipe the motor body with a damp cloth (never submerge the motor)"}, {"label": "C", "text": "Soak the handle in the sink"}, {"label": "D", "text": "Use steel wool on the blade"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Special Topics", "sourceQuestionId": 22, "sourcePage": 5}, {"id": 433, "chapterId": "special-chinois", "subtopic": "Chinois and Straining", "question": "A chinois (china cap / conical strainer) is distinguished by its:", "options": [{"label": "A", "text": "Flat bottom"}, {"label": "B", "text": "Fine mesh (often stainless steel) in a cone shape, usually with a handle, used for fine straining and puréeing"}, {"label": "C", "text": "Large holes like a colander"}, {"label": "D", "text": "Plastic construction"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Special Topics", "sourceQuestionId": 23, "sourcePage": 6}, {"id": 434, "chapterId": "special-chinois", "subtopic": "Chinois and Straining", "question": "A fine-mesh chinois (sometimes called a chinois étroit, or a tamis when extremely fine) is used for:", "options": [{"label": "A", "text": "Draining pasta"}, {"label": "B", "text": "Producing perfectly smooth, silky sauces, soups, and purées by removing all particles and lumps"}, {"label": "C", "text": "Sifting flour only"}, {"label": "D", "text": "Draining fried foods"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Special Topics", "sourceQuestionId": 24, "sourcePage": 6}, {"id": 435, "chapterId": "special-chinois", "subtopic": "Chinois and Straining", "question": "The difference between a standard China cap (coarse mesh) and a fine chinois is:", "options": [{"label": "A", "text": "Shape only"}, {"label": "B", "text": "Mesh size: a China cap has larger perforations (for draining liquids and rough straining); a fine chinois has very tight mesh (for smoothing)"}, {"label": "C", "text": "Material (one is tin, one is steel)"}, {"label": "D", "text": "No difference (they are synonyms)"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Special Topics", "sourceQuestionId": 25, "sourcePage": 6}, {"id": 436, "chapterId": "special-chinois", "subtopic": "Chinois and Straining", "question": "A bouillon strainer (chinois) used for clarification (consommé) often works in conjunction with:", "options": [{"label": "A", "text": "A blender"}, {"label": "B", "text": "A \"clearmeat\" (raft) of ground meat, egg whites, mirepoix, and acid that traps impurities as it cooks, then strained through the chinois"}, {"label": "C", "text": "A food mill"}, {"label": "D", "text": "A colander"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Special Topics", "sourceQuestionId": 26, "sourcePage": 6}, {"id": 437, "chapterId": "special-chinois", "subtopic": "Chinois and Straining", "question": "A tamis (drum sieve) differs from a chinois in that it is:", "options": [{"label": "A", "text": "Cone-shaped"}, {"label": "B", "text": "Flat and circular, with a fine mesh held in a ring, used for sifting dry ingredients or forcing cooked foods through with a scraper or palette knife"}, {"label": "C", "text": "Used only for hot liquids"}, {"label": "D", "text": "Made of plastic"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Special Topics", "sourceQuestionId": 27, "sourcePage": 6}, {"id": 438, "chapterId": "special-chinois", "subtopic": "Chinois and Straining", "question": "When pushing a thick purée or soft food through a fine chinois or tamis, the proper technique uses:", "options": [{"label": "A", "text": "Your fist"}, {"label": "B", "text": "A rigid bench scraper or plastic/rubber spatula to press firmly in circular motions (not your hand, because sharp edges cut)"}, {"label": "C", "text": "A wooden spoon (usually too flexible for pressure)"}, {"label": "D", "text": "A whisk"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Special Topics", "sourceQuestionId": 28, "sourcePage": 6}, {"id": 439, "chapterId": "special-chinois", "subtopic": "Chinois and Straining", "question": "A cheesecloth-lined chinois is used when:", "options": [{"label": "A", "text": "You want large chunks"}, {"label": "B", "text": "You need ultra-clarity (such as for crystal-clear consommé or delicate fining) and want to catch even micro-particles"}, {"label": "C", "text": "Straining heavy solids only"}, {"label": "D", "text": "Sifting flour"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Special Topics", "sourceQuestionId": 29, "sourcePage": 7}, {"id": 440, "chapterId": "special-chinois", "subtopic": "Chinois and Straining", "question": "Maintaining a chinois properly includes:", "options": [{"label": "A", "text": "Leaving food residue in it to dry"}, {"label": "B", "text": "Rinsing immediately after use (before food dries or hardens) and occasionally descaling with acid if mineral buildup occurs"}, {"label": "C", "text": "Using abrasive pads on the mesh"}, {"label": "D", "text": "Storing it wet in a closed cupboard"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Special Topics", "sourceQuestionId": 30, "sourcePage": 7}, {"id": 441, "chapterId": "special-chinois", "subtopic": "Chinois and Straining", "question": "The term \"passer au chinois\" (to pass through a china cap) in a recipe instruction means:", "options": [{"label": "A", "text": "Fry it"}, {"label": "B", "text": "Strain it through a fine-mesh conical strainer to achieve smoothness"}, {"label": "C", "text": "Cook it in Chinese style"}, {"label": "D", "text": "Freeze it"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Special Topics", "sourceQuestionId": 31, "sourcePage": 7}, {"id": 442, "chapterId": "special-chinois", "subtopic": "Chinois and Straining", "question": "For straining hot liquids (stock, consommé) through a chinois, you should:", "options": [{"label": "A", "text": "Pour rapidly from a height"}, {"label": "B", "text": "Pre-warm the chinois (so cold metal doesn't shock hot liquid) and, when clarifying, strain into a container set in ice to stop cooking immediately"}, {"label": "C", "text": "Use the chinois dry and cold"}, {"label": "D", "text": "Press hard on hot solids immediately"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Special Topics", "sourceQuestionId": 32, "sourcePage": 7}, {"id": 443, "chapterId": "special-gelatin", "subtopic": "Gelatin", "question": "Gelatin is:", "options": [{"label": "A", "text": "A dairy product"}, {"label": "B", "text": "A protein product derived from collagen (found in animal connective tissue, bones, skin), hydrolyzed to extract"}, {"label": "C", "text": "A starch from corn"}, {"label": "D", "text": "A synthetic chemical"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Special Topics", "sourceQuestionId": 33, "sourcePage": 8}, {"id": 444, "chapterId": "special-gelatin", "subtopic": "Gelatin", "question": "Commercial culinary gelatin comes primarily in two forms:", "options": [{"label": "A", "text": "Liquid and gas"}, {"label": "B", "text": "Powdered (dry powder) and sheet/leaf gelatin (thin transparent sheets)"}, {"label": "C", "text": "Granules and blocks only"}, {"label": "D", "text": "Paste and crystals"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Special Topics", "sourceQuestionId": 34, "sourcePage": 8}, {"id": 445, "chapterId": "special-gelatin", "subtopic": "Gelatin", "question": "Sheet (leaf) gelatin vs. powdered gelatin conversion depends on bloom strength (gel strength), but roughly:", "options": [{"label": "A", "text": "1 sheet = 1 tbsp powder"}, {"label": "B", "text": "1 standard sheet (approx. 2.5 g) ≈ 3 g (about 1 tsp) of powdered gelatin (check the package bloom rating)"}, {"label": "C", "text": "1 sheet = 1 cup powder"}, {"label": "D", "text": "They are never interchangeable"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Special Topics", "sourceQuestionId": 35, "sourcePage": 8}, {"id": 446, "chapterId": "special-gelatin", "subtopic": "Gelatin", "question": "Before adding gelatin to a hot liquid (base), it must be bloomed (hydrated), which means:", "options": [{"label": "A", "text": "Boiling it for 10 minutes"}, {"label": "B", "text": "Sprinkling it over cold liquid (usually 5× its weight in water or the recipe liquid) and letting it sit for 5–10 minutes to absorb fluid and swell (no lumps)"}, {"label": "C", "text": "Frying it"}, {"label": "D", "text": "Adding it directly to boiling liquid"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Special Topics", "sourceQuestionId": 36, "sourcePage": 8}, {"id": 447, "chapterId": "special-gelatin", "subtopic": "Gelatin", "question": "Why must gelatin not be boiled after it has been added to the base?", "options": [{"label": "A", "text": "It turns blue"}, {"label": "B", "text": "Boiling breaks down the protein structure, destroying its gelling ability (it won't set)"}, {"label": "C", "text": "It becomes toxic"}, {"label": "D", "text": "It curdles milk instantly"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Special Topics", "sourceQuestionId": 37, "sourcePage": 8}, {"id": 448, "chapterId": "special-gelatin", "subtopic": "Gelatin", "question": "The correct temperature range to dissolve bloomed gelatin into a base is:", "options": [{"label": "A", "text": "Boiling (212 °F)"}, {"label": "B", "text": "Warm to hot but NOT boiling (ideally 104–122 °F / 40–50 °C minimum to dissolve; stay under a boil once dissolved)"}, {"label": "C", "text": "Refrigeration temperature"}, {"label": "D", "text": "Room temperature only (it won't dissolve)"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Special Topics", "sourceQuestionId": 38, "sourcePage": 8}, {"id": 449, "chapterId": "special-gelatin", "subtopic": "Gelatin", "question": "Gelatin sets (gels) when cooled to approximately:", "options": [{"label": "A", "text": "Room temperature only"}, {"label": "B", "text": "Below 68 °F (20 °C); ideally refrigerated below 40 °F (4 °C) for a firm set; melts again above about 95 °F (35 °C)"}, {"label": "C", "text": "Freezing point only"}, {"label": "D", "text": "It sets when heated"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Special Topics", "sourceQuestionId": 39, "sourcePage": 8}, {"id": 450, "chapterId": "special-gelatin", "subtopic": "Gelatin", "question": "Foods containing raw pineapple, kiwi, papaya, or figs (which contain proteolytic enzymes such as bromelain) will not set with gelatin unless:", "options": [{"label": "A", "text": "You add more gelatin"}, {"label": "B", "text": "The fruits are first cooked (heat inactivates the enzymes that break down gelatin protein)"}, {"label": "C", "text": "You use less liquid"}, {"label": "D", "text": "You freeze the mixture"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Special Topics", "sourceQuestionId": 40, "sourcePage": 9}, {"id": 451, "chapterId": "special-gelatin", "subtopic": "Gelatin", "question": "A basic ratio for a firm gelatin dessert or mold (aspic) is approximately:", "options": [{"label": "A", "text": "1 tsp gelatin per gallon"}, {"label": "B", "text": "1 oz (28 g) powdered gelatin per quart (liter) of liquid for a firm set; less for softer, spoonable textures"}, {"label": "C", "text": "1 lb gelatin per cup"}, {"label": "D", "text": "No standard ratio (it's random)"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Special Topics", "sourceQuestionId": 41, "sourcePage": 9}, {"id": 452, "chapterId": "special-gelatin", "subtopic": "Gelatin", "question": "Vegetarian/vegan alternatives to animal-based gelatin include:", "options": [{"label": "A", "text": "Jello brand mix"}, {"label": "B", "text": "Agar-agar (seaweed derivative), pectin (fruit), carrageenan, or vegan \"gelatin\" powders (carrageenan/guar gum blends)"}, {"label": "C", "text": "Cornstarch only (doesn't give a true gel)"}, {"label": "D", "text": "Flour"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Special Topics", "sourceQuestionId": 42, "sourcePage": 9}, {"id": 453, "chapterId": "special-gelatin", "subtopic": "Gelatin", "question": "Agar-agar differs from gelatin in that it:", "options": [{"label": "A", "text": "Melts easily"}, {"label": "B", "text": "Sets at a much higher temperature (around 85 °F / 35 °C vs. gelatin's melt) and does not require refrigeration to set (sets at room temperature)"}, {"label": "C", "text": "Is made from animals"}, {"label": "D", "text": "Is clear and flavorless only (both can be)"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Special Topics", "sourceQuestionId": 43, "sourcePage": 9}, {"id": 454, "chapterId": "special-gelatin", "subtopic": "Gelatin", "question": "When making a savory jelly (aspic) for garnish or coating (chaud-froid):", "options": [{"label": "A", "text": "Add gelatin to boiling stock"}, {"label": "B", "text": "Dissolve bloomed gelatin in warm flavored stock (consommé or seasoned stock), coat items while the liquid is still liquid but cooling, then chill to set"}, {"label": "C", "text": "Use unflavored water"}, {"label": "D", "text": "Freeze immediately"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Special Topics", "sourceQuestionId": 44, "sourcePage": 9}, {"id": 455, "chapterId": "special-gelatin", "subtopic": "Gelatin", "question": "If a gelatin mixture \"weeps\" (separates and releases liquid) after setting, possible causes are:", "options": [{"label": "A", "text": "Too much gelatin"}, {"label": "B", "text": "Over-stirring while setting, temperature fluctuations (slight melting), or an incorrect gelatin-to-liquid ratio"}, {"label": "C", "text": "Not enough liquid"}, {"label": "D", "text": "Using cold liquid initially"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Special Topics", "sourceQuestionId": 45, "sourcePage": 9}, {"id": 456, "chapterId": "special-extraction", "subtopic": "Extraction & Stock Making", "question": "In culinary terms, extraction refers specifically to:", "options": [{"label": "A", "text": "Removing teeth"}, {"label": "B", "text": "The process of drawing out flavors, colors, nutrients, and gelatin from solid ingredients (bones, vegetables, aromatics) into a liquid medium (water) through simmering"}, {"label": "C", "text": "Juice pressing only"}, {"label": "D", "text": "Fat rendering only"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Special Topics", "sourceQuestionId": 46, "sourcePage": 10}, {"id": 457, "chapterId": "special-extraction", "subtopic": "Extraction & Stock Making", "question": "The primary agents that drive extraction in stock making are:", "options": [{"label": "A", "text": "Freezing and thawing"}, {"label": "B", "text": "Time, temperature (simmering, not boiling), and the surface area of the solids (cutting or smashing bones)"}, {"label": "C", "text": "Pressure cooking only"}, {"label": "D", "text": "Microwave radiation"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Special Topics", "sourceQuestionId": 47, "sourcePage": 10}, {"id": 458, "chapterId": "special-extraction", "subtopic": "Extraction & Stock Making", "question": "Why should stock be simmered gently rather than boiled vigorously during extraction?", "options": [{"label": "A", "text": "Boiling extracts faster"}, {"label": "B", "text": "Vigorous boiling creates turbidity (cloudiness), emulsifies fat improperly, and can make the stock bitter or greasy; a gentle simmer allows slow, clear extraction"}, {"label": "C", "text": "Simmering kills bacteria better"}, {"label": "D", "text": "Boiling uses less energy"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Special Topics", "sourceQuestionId": 48, "sourcePage": 10}, {"id": 459, "chapterId": "special-extraction", "subtopic": "Extraction & Stock Making", "question": "Blanching bones before making white stock affects extraction by:", "options": [{"label": "A", "text": "Adding more flavor"}, {"label": "B", "text": "Removing impurities (blood, scum) that would cloud the stock, resulting in cleaner extraction of flavors later"}, {"label": "C", "text": "Extracting all flavor immediately"}, {"label": "D", "text": "Preventing any gelatin extraction"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Special Topics", "sourceQuestionId": 49, "sourcePage": 10}, {"id": 460, "chapterId": "special-extraction", "subtopic": "Extraction & Stock Making", "question": "Roasting bones before brown stock affects extraction by:", "options": [{"label": "A", "text": "Reducing flavor"}, {"label": "B", "text": "The Maillard reaction develops deeper, richer flavors (caramelized sugars and proteins) that then extract into the liquid, and adds color to the final stock"}, {"label": "C", "text": "Removing all collagen"}, {"label": "D", "text": "Making extraction faster (it actually takes the same time)"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Special Topics", "sourceQuestionId": 50, "sourcePage": 10}, {"id": 461, "chapterId": "special-extraction", "subtopic": "Extraction & Stock Making", "question": "Cutting or smashing marrow bones before making stock improves extraction because it:", "options": [{"label": "A", "text": "Adds calcium only"}, {"label": "B", "text": "Increases surface area, allowing water better access to extract marrow fats and collagen/gelatin from inside the bone"}, {"label": "C", "text": "Makes the pot look fuller"}, {"label": "D", "text": "Reduces cooking time to 10 minutes"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Special Topics", "sourceQuestionId": 51, "sourcePage": 10}, {"id": 462, "chapterId": "special-extraction", "subtopic": "Extraction & Stock Making", "question": "Mirepoix (onion, carrot, celery) added to stocks aids extraction by:", "options": [{"label": "A", "text": "Thickening the stock"}, {"label": "B", "text": "Providing additional soluble sugars, aromatic compounds, and subtle sweetness and flavor depth that extract into the liquid"}, {"label": "C", "text": "Acting only as a garnish"}, {"label": "D", "text": "Clouding the stock intentionally"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Special Topics", "sourceQuestionId": 52, "sourcePage": 11}, {"id": 463, "chapterId": "special-extraction", "subtopic": "Extraction & Stock Making", "question": "The cold-start method (starting bones in cold water and bringing them to a simmer together) aids extraction by:", "options": [{"label": "A", "text": "Cooking faster"}, {"label": "B", "text": "Allowing proteins to coagulate slowly and rise gently as scum, rather than seizing instantly, resulting in clearer stock with better removal of impurities to be skimmed"}, {"label": "C", "text": "Killing bacteria instantly"}, {"label": "D", "text": "Preventing any dissolving of solids"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Special Topics", "sourceQuestionId": 53, "sourcePage": 11}, {"id": 464, "chapterId": "special-extraction", "subtopic": "Extraction & Stock Making", "question": "Stock should not be over-reduced during initial extraction because:", "options": [{"label": "A", "text": "It becomes too salty"}, {"label": "B", "text": "Concentrated impurities and overly intense flavors may become bitter, and too high a salt concentration can inhibit further gentle extraction of delicate flavors"}, {"label": "C", "text": "It spoils faster"}, {"label": "D", "text": "It costs more money"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Special Topics", "sourceQuestionId": 54, "sourcePage": 11}, {"id": 465, "chapterId": "special-extraction", "subtopic": "Extraction & Stock Making", "question": "Straining through a chinois at the end of extraction ensures:", "options": [{"label": "A", "text": "You lose all flavor"}, {"label": "B", "text": "Removal of all exhausted solids (spent bones, mirepoix, sachet), leaving only the extracted clear, flavorful liquid"}, {"label": "C", "text": "Sterilization"}, {"label": "D", "text": "Adding back fat"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Special Topics", "sourceQuestionId": 55, "sourcePage": 11}, {"id": 466, "chapterId": "special-reduction", "subtopic": "Reduction Techniques", "question": "Reduction in cooking is defined as:", "options": [{"label": "A", "text": "Adding liquid to thicken"}, {"label": "B", "text": "Simmering or boiling a liquid to evaporate water, thereby concentrating flavors, thickness, and intensity"}, {"label": "C", "text": "Freezing to shrink volume"}, {"label": "D", "text": "Adding starch"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Special Topics", "sourceQuestionId": 56, "sourcePage": 12}, {"id": 467, "chapterId": "special-reduction", "subtopic": "Reduction Techniques", "question": "The primary purposes of reduction include all EXCEPT:", "options": [{"label": "A", "text": "Concentrating flavor"}, {"label": "B", "text": "Thickening consistency naturally"}, {"label": "C", "text": "Adjusting seasoning intensity"}, {"label": "D", "text": "Adding volume or diluting the sauce (reduction removes volume)"}], "correctOption": "D", "sourceTitle": "The Professional Chef — Special Topics", "sourceQuestionId": 57, "sourcePage": 12}, {"id": 468, "chapterId": "special-reduction", "subtopic": "Reduction Techniques", "question": "When reducing a sauce, if you reduce it too much (too far or too fast):", "options": [{"label": "A", "text": "It becomes thinner"}, {"label": "B", "text": "It may become overly salty (salt doesn't evaporate), bitter (caramelized sugars burn), too thick or gluey, or the color darkens excessively"}, {"label": "C", "text": "It separates"}, {"label": "D", "text": "It becomes sweeter always"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Special Topics", "sourceQuestionId": 58, "sourcePage": 12}, {"id": 469, "chapterId": "special-reduction", "subtopic": "Reduction Techniques", "question": "Deglazing is closely related to reduction because it:", "options": [{"label": "A", "text": "Thickens the sauce"}, {"label": "B", "text": "Dissolves fond (brown, flavorful bits from sautéing or searing) into the liquid, which is then reduced to concentrate those flavors into the sauce"}, {"label": "C", "text": " , "sourceQuestionId": 62, "sourcePage": 13}, {"id": 473, "chapterId": "special-reduction", "subtopic": "Reduction Techniques", "question": "Properly stopping or finalizing a reduction at the desired consistency is done by:", "options": [{"label": "A", "text": "Covering tightly and ignoring it"}, {"label": "B", "text": "Removing it from heat, possibly finishing with cold butter or cream (monté au beurre), or transferring it to a bain-marie to hold without continuing to cook or reduce"}, {"label": "C", "text": "Adding water to cool it"}, {"label": "D", "text": "Freezing it instantly"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Special Topics", "sourceQuestionId": 63, "sourcePage": 13}, {"id": 474, "chapterId": "special-reduction", "subtopic": "Reduction Techniques", "question": "Evaporation rate during reduction is affected by:", "options": [{"label": "A", "text": "Color of the pot"}, {"label": "B", "text": "Surface area of the liquid (wider pans evaporate faster), temperature (higher is faster), and air movement (ventilation)"}, {"label": "C", "text": "The chef's mood"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Special Topics", "sourceQuestionId": 64, "sourcePage": 13}, {"id": 475, "chapterId": "special-reduction", "subtopic": "Reduction Techniques", "question": "When reducing a cream-based sauce (which already contains milk solids):", "options": [{"label": "A", "text": "Reduce uncovered over high heat, aggressively"}, {"label": "B", "text": "Reduce gently and uncovered over low-to-medium heat; high heat can cause milk proteins to coagulate (graininess) or separate (breaking)"}, {"label": "C", "text": "Cover completely to retain moisture"}, {"label": "D", "text": "Add water constantly"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Special Topics", "sourceQuestionId": 65, "sourcePage": 13}, {"id": 476, "chapterId": "food-01", "subtopic": "Introduction to Food Safety, Symptoms & Faults", "question": "Food poisoning symptoms usually develop within what time frame after consuming contaminated or poisonous food?", "options": [{"label": "A", "text": "10 to 15 minutes"}, {"label": "B", "text": "1 to 36 hours"}, {"label": "C", "text": "3 to 7 days"}, {"label": "D", "text": "2 to 4 weeks"}], "correctOption": "B", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 1, "sourcePage": 3}, {"id": 477, "chapterId": "food-01", "subtopic": "Introduction to Food Safety, Symptoms & Faults", "question": "How long do typical food poisoning symptoms normally last?", "options": [{"label": "A", "text": "2 to 4 hours"}, {"label": "B", "text": "12 to 24 hours"}, {"label": "C", "text": "1 to 7 days"}, {"label": "D", "text": "Several months"}], "correctOption": "C", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 2, "sourcePage": 3}, {"id": 478, "chapterId": "food-01", "subtopic": "Introduction to Food Safety, Symptoms & Faults", "question": "Which of the following is NOT a typical clinical symptom of food poisoning?", "options": [{"label": "A", "text": "Abdominal pain and diarrhoea"}, {"label": "B", "text": "Nausea and vomiting"}, {"label": "C", "text": "Fever, dehydration, and collapse"}, {"label": "D", "text": "Sudden hair loss and tooth decay"}], "correctOption": "D", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 3, "sourcePage": 3}, {"id": 479, "chapterId": "food-01", "subtopic": "Introduction to Food Safety, Symptoms & Faults", "question": "Which demographic group is classified as being at the highest risk of severe illness or death from food poisoning?", "options": [{"label": "A", "text": "Healthy adult office workers"}, {"label": "B", "text": "Teenagers and young athletes"}, {"label": "C", "text": "The very young, the elderly, recovering or ill individuals, and pregnant women and their unborn babies"}, {"label": "D", "text": "Commercial kitchen food handlers"}], "correctOption": "C", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 4, "sourcePage": 3}, {"id": 480, "chapterId": "food-01", "subtopic": "Introduction to Food Safety, Symptoms & Faults", "question": "What are the primary underlying reasons why food poisoning outbreaks occur in commercial food businesses?", "options": [{"label": "A", "text": "Excessive use of commercial refrigeration"}, {"label": "B", "text": "Negligence, ignorance, poor management, and failure to implement good hygiene practices"}, {"label": "C", "text": "Overcooking meats and vegetables"}, {"label": "D", "text": "Using colour-coded chopping boards"}], "correctOption": "B", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 5, "sourcePage": 3}, {"id": 481, "chapterId": "food-01", "subtopic": "Introduction to Food Safety, Symptoms & Faults", "question": "Which of the following is listed as one of the ten main faults contributing to food poisoning outbreaks?", "options": [{"label": "A", "text": "Storing raw meats strictly below ready-to-eat foods"}, {"label": "B", "text": "Reheating stews to a core temperature above 82°C"}, {"label": "C", "text": "Cooling hot food too slowly prior to refrigeration"}, {"label": "D", "text": "Washing hands in warm running water with liquid soap"}], "correctOption": "C", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 6, "sourcePage": 3}, {"id": 482, "chapterId": "food-01", "subtopic": "Introduction to Food Safety, Symptoms & Faults", "question": "Storing hot food below what critical threshold temperature is a major fault that promotes bacterial multiplication?", "options": [{"label": "A", "text": "100°C"}, {"label": "B", "text": "75°C"}, {"label": "C", "text": "60°C"}, {"label": "D", "text": "37°C"}], "correctOption": "C", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 7, "sourcePage": 3}, {"id": 483, "chapterId": "food-01", "subtopic": "Introducti ion": "Food hygiene involves all of the following practices EXCEPT:", "options": [{"label": "A", "text": "Obtaining food ingredients from approved, reputable suppliers"}, {"label": "B", "text": "Destroying harmful bacteria by thorough cooking or heat processing"}, {"label": "C", "text": "Preventing existing bacteria from multiplying to dangerous levels"}, {"label": "D", "text": "Masking the sour odour of spoiled raw meat with spices before cooking  GROWTH & SPORES (pp. 6–9)"}], "correctOption": "D", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 11, "sourcePage": 4}, {"id": 487, "chapterId": "food-02", "subtopic": "Microbiological Hazards, Bacterial Growth & Spores", "question": "What is the fundamental difference between spoilage bacteria and pathogenic bacteria (pathogens)?", "options": [{"label": "A", "text": "Spoilage bacteria cause death, whereas pathogens only make food look green"}, {"label": "B", "text": "Spoilage bacteria multiply at 0°C, while pathogens only survive above 100°C"}, {"label": "C", "text": "Spoilage bacteria cause detectable changes (odour, slime, discolouration), whereas pathogens cause illness without altering the look, smell, or taste of food"}, {"label": "D", "text": "Spoilage bacteria can only be detected by laboratory examination"}], "correctOption": "C", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 12, "sourcePage": 5}, {"id": 488, "chapterId": "food-02", "subtopic": "Microbiological Hazards, Bacterial Growth & Spores", "question": "Why is it impossible to rely on human senses (sight, smell, taste) to identify food contaminated with pathogens?", "options": [{"label": "A", "text": "Pathogens only grow on dry foods"}, {"label": "B", "text": "Pathogens have no observable effect on the appearance, texture, aroma, or flavour of food"}, {"label": "C", "text": "Pathogens evaporate into the air when food is sniffed"}, {"label": "D", "text": "Pathogens always turn food estion Bank", "sourceQuestionId": 16, "sourcePage": 5}, {"id": 492, "chapterId": "food-02", "subtopic": "Microbiological Hazards, Bacterial Growth & Spores", "question": "At what temperature do most food poisoning bacteria multiply most rapidly?", "options": [{"label": "A", "text": "5°C"}, {"label": "B", "text": "20°C"}, {"label": "C", "text": "37°C (human body temperature)"}, {"label": "D", "text": "63°C"}], "correctOption": "C", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 17, "sourcePage": 5}, {"id": 493, "chapterId": "food-02", "subtopic": "Microbiological Hazards, Bacterial Growth & Spores", "question": "What is the exact temperature range of the Temperature Danger Zone where food poisoning bacteria multiply rapidly?", "options": [{"label": "A", "text": "0°C to 100°C"}, {"label": "B", "text": "5°C to 60°C"}, {"label": "C", "text": "-18°C to 4°C"}, {"label": "D", "text": "60°C to 75°C"}], "correctOption": "B", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 18, "sourcePage": 5}, {"id": 494, "chapterId": "food-02", "subtopic": "Microbiological Hazards, Bacterial Growth & Spores", "question": "What occurs to bacterial cells when high-risk food is placed in a domestic freezer at -18°C?", "options": [{"label": "A", "text": "All vegetative bacteria and spores are instantly killed"}, {"label": "B", "text": "Bacteria multiply slowly at the core"}, {"label": "C", "text": "Bacterial multiplication ceases completely, but many bacteria survive and will multiply once thawed"}, {"label": "D", "text": "Toxins are neutralized by cold crystal formation"}], "correctOption": "C", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 19, "sourcePage": 6}, {"id": 495, "chapterId": "food-02", "subtopic": "Microbiological Hazards, Bacterial Growth & Spores", "question": "What is a bacterial spore?", "options": [{"label": "A", "text": "A reproductive seed that produces millions of ": "D", "text": "Dry biscuits and salted crackers"}], "correctOption": "C", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 26, "sourcePage": 7}, {"id": 502, "chapterId": "food-03", "subtopic": "Food Classifications & Food Spoilage", "question": "Why is cooked rice classified as a high-risk food?", "options": [{"label": "A", "text": "It contains natural cyanide"}, {"label": "B", "text": "It provides moisture and nutrients, and can harbour heat-resistant spores of Bacillus cereus that germinate if cooled slowly"}, {"label": "C", "text": "It reacts chemically with stainless steel pots"}, {"label": "D", "text": "It has a high acid content"}], "correctOption": "B", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 27, "sourcePage": 7}, {"id": 503, "chapterId": "food-03", "subtopic": "Food Classifications & Food Spoilage", "question": "What prevents bacteria from multiplying in low-risk foods such as dried pasta, jam, salted crisps, and vinegar pickles?", "options": [{"label": "A", "text": "High moisture levels"}, {"label": "B", "text": "Low water activity (dryness), high concentrations of sugar or salt, or high acidity (low pH)"}, {"label": "C", "text": "Freezing temperatures inside the packaging"}, {"label": "D", "text": "The presence of synthetic food colourings"}], "correctOption": "B", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 28, "sourcePage": 7}, {"id": 504, "chapterId": "food-03", "subtopic": "Food Classifications & Food Spoilage", "question": "What happens when clean water is added to a low-risk food, such as dried milk powder or powdered instant soup?", "options": [{"label": "A", "text": "It becomes sterile"}, {"label": "B", "text": "It remains low-risk indefinitely"}, {"label": "C", "text": "It becomes a high-risk food and must be refrigerated or consumed immediately"}, {"label": "D", "text": "It can be safely stored at room temperature for several weeks"}], "correctOption": "C", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 29, "sourcePage": 7}, {"id": 505, "chapterId": "food-03", "subtopic": "Food Classifications & Food Spoilage", "question": "Why must ready-to-eat raw salad vegetables (such as lettuce, beansprouts, spinach, and tomatoes) be washed thoroughly in clean running water before service?", "options": [{"label": "A", "text": "To remove natural sugars"}, {"label": "B", "text": "They may carry pathogenic bacteria, parasites, or viruses from soil, manure, or irrigation water, and will not undergo cooking"}, {"label": "C", "text": "To prevent them from fermenting into alcohol"}, {"label": "D", "text": "To soften their cell walls for easier slicing"}], "correctOption": "B", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 30, "sourcePage": 7}, {"id": 506, "chapterId": "food-03", "subtopic": "Food Classifications & Food Spoilage", "question": "When does food spoilage commence?", "options": [{"label": "A", "text": "Only after food passes its expiry date by 10 days"}, {"label": "B", "text": "As soon as food is harvested, gathered, taken from the sea, or slaughtered"}, {"label": "C", "text": "Only when flies land directly on the food"}, {"label": "D", "text": "When food is frozen below -18°C"}], "correctOption": "B", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 31, "sourcePage": 7}, {"id": 507, "chapterId": "food-03", "subtopic": "Food Classifications & Food Spoilage", "question": "Which of the following is an observable sign of food spoilage?", "options": [{"label": "A", "text": "Pure transparent ice crystals"}, {"label": "B", "text": "Off-odours, surface slime or stickiness, discolouration, mould growth, and gas production (bulging cans)"}, {"label": "C", "text": "An internal temperature of 75°C"}, {"label": "D", "text": "Clean, dry outer packaging"}], "correctOption": "B", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 32, "sourcePage": 8}, {"id": 508, "chapterId": "food-03", "subtopic": "Food Classifications & Food Spoilage", "question": "What action must be taken with a canned food product displaying blown or bulging ends?", "options": [{"label": "A", "text": "Boil the can for 10 minutes and serve"}, {"label": "B", "text": "Place the can in the freezer to reduce the gas"}, {"label": "C", "text": "Condemn and dispose of the can immediately (indicates microbial gas production or spoilage)"}, {"label": "D", "text": "Pierce the can to release gas and use within 24 hours DISEASES (pp. 11–12)"}], "correctOption": "C", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 33, "sourcePage": 8}, {"id": 509, "chapterId": "food-04", "subtopic": "Food Poisoning Causes & Foodborne Diseases", "question": "Which type of food poisoning organism cannot multiply inside food or water, but instead uses food solely as a vehicle to enter living human host cells?", "options": [{"label": "A", "text": "Spoilage bacteria"}, {"label": "B", "text": "Foodborne viruses (e.g., norovirus)"}, {"label": "C", "text": "Yeasts"}, {"label": "D", "text": "Bacterial spores"}], "correctOption": "B", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 34, "sourcePage": 9}, {"id": 510, "chapterId": "food-04", "subtopic": "Food Poisoning Causes & Foodborne Diseases", "question": "What are mycotoxins?", "options": [{"label": "A", "text": "Chemicals sprayed on fruit trees"}, {"label": "B", "text": "Toxic chemical substances produced by certain moulds growing on foods such as nuts, figs, and cereals"}, {"label": "C", "text": "Metals leached from copper pipes"}, {"label": "D", "text": "Enzymes found in fish intestines"}], "correctOption": "B", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 35, "sourcePage": 9}, {"id": 511, "chapterId": "food-04", "subtopic": "Food Poisoning Causes & Foodborne Diseases", "question": "What is the primary cause of chemical food poisoning in commercial kitchens?", "options": [{"label": "A", "text": "Over-seasoning dishes with table salt"}, {"label": "B", "text": "Storing cleaning chemicals in unlabelled food containers, or accidental contamination from spraying chemicals near open food"}, {"label": "C", "text": "Using clean stainless steel cookware"}, {"label": "D", "text": "Storing food in food-grade plastic containers"}], "correctOption": "B", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 36, "sourcePage": 9}, {"id": 512, "chapterId": "food-04", "subtopic": "Food Poisoning Causes & Foodborne Diseases", "question": "Which of the following is a recognized source of poisonous biological toxins?", "options": [{"label": "A", "text": "Well-done beef steaks"}, {"label": "B", "text": "Japanese puffer fish (fugu), toadstools, and raw or undercooked red kidney beans"}, {"label": "C", "text": "Pasteurized whole milk"}, {"label": "D", "text": "Canned baked beans"}], "correctOption": "B", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 37, "sourcePage": 9}, {"id": 513, "chapterId": "food-04", "subtopic": "Food Poisoning Causes & Foodborne Diseases", "question": "How does metallic food poisoning typically occur?", "options": [{"label": "A", "text": "Storing dry rice in clean stainless steel bins"}, {"label": "B", "text": "Storing acidic foods (e.g., fruit juices, tomato sauce) in contact with reactive metals such as copper, zinc, or cadmium"}, {"label": "C", "text": "Using blue metal-detectable plasters on minor cuts"}, {"label": "D", "text": "Using cast iron pans for searing steaks"}], "correctOption": "B", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 38, "sourcePage": 9}, {"id": 514, "chapterId": "food-04", "subtopic": "Food Poisoning Causes & Foodborne Diseases", "question": "Metallic food poisoning is clinically characterized by severe vomiting and abdominal pain that begins within:", "options": [{"label": "A", "text": "24 to 48 hours"}, {"label": "B", "text": "Less than 1 hour"}, {"label": "C", "text": "5 to 7 days"}, {"label": "D", "text": "2 weeks"}], "correctOption": "B", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 39, "sourcePage": 9}, {"id": 515, "chapterId": "food-04", "subtopic": "Food Poisoning Causes & Foodborne Diseases", "question": "What is the fundamental difference between food poisoning and foodborne infections or diseases?", "options": [{"label": "A", "text": "Food poisoning requires hospital treatment, whereas foodborne disease does not"}, {"label": "B", "text": "Food poisoning usually requires large numbers of bacteria multiplying in food, whereas foodborne disease requires only a very small number of organisms (low infectious dose) using food purely as a vehicle"}, {"label": "C", "text": "Foodborne disease is caused exclusively by heavy metals"}, {"label": "D", "text": "Food poisoning cannot be transmitted from person to person"}], "correctOption": "B", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 40, "sourcePage": 9}, {"id": 516, "chapterId": "food-04", "subtopic": "Food Poisoning Causes & Foodborne Diseases", "question": "What is the faecal-oral route of disease transmission?", "options": [{"label": "A", "text": "Inhaling dust particles during flour sifting"}, {"label": "B", "text": "Pathogenic organisms excreted in faeces are transferred via contaminated hands, water, sewage, or pests onto food, which is then eaten"}, {"label": "C", "text": "Swallowing chemical fumes in dishwashing areas"}, {"label": "D", "text": "Touching raw meat with clean, sanitized tongs"}], "correctOption": "B", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 41, "sourcePage": 10}, {"id": 517, "chapterId": "food-04", "subtopic": "Food Poisoning Causes & Foodborne Diseases", "question": "What are the two major hazards that management and food handlers must control to prevent food poisoning outbreaks?", "options": [{"label": "A", "text": "The cost of raw ingredients and the speed of service"}, {"label": "B", "text": "(1) The contamination of ready-to-eat food, and (2) the multiplication of bacteria within food"}, {"label": "C", "text": "The colour of kitchen walls and the choice of cooking oil"}, {"label": "D", "text": "The brand of chef uniforms and the size of dining menus CROSS-CONTAMINATION (pp. 13–18) THE FOOD POISONING CHAIN: [Food Contaminated] ---> [Bacteria Multiply] ---> [Person Eats Contaminated Food]"}], "correctOption": "B", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 42, "sourcePage": 10}, {"id": 518, "chapterId": "food-05", "subtopic": "Contamination, Vehicles & Cross-Contamination", "question": "What are the three essential links in the Food Poisoning Chain?", "options": [{"label": "A", "text": "Food purchased → food cooked → food frozen"}, {"label": "B", "text": "Food becomes contaminated → bacteria multiply → susceptible person eats contaminated food"}, {"label": "C", "text": "Food chopped → food weighed → food billed"}, {"label": "D", "text": "Menu printed → order taken → dish cleared"}], "correctOption": "B", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 43, "sourcePage": 11}, {"id": 519, "chapterId": "food-05", "subtopic": "Contamination, Vehicles & Cross-Contamination", "question": "What is the primary human reservoir where food handlers commonly carry food poisoning bacteria (such as Staphylococcus aureus)?", "options": [{"label": "A", "text": "Ear lobes and fingernail polish"}, {"label": "B", "text": "Nose, mouth, intestines, skin, infected cuts, and boils"}, {"label": "C", "text": "Soles of non-slip shoes"}, {"label": "D", "text": "Clean chef jackets"}], "correctOption": "B", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 44, "sourcePage": 11}, {"id": 520, "chapterId": "food-05", "subtopic": "Contamination, Vehicles & Cross-Contamination", "question": "Why are houseflies dangerous vectors of microbiological contamination?", "options": [{"label": "A", "text": "They inject venom into raw vegetables"}, {"label": "B", "text": "They feed on animal faeces, carry millions of bacteria on their hairy bodies and legs, and vomit or defecate onto food during feeding"}, {"label": "C", "text": "They lay eggs exclusively in dry salt containers"}, {"label": "D", "text": "They produce chemical weedkillers"}], "correctOption": "B", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 45, "sourcePage": 11}, {"id": 521, "chapterId": "food-05", "subtopic": "Contamination, Vehicles & Cross-Contamination", "question": "How do rodents (rats and mice) contaminate open food and food-contact surfaces?", "options": [{"label": "A", "text": "By leaving clean fur markings on dry cans"}, {"label": "B", "text": "Through their droppings, urine, hairs, gnawing, and feet carrying pathogens from sewers"}, {"label": "C", "text": "By dropping water from their tails"}, {"label": "D", "text": "By creating static electricity on shelves"}], "correctOption": "B", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 46, "sourcePage": 11}, {"id": 522, "chapterId": "food-05", "subtopic": "Contamination, Vehicles & Cross-Contamination", "question": "What is the difference between a source and a vehicle of bacterial contamination?", "options": [{"label": "A", "text": "A source is a vehicle with wheels; a vehicle is stationary"}, {"label": "B", "text": "A source is the origin where bacteria naturally live (e.g., raw meat, intestines, pests); a vehicle is the intermediate object or surface that transfers bacteria to food (e.g., hands, cloths, knives)"}, {"label": "C", "text": "A source is always chemical; a vehicle is always
