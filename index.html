<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF9F0;--card:#fff;--ink:#18233B;--mut:#5b6580;--line:#ece3d4;--sh:0 8px 24px rgba(24,35,59,.08);--ok:#128a72;--bad:#c9304a;--r:20px}
[data-theme=dark]{--bg:#111a2e;--card:#1b2742;--ink:#f6efe3;--mut:#a9b3cc;--line:#2c3a5c;--sh:0 8px 24px rgba(0,0,0,.35);--ok:#4fe0c2;--bad:#ff8497}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 'DM Sans',system-ui,sans-serif;background-image:radial-gradient(circle at 10% 0,#ffad3622,transparent 40%),radial-gradient(circle at 90% 10%,#7282ff22,transparent 40%);min-height:100vh;overflow-x:hidden}
h1,h2,h3{font-family:Fraunces,Georgia,serif;line-height:1.15;margin:0 0 .5em}h1{font-size:clamp(2rem,6vw,3.6rem);font-weight:800}h2{font-size:1.7rem}
a{color:inherit}button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid #7282ff;outline-offset:2px}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav{display:flex;align-items:center;gap:6px;max-width:1100px;margin:auto;padding:8px 14px;overflow-x:auto;scrollbar-width:none}
.logo{font:800 1.2rem Fraunces,serif;white-space:nowrap;margin-right:auto;text-decoration:none}
nav a.n{padding:9px 13px;border-radius:99px;text-decoration:none;white-space:nowrap;font-weight:500;min-height:44px;display:flex;align-items:center}
nav a.n[aria-current=page]{background:var(--ink);color:var(--bg)}
main{max-width:1100px;margin:auto;padding:22px 14px 80px;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:20px;border:1px solid var(--line)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.btn{border:0;border-radius:14px;padding:12px 20px;font-weight:700;background:var(--ink);color:var(--bg);min-height:46px;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}.btn.pri{background:#FF6578;color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.hero{display:grid;gap:24px;grid-template-columns:1.3fr 1fr;align-items:center;padding:10px 0 26px}
.hero p{font-size:1.15rem;color:var(--mut)}.hero .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}.stat b{display:block;font:800 1.8rem Fraunces,serif}.stat span{color:var(--mut);font-size:.85rem}
.ring{--p:0;width:130px;height:130px;border-radius:50%;background:conic-gradient(#36C9AE calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;transition:.8s}.ring i{font:800 1.5rem Fraunces,serif;font-style:normal;background:var(--card);width:100px;height:100px;border-radius:50%;display:grid;place-items:center}
.ch{position:relative;overflow:hidden;border-top:8px solid var(--c);transition:transform .2s,box-shadow .2s}.ch:hover{transform:translateY(-4px)}
.ch .em{font-size:2.4rem;position:absolute;right:12px;top:6px;opacity:.9}.bar{height:9px;background:var(--line);border-radius:9px;overflow:hidden}.bar>div{height:100%;background:var(--c,#36C9AE);transition:width .5s;border-radius:9px}
.mut{color:var(--mut);font-size:.9rem}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sp{flex:1}
.opt{display:flex;gap:12px;width:100%;text-align:left;padding:14px 16px;margin:10px 0;border-radius:16px;border:2px solid var(--line);background:var(--card);min-height:56px;align-items:center;transition:.15s}
.opt:hover:not(:disabled){border-color:var(--c);transform:translateY(-2px)}.opt .l{flex:none;width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:700}
.opt.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--card))}.opt.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--card))}.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--card))}
.opt .tag{margin-left:auto;font-weight:700;white-space:nowrap}
.q{font:600 1.4rem/1.35 Fraunces,serif}.fb{padding:12px 16px;border-radius:14px;margin-top:12px;font-weight:500}.fb.good{background:color-mix(in srgb,var(--ok) 16%,transparent)}.fb.bad{background:color-mix(in srgb,var(--bad) 14%,transparent)}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}.pal button{height:40px;border-radius:10px;border:2px solid var(--line);background:var(--card)}.pal .a{background:#7282FF;color:#fff;border-color:#7282FF}.pal .f{outline:3px solid #FFAD36}.pal .c{border:3px solid var(--ink)}
.two{display:grid;gap:16px;grid-template-columns:1fr 280px}
input,select{font:inherit;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);min-height:44px}
label.k{display:flex;gap:8px;align-items:center;margin:8px 0}table{border-collapse:collapse;width:100%}td,th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
details{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px;margin:10px 0}summary{font-weight:700;cursor:pointer;min-height:32px}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:50}
.pop{position:fixed;font-size:1.6rem;pointer-events:none;animation:fly 1.3s ease-out forwards;z-index:40}@keyframes fly{to{transform:translate(var(--x),-260px) rotate(360deg);opacity:0}}
.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;z-index:60;padding:16px}.modal .card{max-width:420px}
@media(max-width:760px){.hero,.two{grid-template-columns:1fr}.q{font-size:1.2rem}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

f)"}, {"label": "C", "text": "Steward"}, {"label": "D", "text": "Manager"}], "correctOption": "B", "sourcePage": 3}, {"id": 11, "chapterId": "ch1", "subtopic": "Professionalism & Hygiene", "question": "Professionalism includes all EXCEPT:", "options": [{"label": "A", "text": "Punctuality"}, {"label": "B", "text": "Respect"}, {"label": "C", "text": "Gossiping in the kitchen"}, {"label": "D", "text": "Positive attitude"}], "correctOption": "C", "sourcePage": 3}, {"id": 12, "chapterId": "ch1", "subtopic": "Professionalism & Hygiene", "question": "Mise en place means:", "options": [{"label": "A", "text": "Everything in its place"}, {"label": "B", "text": "Clean as you go"}, {"label": "C", "text": "First in, first out"}, {"label": "D", "text": "Time-temperature control"}], "correctOption": "A", "sourcePage": 3}, {"id": 13, "chapterId": "ch1", "subtopic": "Professionalism & Hygiene", "question": "The most important habit to prevent foodborne illness:", "options": [{"label": "A", "text": "Wearing a hat"}, {"label": "B", "text": "Proper handwashing"}, {"label": "C", "text": "Gloves only"}, {"label": "D", "text": "Mopping"}], "correctOption": "B", "sourcePage": 3}, {"id": 14, "chapterId": "ch1", "subtopic": "Professionalism & Hygiene", "question": "Hands should be washed for at least:", "options": [{"label": "A", "text": "5 sec"}, {"label": "B", "text": "10 sec"}, {"label": "C", "text": "20 sec"}, {"label": "D", "text": "2 sec"}], "correctOption": "C", "sourcePage": 3}, {"id": 15, "chapterId": "ch1", "subtopic": "Professionalism & Hygiene", "question": "Cross-contamination is:", "options": [{"label": "A", "text": "Proper cooking"}, {"label": "B", "text": "Transfer of harmful bacteria from one food/surface to another"}, {"label": "C", "text": "Freezing"}, {"label": "D", "text": "Chilling"}], "correctOption": "B", "sourcePage": 3}, {"id": 16, "chapterId": "ch3", "subtopic": "Heat Transfer", "question": "Heat transfer is the movement of:", "options": [{"label": "A", "text": "Cold"}, {"label": "B", "text": "Energy from a heat source to food"}, {"label": "C", "text": "Water"}, {"label": "D", "text": "Air only"}], "correctOption": "B", "sourcePage": 4}, {"id": 17, "chapterId": "ch3", "subtopic": "Heat Transfer", "question": "Conduction is heat transfer by:", "options": [{"label": "A", "text": "Air currents"}, {"label": "B", "text": "Direct contact (pan → food)"}, {"label": "C", "text": "Waves"}, {"label": "D", "text": "Steam only"}], "correctOption": "B", "sourcePage": 4}, {"id": 18, "chapterId": "ch3", "subtopic": "Heat Transfer", "question": "Convection is heat transfer by:", "options": [{"label": "A", "text": "Direct contact"}, {"label": "B", "text": "Movement of liquids or gases (hot air/water circulating)"}, {"label": "C", "text": "Infrared waves"}, {"label": "D", "text": "Metal only"}], "correctOption": "B", "sourcePage": 4}, {"id": 19, "chapterId": "ch3", "subtopic": "Heat Transfer", "question": "Natural convection occurs when:", "options": [{"label": "A", "text": "A fan forces air"}, {"label": "B", "text": "Hot liquid/gas rises and cooler sinks"}, {"label": "C", "text": "Food touches metal"}, {"label": "D", "text": "No movement"}], "correctOption": "B", "sourcePage": 4}, {"id": 20, "chapterId": "ch3", "subtopic": "Heat Transfer", "question": "Mechanical (forced) convection happens in a:", "options": [{"label": "A", "text": "Stockpot"}, {"label": "B", "text": "Convection oven (fan circulates hot air)"}, {"label": "C", "text": "Griddle"}, {"label": "D", "text": "Sauté pan"}], "correctOption": "B", "sourcePage": 4}, {"id": 21, "chapterId": "ch3", "subtopic": "Heat Transfer", "question": "Radiation is heat transfer by:", "options": [{"label": "A", "text": "Contact"}, {"label": "B", "text": "Electromagnetic (infrared) waves without contact"}, {"label": "C", "text": "Water movement"}, {"label": "D", "text": "Metal only"}], "correctOption": "B", "sourcePage": 4}, {"id": 22, "chapterId": "ch3", "subtopic": "Heat Transfer", "question": "Radiant-heat cooking examples:", "options": [{"label": "A", "text": "Boiling"}, {"label": "B", "text": "Broiling, grilling, toasting"}, {"label": "C", "text": "Poaching"}, {"label": "D", "text": "Braising"}], "correctOption": "B", "sourcePage": 4}, {"id": 23, "chapterId": "ch3", "subtopic": "Heat Transfer", "question": "Induction cooking works by:", "options": [{"label": "A", "text": "Heating air"}, {"label": "B", "text": "Magnetic field that heats the pan directly"}, {"label": "C", "text": "Radiant coils"}, {"label": "D", "text": "Gas flame"}], "correctOption": "B", "sourcePage": 4}, {"id": 24, "chapterId": "ch3", "subtopic": "Heat Transfer", "question": "The most energy-efficient heat source listed:", "options": [{"label": "A", "text": "Gas"}, {"label": "B", "text": "Induction"}, {"label": "C", "text": "Electric coil"}, {"label": "D", "text": "Charcoal"}], "correctOption": "B", "sourcePage": 4}, {"id": 25, "chapterId": "ch3", "subtopic": "Browning Reactions", "question": "Caramelization is the browning of:", "options": [{"label": "A", "text": "Sugar"}, {"label": "B", "text": "Protein"}, {"label": "C", "text": "Starch"}, {"label": "D", "text": "Fat"}], "correctOption": "A", "sourcePage": 5}, {"id": 26, "chapterId": "ch3", "subtopic": "Browning Reactions", "question": "The Maillard reaction is browning of:", "options": [{"label": "A", "text": "Pure sugar"}, {"label": "B", "text": "Proteins/amino acids + carbohydrates (e.g., roasted meat surface)"}, {"label": "C", "text": "Only fat"}, {"label": "D", "text": "Water"}], "correctOption": "B", "sourcePage": 5}, {"id": 27, "chapterId": "ch3", "subtopic": "Browning Reactions", "question": "Roasting is done:", "options": [{"label": "A", "text": "Uncovered"}, {"label": "B", "text": "Always covered"}, {"label": "C", "text": "In water"}, {"label": "D", "text": "In steam"}], "correctOption": "A", "sourcePage": 5}, {"id": 28, "chapterId": "ch3", "subtopic": "Dry-Heat Methods", "question": "Dry-heat cooking uses:", "options": [{"label": "A", "text": "Water/steam"}, {"label": "B", "text": "Air, fat, metal or radiation"}, {"label": "C", "text": "Only steam"}, {"label": "D", "text": "Only water"}], "correctOption": "B", "sourcePage": 5}, {"id": 29, "chapterId": "ch3", "subtopic": "Dry-Heat Methods", "question": "Roasting is:", "options": [{"label": "A", "text": "Cooking in liquid"}, {"label": "B", "text": "Dry-heat oven cooking, usually uncovered on a rack"}, {"label": "C", "text": "Covered pot with liquid"}, {"label": "D", "text": "Blanching"}], "correctOption": "B", "sourcePage": 5}, {"id": 30, "chapterId": "ch3", "subtopic": "Dry-Heat Methods", "question": "Baking differs from roasting mainly in:", "options": [{"label": "A", "text": "Temperature only"}, {"label": "B", "text": "The foods cooked (breads/pastries vs meats/vegetables)"}, {"label": "C", "text": "No difference"}, {"label": "D", "text": "Equipment"}], "correctOption": "B", "sourcePage": 5}, {"id": 31, "chapterId": "ch3", "subtopic": "Dry-Heat Methods", "question": "Broiling cooks with:", "options": [{"label": "A", "text": "Heat from below"}, {"label": "B", "text": "Intense radiant heat from above"}, {"label": "C", "text": "Convection only"}, {"label": "D", "text": "Immersion"}], "correctOption": "B", "sourcePage": 5}, {"id": 32, "chapterId": "ch3", "subtopic": "Dry-Heat Methods", "question": "Grilling differs from broiling because the heat source is:", "options": [{"label": "A", "text": "Below the food"}, {"label": "B", "text": "Above"}, {"label": "C", "text": "Steam"}, {"label": "D", "text": "None"}], "correctOption": "A", "sourcePage": 5}, {"id": 33, "chapterId": "ch3", "subtopic": "Dry-Heat Methods", "question": "Sautéing means:", "options": [{"label": "A", "text": "Large amount of liquid"}, {"label": "B", "text": "Quick cooking in a little fat over high heat, tossing/stirring"}, {"label": "C", "text": "Deep-frying"}, {"label": "D", "text": "Poaching"}], "correctOption": "B", "sourcePage": 5}, {"id": 34, "chapterId": "ch3", "subtopi <script>
"use strict";
const {chapters:CHS,questions:QS}=window.DATA, QB=Object.fromEntries(QS.map(q=>[q.id,q]));
const META={ch1:['#FF6578','🧑‍🍳'],ch3:['#FFAD36','🔥'],ch4:['#35B5EE','🔪'],ch5:['#B68DF2','🍲'],ch6:['#36C9AE','🥕'],ch11:['#35B5EE','🐟'],ch12:['#FFAD36','🧀'],rapid:['#7282FF','⚡']};
const CHB=Object.fromEntries(CHS.map(c=>[c.id,{...c,color:META[c.id][0],em:META[c.id][1],ids:QS.filter(q=>q.chapterId===c.id).map(q=>q.id)}]));
const KEY='flavorlab.v1';
const blank=()=>({v:1,att:{},bm:[],mast:[],exams:[],days:[],theme:null,resume:null});
let st=blank(),memOnly=false;
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&o.v===1)st={...blank(),...o}}}catch(e){memOnly=true;try{localStorage.setItem(KEY+'.bad',localStorage.getItem(KEY))}catch(_){}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){memOnly=true}}
load();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=s=>document.querySelector(s),app=$('#app');
const today=()=>new Date().toISOString().slice(0,10);
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const say=t=>{$('#live').textContent=t};
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2200)}
function burst(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;for(let i=0;i<22;i++){const e=document.createElement('div');e.className='pop';e.textContent=['🍅','🧀','🌿','🍋','⭐','🥕'][i%6];e.style.left=(30+Math.random()*40)+'vw';e.style.top='60vh';e.style.setProperty('--x',(Math.random()*300-150)+'px');document.body.append(e);setTimeout(()=>e.remove(),1400)}}
/* ---------- pure logic ---------- */
function score(answers,qids){let c=0,w=0,u=0;for(const id of qids){const a=answers[id];if(!a)u++;else if(a===QB[id].correctOption)c++;else w++}return{c,w,u,pct:qids.length?Math.round(c/qids.length*100):0}}
function prep(ids,shuf){return ids.map(id=>{const q=QB[id];const o=shuf?shuffle(q.options):q.options;return{id,opts:o.map((x,i)=>({orig:x.label,text:x.text,show:'ABCDE'[i]}))}})}
function record(id,ok){const a=st.att[id]||{r:0,w:0,ok:null};ok?a.r++:a.w++;a.ok=ok;a.t=Date.now();st.att[id]=a;const d=today();if(!st.days.includes(d))st.days.push(d);if(ok&&st.mast.includes(id)===false&&false){}}
function streak(){const s=new Set(st.days);let n=0,d=new Date();if(!s.has(d.toISOString().slice(0,10)))d.setDate(d.getDate()-1);while(s.has(d.toISOString().slice(0,10))){n++;d.setDate(d.getDate()-1)}return n}
const isMastered=id=>st.mast.includes(id)||(st.att[id]&&st.att[id].r>=2&&st.att[id].ok);
function chStats(c){const ids=CHB[c].ids;let t=0,r=0,w=0;ids.forEach(i=>{const a=st.att[i];if(a){t++;r+=a.r;w+=a.w}});return{att:t,total:ids.length,pct:Math.round(t/ids.length*100),acc:r+w?Math.round(r/(r+w)*100):null}}
function overall(){let t=0,r=0,w=0;QS.forEach(q=>{const a=st.att[q.id];if(a){t++;r+=a.r;w+=a.w}});return{att:t,acc:r+w?Math.round(r/(r+w)*100):null,done:CHS.filter(c=>chStats(c.id).att===CHB[c.id].ids.length).length}}
/* ---------- router ---------- */
let S=null,timer=null;
function nav(){clearInterval(timer);const h=(location.hash||'#/').slice(2).split('?')[0];document.querySelectorAll('nav a.n').forEach(a=>a.removeAttribute('aria-current'));const cur=document.querySelector(`nav a.n[href="#/${h}"]`);if(cur)cur.setAttribute('aria-current','page');

addEventListener('hashchange',nav);
$('#theme').onclick=()=>{const d=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=d;st.theme=d;save()};
document.documentElement.dataset.theme=st.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
/* ---------- home ---------- */
function home(){const o=overall(),n=streak(),pct=Math.round(o.att/QS.length*100);
 const msg=o.att===0?"Fresh apron, clean board. Pick a chapter and start cooking!":o.acc>=80?`Sharp work — ${o.acc}% accuracy. Keep the edge honed.`:o.acc>=50?`Solid base at ${o.acc}%. Your Mistake Notebook is the fastest way up.`:`Every chef burns a few dishes. Review the Mistake Notebook and go again.`;
 const rs=st.resume&&st.resume.qids?.length?`<button class="btn pri" id="res">Continue last session</button>`:'';

 <div class="card"><div class="row" style="justify-content:center"><div class="ring" style="--p:${pct}"><i>${pct}%</i></div></div><div class="stats" style="margin-top:14px">
 <div class="stat"><b>${QS.length}</b><span>questions available</span></div><div class="stat"><b>${o.att}</b><span>attempted</span></div><div class="stat"><b>${o.acc==null?'—':o.acc+'%'}</b><span>accuracy</span></div><div class="stat"><b>${o.done}/${CHS.length}</b><span>chapters completed</span></div><div class="stat"><b>${n} 🔥</b><span>day streak</span></div></div></div></section>
 <h2 id="chapters">Chapters</h2><div class="grid">${CHS.map(c=>{const b=CHB[c.id],s=chStats(c.id);return`<article class="card ch" style="--c:${b.color}"><span class="em" aria-hidden="true">${b.em}</span><h3>${esc(c.id==='rapid'?c.title:'Ch. '+c.id.replace('ch','')+' — '+c.title).replace('Ch. 1 —','Ch. 1 —')}</h3><p class="mut">${b.ids.length} questions · Q${c.from}–${c.to}</p><div class="bar" role="progressbar" aria-valuenow="${s.pct}" aria-valuemin="0" aria-valuemax="100"><div style="width:${s.pct}%"></div></div><p class="mut">${s.pct}% attempted · ${s.acc==null?'no accuracy yet':s.acc+'% accuracy'}</p><button class="btn" data-ch="${c.id}">${s.att?'Continue':'Start'}</button></article>`}).join('')}</div>
 <p class="mut" style="margin-top:28px">${memOnly?'⚠ Browser storage is unavailable — progress will be lost when you close this tab. ':''}Progress is stored only in this browser on this device and does not sync across devices. <a href="#/progress">Export / reset</a></p>`;
 app.querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>chapterStart(b.dataset.ch));
 $('#daily').onclick=daily;const r=$('#res');if(r)r.onclick=()=>{const x=st.resume;startSession({...x,resumed:true})}}
function chapterStart(id){const b=CHB[id],un=b.ids.filter(i=>!st.att[i]);const ids=un.length&&un.length<b.ids.length?[...un,...b.ids.filter(i=>st.att[i])]:b.ids;startSession({mode:'practice',title:b.title,color:b.color,qids:ids,shuf:true})}
function daily(){let seed=+today().replace(/-/g,'');const r=()=>(seed=(seed*1664525+1013904223)%4294967296)/4294967296;const pool=QS.map(q=>q.id);for(let i=pool.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}startSession({mode:'practice',title:"Daily Chef's Challenge",color:'#FF6578',qids:pool.slice(0,5),shuf:true})}
/* ---------- session engine ---------- */
function startSession(o){S={mode:o.mode,title:o.title,color:o.color||'#7282FF',items:o.items||prep(o.qids,o.shuf!==false),cur:o.cur||0,ans:o.ans||{},flags:new Set(o.flags||[]),locked:o.locked||{},limit:o.limit||0,end:o.limit?Date.now()+o.limit*1000:0,start:Date.now(),streakNow:0,best:0,pts:0,done:false};
 if(S.mode!=='exam'){persist()}location.hash='#/play';if(location.hash==='#/play')nav()}
function persist(){if(!S||S.mode==='exam'||S.done)return;st.resume={mode:S.mode,title:S.title,color:S.color,qids:S.items.map(i=>i.id),items:S.items,cur:S.cur,ans:S.ans,locked:S.locked,shuf:false};save()}
function playView(){if(S.done)return;const it=S.items[S.cur],q=QB[it.id],ex=S.mode==='exam',lock=!ex&&S.locked[it.id],a=S.ans[it.id];

 const card=`<section class="card" style="--c:${S.color}"><div class="row"><span class="mut">${esc(S.title)} · Question ${S.cur+1} of ${S.items.length} · Q#${q.id}</span><span class="sp"></span>${S.mode==='rapid'?`<b>⚡ ${S.pts} pts · streak ${S.streakNow}</b>`:''}${ex?'':`<button class="btn ghost" id="bm" aria-pressed="${st.bm.includes(q.id)}">${st.bm.includes(q.id)?'★ Saved':'☆ Bookmark'}</button>`}${ex?`<button class="btn ghost" id="fl" aria-pressed="${S.flags.has(q.id)}">${S.flags.has(q.id)?'⚑ Flagged':'⚐ Flag'}</button>`:''}</div>
 <div class="bar" style="margin:10px 0"><div style="width:${(S.cur+1)/S.items.length*100}%;background:${S.color}"></div></div>

 ${lock?`<div class="fb ${a===q.correctOption?'good':'bad'}" role="status">${a===q.correctOption?'✓ Correct!':'✗ Not quite.'} The answer is <b>${esc(it.opts.find(o=>o.orig===q.correctOption).show+'. '+it.opts.find(o=>o.orig===q.correctOption).text)}</b>.<div class="mut">Source: question bank p.${q.sourcePage}. No explanation is given in the source PDF.</div></div>`:''}
 <div class="row" style="margin-top:16px"><button class="btn ghost" id="pv" ${S.cur===0?'disabled':''}>← Previous</button>${S.mode==='practice'&&!lock?'<button class="btn ghost" id="sk">Skip</button>':''}<span class="sp"></span>${S.cur<S.items.length-1?'<button class="btn" id="nx">Next →</button>':(ex?'':'<button class="btn pri" id="fin">Finish</button>')}</div>
 <p class="mut">Keys: A–D choose · ← → navigate</p></section>`;

 app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(b.dataset.o));
 app.querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>go(+b.dataset.j));
 const g=(id,f)=>{const e=$(id);if(e)e.onclick=f};g('#pv',()=>go(S.cur-1));g('#nx',()=>go(S.cur+1));g('#sk',()=>go(Math.min(S.cur+1,S.items.length-1)));g('#fin',finish);g('#sub',confirmSubmit);
 g('#bm',()=>{const i=st.bm.indexOf(q.id);i<0?st.bm.push(q.id):st.bm.splice(i,1);save();playView()});g('#fl',()=>{S.flags.has(q.id)?S.flags.delete(q.id):S.flags.add(q.id);playView()});
 if(ex&&S.end){tick();clearInterval(timer);timer=setInterval(tick,500)}else if(ex)$('#tm').textContent='Untimed'}
function tick(){const t=$('#tm');if(!t||!S)return;const l=Math.max(0,Math.round((S.end-Date.now())/1000));t.textContent=`⏱ ${Math.floor(l/60)}:${String(l%60).padStart(2,'0')}`;if(l===0){clearInterval(timer);toast("Time's up — submitting");finish()}}
function go(i){if(i<0||i>=S.items.length)return;S.cur=i;persist();playView()}
function choose(o){const it=S.items[S.cur],q=QB[it.id];if(S.mode==='exam'){S.ans[it.id]=o;playView();return}
 if(S.locked[it.id])return;S.ans[it.id]=o;S.locked[it.id]=true;const ok=o===q.correctOption;record(it.id,ok);
 if(S.mode==='rapid'){if(ok){S.streakNow++;S.best=Math.max(S.best,S.streakNow);S.pts+=10+Math.min(S.streakNow-1,5)*2}else S.streakNow=0}
 persist();save();say(ok?'Correct':'Incorrect');playView();if(S.mode==='rapid'){setTimeout(()=>{if(S&&!S.done&&S.cur<S.items.length-1)go(S.cur+1);else if(S&&!S.done)finish()},ok?650:1500)}}
document.addEventListener('keydown',e=>{if(!S||S.done||location.hash!=='#/play'||/INPUT|SELECT/.test(e.target.tagName))return;const k=e.key.toUpperCase();const it=S.items[S.cur];
 if('ABCDE'.includes(k)&&k.length===1){const o=it.opts.find(x=>x.show===k);if(o)choose(o.orig)}else if(e.key==='ArrowRight')go(S.cur+1);else if(e.key==='ArrowLeft')go(S.cur-1)});
function confirmSubmit(){const un=S.items.filter(i=>!S.ans[i.id]).length;const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="card" role="dialog" aria-modal="true"><h3>Submit exam?</h3><p>${un?`${un} question(s) are unanswered.`:'All questions answered.'} You can't change answers after submitting.</p><div class="row"><button class="btn ghost" id="no">Keep working</button><button class="btn pri" id="yes">Submit</button></div></div>`;document.body.append(m);m.querySelector('#no').onclick=()=>m.remove();m.querySelector('#yes').onclick=()=>{m.remove();finish()}}
function finish(){if(!S||S.done)return;S.done=true;clearInterval(timer);const ids=S.items.map(i=>i.id),sc=score(S.ans,ids),secs=Math.round((Date.now()-S.start)/1000);
 if(S.mode==='exam'){ids.forEach(id=>{if(S.ans[id])record(id,S.ans[id]===QB[id].correctOption)});st.exams.push({t:Date.now(),n:ids.length,c:sc.c,w:sc.w,u:sc.u,pct:sc.pct,secs,by:chapterBreak(ids,S.ans)})}
 else st.resume=null;save();results(sc,secs)}
function chapterBreak(ids,ans){const m={};ids.forEach(id=>{const c=QB[id].chapterId;m[c]=m[c]||{n:0,c:0};m[c].n++;if(ans[id]===QB[id].correctOption)m[c].c++});return m}
function results(sc,secs){const ids=S.items.map(i=>i.id),br=chapterBreak(ids,S.ans),wrong=ids.filter(id=>S.ans[id]!==QB[id].correctOption);if(sc.pct>=70)burst();
 const weak=Object.entries(br).map(([c,v])=>[c,v.c/v.n]).sort((a,b)=>a[1]-b[1])[0];
 app.innerHTML=`<section class="card"><h1>${sc.pct>=80?'Outstanding! 🏆':sc.pct>=60?'Good progress 👏':'Keep practising 💪'}</h1><div class="row"><div class="ring" style="--p:${sc.pct}"><i>${sc.pct}%</i></div><div class="stats" style="flex:1;min-width:240px"><div class="stat"><b>${sc.c}/${ids.length}</b><span>score</span></div><div class="stat"><b>${sc.c}</b><span>correct</span></div><div class="stat"><b>${sc.w}</b><span>incorrect</span></div><div class="stat"><b>${sc.u}</b><span>unanswered</span></div><div class="stat"><b>${Math.floor(secs/60)}m ${secs%60}s</b><span>time used</span></div>${S.mode==='rapid'?`<div class="stat"><b>${S.pts}</b><span>points · best streak ${S.best}</span></div>`:''}</div></div>
 <h3 style="margin-top:20px">By chapter</h3>${Object.entries(br).map(([c,v])=>`<p style="margin:6px 0">${CHB[c].em} ${esc(CHB[c].title)} — ${v.c}/${v.n}<span class="bar" style="display:block;--c:${CHB[c].color}"><span style="display:block;height:100%;width:${v.c/v.n*100}%;background:${CHB[c].color}"></span></span></p>`).join('')}
 <div class="row" style="margin-top:20px"><button class="btn" id="rv">Review all answers</button><button class="btn pri" id="rt" ${wrong.length?'':'disabled'}>Retry incorrect (${wrong.length})</button><button class="btn" id="ww" ${weak&&weak[1]<1?'':'disabled'}>Practice weakest chapter</button><a class="btn ghost" href="#/" style="text-decoration:none">Dashboard</a></div><div id="rvl"></div></section>`;
 $('#rt').onclick=()=>startSession({mode:'practice',title:'Retry incorrect',color:'#FF6578',qids:wrong});if(weak)$('#ww').onclick=()=>chapterStart(weak[0]);
 $('#rv').onclick=()=>{$('#rvl').innerHTML=S.items.map((it,i)=>{const q=QB[it.id],a=S.ans[it.id],ok=a===q.correctOption,lab=l=>{const o=it.opts.find(x=>x.orig===l);return o?o.show+'. '+o.text:'—'};return`<div class="card" style="margin-top:10px"><b>${i+1}. ${esc(q.question)}</b><p class="fb ${ok?'good':'bad'}">${ok?'✓':'✗'} Your answer: ${a?esc(lab(a)):'Unanswered'}<br>Correct: ${esc(lab(q.correctOption))}</p></div>`}).join('')}}
/* ---------- exam & rapid setup ---------- */
function chooser(){return CHS.map(c=>`<label class="k"><input type="checkbox" name="c" value="${c.id}" checked> ${CHB[c.id].em} ${esc(c.title)} (${CHB[c.id].ids.length})</label>`).join('')}
function examSetup(){app.innerHTML=`<h1>Midterm Exam Mode</h1><div class="card"><h3>Chapters</h3>${chooser()}<h3>Questions</h3><div class="row"><select id="n"><option>10</option><option>20</option><option selected>30</option><option>50</option><option value="c">Custom…</option></select><input id="cn" type="number" min="1" max="285" value="40" style="width:90px" hidden aria-label="Custom question count"></div>
 <label class="k"><input type="checkbox" id="tm" checked> Timed</label><label class="k">Minutes: <input id="mn" type="number" min="1" max="300" value="30" style="width:90px"></label><label class="k"><input type="checkbox" id="rnd" checked> Random order (options are shuffled too)</label><button class="btn pri" id="go">Start exam</button></div>`;
 $('#n').onchange=e=>{$('#cn').hidden=e.target.value!=='c'};$('#go').onclick=()=>{const cs=[...app.querySelectorAll('[name=c]:checked')].map(x=>x.value);if(!cs.length)return toast('Choose at least one chapter');let pool=cs.flatMap(c=>CHB[c].ids);const nv=$('#n').value,n=Math.max(1,Math.min(pool.length,nv==='c'?+$('#cn').value||10:+nv));if($('#rnd').checked)pool=shuffle(pool);pool=pool.slice(0,n);if(!$('#rnd').checked)pool.sort((a,b)=>a-b);startSession({mode:'exam',title:'Midterm Exam',color:'#7282FF',qids:pool,shuf:$('#rnd').checked,limit:$('#tm').checked?Math.max(1,+$('#mn').value||30)*60:0})}}
function rapidSetup(){app.innerHTML=`<h1>Rapid-Fire ⚡</h1><div class="card"><p>Random questions with instant feedback, points and a streak bonus.</p><div class="row"><select id="n" aria-label="Number of questions"><option>5</option><option selected>10</option><option>20</option></select><label class="k"><input type="checkbox" id="t"> Time challenge (15 s per question)</label></div><button class="btn pri" id="go">Go!</button></div>`;
 $('#go').onclick=()=>{const n=+$('#n').value;startSession({mode:'rapid',title:'Rapid-Fire',color:'#FF6578',qids:shuffle(QS.map(q=>q.id)).slice(0,n),limit:$('#t').checked?n*15:0});if($('#t').checked){S.mode='rapid';clearInterval(timer);timer=setInterval(()=>{if(S&&!S.done&&S.end&&Date.now()>S.end){clearInterval(timer);toast("Time's up");finish()}},500)}}}
/* ---------- mistakes / bookmarks ---------- */
function listPage(title,ids,mode){const f=$('#f')?.value||'all',s=($('#s')?.value||'').toLowerCase();ids=ids.filter(i=>(f==='all'||QB[i].chapterId===f)&&(!s||QB[i].question.toLowerCase().includes(s)));return ids}
function mistakes(){const all=Object.keys(st.att).map(Number).filter(i=>st.att[i].w>0).sort((a,b)=>(st.att[b].ok===false)-(st.att[a].ok===false)||st.att[b].w-st.att[a].w);
 const draw=()=>{const ids=listPage('',all);const open=ids.filter(i=>!st.mast.includes(i));$('#L').innerHTML=ids.length?ids.map(i=>{const q=QB[i],a=st.att[i],m=st.mast.includes(i);return`<div class="card" style="margin:10px 0;border-left:8px solid ${CHB[q.chapterId].color}"><b>Q${i}. ${esc(q.question)}</b><p class="mut">${CHB[q.chapterId].em} ${esc(CHB[q.chapterId].title)} · wrong ${a.w}× · last attempt ${new Date(a.t).toLocaleDateString()} · ${m?'✓ mastered':a.ok?'answered correctly since':'still wrong'}</p><button class="btn ghost" data-m="${i}">${m?'Unmark mastered':'Mark mastered'}</button></div>`}).join(''):'<div class="card"><h3>Nothing here yet 🎉</h3><p>Wrong answers will appear in this notebook automatically.</p></div>';$('#pr').disabled=!open.length;$('#pr').onclick=()=>startSession({mode:'practice',title:'Mistake Notebook',color:'#FF6578',qids:open});$('#L').querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const i=+b.dataset.m,k=st.mast.indexOf(i);k<0?st.mast.push(i):st.mast.splice(k,1);save();draw()})};
 app.innerHTML=`<h1>The Mistake Notebook</h1><div class="row"><select id="f" aria-label="Chapter filter"><option value="all">All chapters</option>${CHS.map(c=>`<option value="${c.id}">${esc(c.title)}</option>`).join('')}</select><span class="sp"></span><button class="btn pri" id="pr">Practice unmastered mistakes</button></div><div id="L"></div>`;$('#f').onchange=draw;draw()}
function bookmarks(){const draw=()=>{const ids=listPage('',st.bm);$('#L').innerHTML=ids.length?ids.map(i=>`<div class="card" style="margin:10px 0"><b>Q${i}. ${esc(QB[i].question)}</b><p class="mut">${CHB[QB[i].chapterId].em} ${esc(CHB[QB[i].chapterId].title)}</p><button class="btn ghost" data-r="${i}">Remove</button></div>`).join(''):'<div class="card"><h3>No bookmarks</h3><p>Tap ☆ Bookmark during practice to save a question.</p></div>';$('#pr').disabled=!st.bm.length;$('#L').querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{st.bm=st.bm.filter(x=>x!==+b.dataset.r);save();draw()})};
 app.innerHTML=`<h1>Bookmarks</h1><div class="row"><input id="s" placeholder="Search saved questions" aria-label="Search"><select id="f" aria-label="Chapter filter"><option value="all">All chapters</option>${CHS.map(c=>`<option value="${c.id}">${esc(c.title)}</option>`).join('')}</select><span class="sp"></span><button class="btn pri" id="pr">Practice bookmarks</button></div><div id="L"></div>`;$('#s').oninput=draw;$('#f').onchange=draw;$('#pr').onclick=()=>startSession({mode:'practice',title:'Bookmarks',color:'#7282FF',qids:listPage('',st.bm)});draw()}
/* ---------- revision vault (from PDF pp.37-38) ---------- */

['📏 Measurements',[['Pound','1 lb = 454 g'],['Kilogram','1 kg = 2.2 lb'],['Ounce','1 oz = 28.35 g'],['Gallon','1 gal = 4 qt ≈ 3.8 L'],['Cup','1 cup ≈ 250 ml'],['Tablespoon','1 tbsp = 3 tsp'],['Abbreviations','oz = ounce, pt = pint, qt = quart, gal = gallon']]],
['🔪 Knives',[['Chef\'s','8–12" all-purpose'],['Paring','2–4" trim/peel'],['Tools','Steel = hone, Whetstone = sharpen'],['Safety','Carry blade down; never catch a falling knife']]],
['🥕 Mirepoix',[['Basic','2:1:1 onion-carrot-celery'],['White','onion, leek, celery (no carrot)'],['Brown','caramelized'],['Sachet / Bouquet garni','Sachet = spices in cheesecloth; Bouquet garni = tied herbs']]],
['🍲 Mother sauces',[['Béchamel','white roux + milk'],['Velouté','white roux + white stock'],['Espagnole','brown roux + brown stock'],['Tomato',''],['Hollandaise','butter + yolk + acid emulsion'],['Demi-glace','Espagnole + brown stock, reduced'],['Liaison / Slurry','Liaison = yolk + cream; Slurry = starch + cold water']]],
['🥣 Soups',[['Clear','broth / consommé (clarified with clearmeat)'],['Thick','cream (roux), purée (own starch), bisque (shellfish), chowder'],['Cold','gazpacho, vichyssoise']]],
['🔥 Cooking methods',[['Dry','roast/bake (oven, uncovered), grill (heat below), broil/salamander (heat above), sauté, pan-fry, deep-fry, stir-fry'],['Moist','poach, simmer, boil, steam, blanch'],['Combination','braise (large cuts, sear + covered liquid), stew (small pieces, submerged)'],['Heat transfer','Conduction = contact; Convection = moving air/liquid; Radiation = waves'],['Browning','caramelization = sugar; Maillard = protein + sugar']]],

['🍎 Produce',[['Potato','tuber, NOT root'],['Herbs','leaves'],['Families','Cabbage = cauliflower, broccoli, bok choy, kale · Lettuce = iceberg · Onion = leek, garlic, shallot'],['Other','Morel = mushroom; Cilantro = coriander leaf; Jalapeño = Mexico'],['Fruit','Stone = peach, nectarine, plum, cherry; Pineapple = multiple fruit + bromelain'],['Perishability','Raspberries very perishable; blueberries firmer; citrus = winter'],['Ethylene','Producers away from sensitive items']]],

/* ---------- progress ---------- */
function progress(){const o=overall(),mastered=QS.filter(q=>isMastered(q.id)).length;
 app.innerHTML=`<h1>Progress</h1><div class="stats" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))"><div class="stat"><b>${o.att}/${QS.length}</b><span>coverage</span></div><div class="stat"><b>${o.acc==null?'—':o.acc+'%'}</b><span>overall accuracy</span></div><div class="stat"><b>${mastered}</b><span>mastered (marked, or correct twice and latest correct)</span></div><div class="stat"><b>${Object.values(st.att).filter(a=>a.w>0&&!a.ok).length}</b><span>currently difficult</span></div></div>
 <h3 style="margin-top:20px">By chapter</h3>${CHS.map(c=>{const s=chStats(c.id);return`<p style="margin:8px 0">${CHB[c.id].em} ${esc(c.title)} — ${s.pct}% attempted, ${s.acc==null?'n/a':s.acc+'% accuracy'}<span class="bar" style="display:block"><span style="display:block;height:100%;width:${s.acc||0}%;background:${CHB[c.id].color}"></span></span></p>`}).join('')}
 <h3>Exam history</h3>${st.exams.length?`<table><tr><th>Date</th><th>Score</th><th>Questions</th></tr>${st.exams.slice().reverse().map(e=>`<tr><td>${new Date(e.t).toLocaleString()}</td><td>${e.pct}%</td><td>${e.c}/${e.n}</td></tr>`).join('')}</table>`:'<p class="mut">No exams taken yet.</p>'}
 <h3>Your data</h3><p class="mut">Stored only in this browser on this device; it doesn't sync.</p><div class="row"><button class="btn ghost" id="ex">Export JSON</button><label class="btn ghost" style="display:inline-flex;align-items:center">Import JSON<input id="im" type="file" accept=".json" hidden></label><button class="btn pri" id="rs">Reset progress</button></div>`;
 $('#ex').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(st)],{type:'application/json'}));a.download='flavor-lab-progress.json';a.click()};
 $('#im').onchange=async e=>{try{const o=JSON.parse(await e.target.files[0].text());if(o.v!==1)throw 0;st={...blank(),...o};save();toast('Imported');progress()}catch(_){toast('Invalid progress file')}};
