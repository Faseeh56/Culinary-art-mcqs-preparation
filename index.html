terId": "food-05", "subtopic": "Contamination, Vehicles & Cross-Contamination", "question": "Blood and liquid from unthawed frozen raw chicken on an upper fridge shelf drips onto an uncovered bowl of cooked pasta on the shelf below. This is:", "options": [{"label": "A", "text": "Direct cross-contamination"}, {"label": "B", "text": "Drip cross-contamination"}, {"label": "C", "text": "Physical contamination"}, {"label": "D", "text": "Spore germination"}], "correctOption": "B", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 51, "sourcePage": 12}, {"id": 527, "chapterId": "food-05", "subtopic": "Contamination, Vehicles & Cross-Contamination", "question": "A chef cuts raw chicken on a red chopping board, then uses the same unwashed knife and board to slice cooked roast beef. This is:", "options": [{"label": "A", "text": "Direct cross-contamination"}, {"label": "B", "text": "Indirect cross-contamination"}, {"label": "C", "text": "Allergenic reaction"}, {"label": "D", "text": "Biological preservation"}], "correctOption": "B", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 52, "sourcePage": 12}, {"id": 528, "chapterId": "food-05", "subtopic": "Contamination, Vehicles & Cross-Contamination", "question": "What is the mandatory storage arrangement for raw meat and ready-to-eat (RTE) foods in a commercial refrigerator?", "options": [{"label": "A", "text": "RTE foods must be stored at the bottom; raw meats on the top shelf"}, {"label": "B", "text": "RTE foods must be stored at the top; raw meats and poultry must be stored at the bottom in covered containers"}, {"label": "C", "text": "Raw meats and RTE foods should be mixed together on all shelves"}, {"label": "D", "text": "Raw poultry should be stored uncovered on the middle shelf HAZARDS (pp. 18–20)"}], "correctOption": "B", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 53, "sourcePage": 12}, {"id": 529, "chapterId": "food-06", "subtopic": "Physical, Chemical & Allergenic Hazards", "question": "What are common health consequences of physical contamination in food?", "options": [{"label": "A", "text": "Severe allergic rash and drop in blood pressure"}, {"label": "B", "text": "Cuts in the mouth or throat, broken teeth, choking, and puncture wounds in the digestive tract"}, {"label": "C", "text": "Bacterial multiplication and spore formation"}, {"label": "D", "text": "High fever and chemical intoxication"}], "correctOption": "B", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 54, "sourcePage": 13}, {"id": 530, "chapterId": "food-06", "subtopic": "Physical, Chemical & Allergenic Hazards", "question": "What is identified as the most common physical contaminant introduced by food handlers?", "options": [{"label": "A", "text": "Metal screws"}, {"label": "B", "text": "Glass shards"}, {"label": "C", "text": "Human hair"}, {"label": "D", "text": "Broken toothpicks"}], "correctOption": "C", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 55, "sourcePage": 13}, {"id": 531, "chapterId": "food-06", "subtopic": "Physical, Chemical & Allergenic Hazards", "question": "Why are wooden chopping boards, soft wooden utensils, and wooden pallets restricted or banned in high-care food preparation areas?", "options": [{"label": "A", "text": "Wood is too expensive to replace"}, {"label": "B", "text": "Wood absorbs moisture, harbours bacteria in cracks, and sheds splinters (a physical hazard) into food"}, {"label": "C", "text": "Wood causes metallic poisoning"}, {"label": "D", "text": "Wood reacts chemically with cooking oils"}], "correctOption": "B", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 56, "sourcePage": 13}, {"id": 532, "chapterId": "food-06", "subtopic": "Physical, Chemical & Allergenic Hazards", "question": "Why are drawing pins, paper notices, and staples strictly prohibited on notice boards located inside food preparation rooms?", "options": [{"label": "A", "text": "They absorb moisture from cooking steam"}, {"label": "B", "text": "They can fall into open food containers, presenting severe physical and choking hazards"}, {"label": "C", "text": "They attract flying insects"}, {"label": "D", "text": "They emit chemical vapours"}], "correctOption": "B", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 57, "sourcePage": 13}, {"id": 533, "chapterId": "food-06", "subtopic": "Physical, Chemical & Allergenic Hazards", "question": "How must cleaning chemicals and pesticides be stored in a food business?", "options": [{"label": "A", "text": "On the top shelf directly above raw meat prep tables"}, {"label": "B", "text": "Inside empty, unlabelled food containers in the dry store"}, {"label": "C", "text": "In a dedicated, lockable storage area completely segregated from all food storage and preparation areas"}, {"label": "D", "text": "In the walk-in refrigerator next to dairy products"}], "correctOption": "C", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 58, "sourcePage": 13}, {"id": 534, "chapterId": "food-06", "subtopic": "Physical, Chemical & Allergenic Hazards", "question": "Why is it strictly forbidden to decant cleaning chemicals into empty beverage bottles or unlabelled containers?", "options": [{"label": "A", "text": "It causes the chemical to lose its cleaning power"}, {"label": "B", "text": "It creates a severe risk of someone mistaking the chemical for food or drink, leading to fatal chemical poisoning"}, {"label": "C", "text": "It damages the plastic bottle"}, {"label": "D", "text": "It violates recycling guidelines"}], "correctOption": "B", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 59, "sourcePage": 13}, {"id": 535, "chapterId": "food-06", "subtopic": "Physical, Chemical & Allergenic Hazards", "question": "What is a food allergy?", "options": [{"label": "A", "text": "A bacterial infection of the digestive tract"}, {"label": "B", "text": "An immune system reaction to a specific substance (usually a protein) in food that can trigger severe, life-threatening symptoms"}, {"label": "C", "text": "An intolerance to food temperature"}, {"label": "D", "text": "A psychological dislike of certain food textures"}], "correctOption": "B", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 60, "sourcePage": 14}, {"id": 536, "chapterId": "food-06", "subtopic": "Physical, Chemical & Allergenic Hazards", "question": "Which of the following is a symptom of severe, life-threatening anaphylactic shock?", "options": [{"label": "A", "text": "Mild toothache and blurred vision"}, {"label": "B", "text": "Swelling of the throat or mouth, difficulty breathing or swallowing, severe drop in blood pressure, hives, and collapse"}, {"label": "C", "text": "Gradual hair thinning"}, {"label": "D", "text": "High fever lasting 7 days"}], "correctOption": "B", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 61, "sourcePage": 14}, {"id": 537, "chapterId": "food-06", "subtopic": "Physical, Chemical & Allergenic Hazards", "question": "Which group contains items from the major food allergens list?", "options": [{"label": "A", "text": "Beef, lamb, chicken, turkey"}, {"label": "B", "text": "Peanuts, tree nuts, sesame seeds, milk/lactose, eggs, fish, shellfish, soya, mustard, celery, and gluten-containing cereals"}, {"label": "C", "text": "Salt, black pepper, white sugar, water"}, {"label": "D", "text": "Olive oil, sunflower oil, vinegar"}], "correctOption": "B", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 62, "sourcePage": 14}, {"id": 538, "chapterId": "food-06", "subtopic": "Physical, Chemical & Allergenic Hazards", "question": "What immediate action must staff take if a customer experiences an anaphylactic reaction?", "options": [{"label": "A", "text": "Force the customer to walk around the dining room"}, {"label": "B", "text": "Give the customer hot tea with milk"}, {"label": "C", "text": "Do NOT move the customer, immediately call emergency services (ambulance), and assist them with their pre-loaded adrenaline auto-injector (EpiPen) if trained"}, {"label": "D", "text": "Tell the customer to sit in their car and wait"}], "correctOption": "C", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 63, "sourcePage": 14}, {"id": 539, "chapterId": "food-06", "subtopic": "Physical, Chemical & Allergenic Hazards", "question": "How can cross-contact of allergens be effectively controlled in a commercial kitchen?", "options": [{"label": "A", "text": "Wiping allergen boards with a damp, unwashed cloth"}, {"label": "B", "text": "Using dedicated colour-coded equipment, thorough handwashing, separate preparation areas or fryers, and storing allergen ingredients in sealed, labelled containers"}, {"label": "C", "text": "Cooking allergenic foods at 100°C to destroy the proteins"}, {"label": "D", "text": "Serving allergen-containing dishes on paper plates ILLNESS REPORTING (pp. 21–25)"}], "correctOption": "B", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 64, "sourcePage": 14}, {"id": 540, "chapterId": "food-07", "subtopic": "Personal Hygiene, Handwashing & Illness Reporting", "question": "What is the preferred water delivery system for handwashing basins in commercial kitchens?", "options": [{"label": "A", "text": "A single cold-water tap with manual twist handles"}, {"label": "B", "text": "Non-hand-operated (knee, foot, or sensor-operated) warm water mixer spray"}, {"label": "C", "text": "A bucket of standing warm water"}, {"label": "D", "text": "Boiling water from a kettle"}], "correctOption": "B", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 65, "sourcePage": 15}, {"id": 541, "chapterId": "food-07", "subtopic": "Personal Hygiene, Handwashing & Illness Reporting", "question": "What is the recommended temperature range for warm running water used during handwashing?", "options": [{"label": "A", "text": "10°C to 15°C"}, {"label": "B", "text": "30°C to 40°C"}, {"label": "C", "text": "75°C to 85°C"}, {"label": "D", "text": "100°C"}], "correctOption": "B", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 66, "sourcePage": 15}, {"id": 542, "chapterId": "food-07", "subtopic": "Personal Hygiene, Handwashing & Illness Reporting", "question": "What is the correct method for drying hands in a food preparation area?", "options": [{"label": "A", "text": "Wiping hands on a clean chef apron"}, {"label": "B", "text": "Using a shared communal fabric roller towel"}, {"label": "C", "text": "Using clean, single-use disposable paper towels (which can also be used to turn off manual taps)"}, {"label": "D", "text": "Shaking hands dry in the air over food tables"}], "correctOption": "C", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 67, "sourcePage": 15}, {"id": 543, "chapterId": "food-07", "subtopic": "Personal Hygiene, Handwashing & Illness Reporting", "question": "Which of the following is a critical time when hands must be washed immediately?", "options": [{"label": "A", "text": "After reading a recipe card"}, {"label": "B", "text": "After visiting the toilet, after handling raw meat, poultry, or eggs, and before handling ready-to-eat food"}, {"label": "C", "text": "After sharpening a pencil"}, {"label": "D", "text": "Before clocking out at the end of the shift"}], "correctOption": "B", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 68, "sourcePage": 15}, {"id": 544, "chapterId": "food-07", "subtopic": "Personal Hygiene, Handwashing & Illness Reporting", "question": "Why is washing food or equipment in dedicated handwash basins strictly prohibited?", "options": [{"label": "A", "text": "It makes the basin look untidy"}, {"label": "B", "text": "It leads to cross-contamination of handwash taps and transfers food residues or bacteria onto hands being washed"}, {"label": "C", "text": "It wastes liquid hand soap"}, {"label": "D", "text": "Handwash basins are made of weaker steel"}], "correctOption": "B", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 69, "sourcePage": 15}, {"id": 545, "chapterId": "food-07", "subtopic": "Personal Hygiene, Handwashing & Illness Reporting", "question": "What is the rule regarding fingernails for all food handlers?", "options": [{"label": "A", "text": "Nails may be long if painted with clear polish"}, {"label": "B", "text": "Nails must be kept short and clean; no nail varnish or false or acrylic fingernails are permitted"}, {"label": "C", "text": "False nails are permitted if gloves are worn once a day"}, {"label": "D", "text": "Nail polish is allowed in pastry sections"}], "correctOption": "B", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 70, "sourcePage": 15}, {"id": 546, "chapterId": "food-07", "subtopic": "Personal Hygiene, Handwashing & Illness Reporting", "question": "Approximately what percentage of healthy adults carry food poisoning bacteria (Staphylococcus aureus) in their nose and mouth?", "options": [{"label": "A", "text": "2%"}, {"label": "B", "text": "10%"}, {"label": "C", "text": "Up to 40%"}, {"label": "D", "text": "95%"}], "correctOption": "C", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 71, "sourcePage": 15}, {"id": 547, "chapterId": "food-07", "subtopic": "Personal Hygiene, Handwashing & Illness Reporting", "question": "How must cuts, septic sores, boils, and open wounds on a food handler's hands be protected?", "options": [{"label": "A", "text": "Left open to dry in the air"}, {"label": "B", "text": "Covered with a flesh-coloured fabric bandage"}, {"label": "C", "text": "Completely covered with a clean, waterproof dressing, preferably brightly coloured blue (and a waterproof fingerstall if on a finger)"}, {"label": "D", "text": "Covered with clear plastic tape"}], "correctOption": "C", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 72, "sourcePage": 16}, {"id": 548, "chapterId": "food-07", "subtopic": "Personal Hygiene, Handwashing & Illness Reporting", "question": "Why are blue waterproof plasters specifically used in the food industry?", "options": [{"label": "A", "text": "Blue is a calming colour for kitchen staff"}, {"label": "B", "text": "Blue is easily visible if it accidentally falls into food (few natural foods are blue) and often contains a metal strip detectable by metal detectors"}, {"label": "C", "text": "Blue plasters contain antibiotics"}, {"label": "D", "text": "Blue plasters are cheaper than white ones"}], "correctOption": "B", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 73, "sourcePage": 16}, {"id": 549, "chapterId": "food-07", "subtopic": "Personal Hygiene, Handwashing & Illness Reporting", "question": "What jewellery is permitted to be worn by food handlers in food preparation areas?", "options": [{"label": "A", "text": "Wristwatches and fitness trackers"}, {"label": "B", "text": "Dangling earrings and jewelled rings"}, {"label": "C", "text": "A plain wedding band only (no stones or intricate engravings)"}, {"label": "D", "text": "Brooches and neck chains"}], "correctOption": "C", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 74, "sourcePage": 16}, {"id": 550, "chapterId": "food-07", "subtopic": "Personal Hygiene, Handwashing & Illness Reporting", "question": "Why should food handlers avoid wearing strong-smelling perfumes, colognes, or aftershaves?", "options": [{"label": "A", "text": "They irritate the chef's eyes"}, {"label": "B", "text": "They can taint the delicate flavour and aroma of open foods, especially high-fat items like butter and cream"}, {"label": "C", "text": "They attract rodents"}, {"label": "D", "text": "They dissolve plastic food wrap"}], "correctOption": "B", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 75, "sourcePage": 16}, {"id": 551, "chapterId": "food-07", "subtopic": "Personal Hygiene, Handwashing & Illness Reporting", "question": "What is the proper procedure for head coverings and hairnets?", "options": [{"label": "A", "text": "Put on the hairnet after entering the kitchen and touching food"}, {"label": "B", "text": "Tie back long hair and enclose it completely within a clean hairnet or hat BEFORE putting on protective outer clothing"}, {"label": "C", "text": "Brush hair over the uniform in the food preparation area"}, {"label": "D", "text": "Hairnets are only required for head chefs"}], "correctOption": "B", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 76, "sourcePage": 16}, {"id": 552, "chapterId": "food-07", "subtopic": "Personal Hygiene, Handwashing & Illness Reporting", "question": "Why is smoking, vaping, or chewing tobacco prohibited in all food preparation and storage areas?", "options": [{"label": "A", "text": "It reduces the efficiency of the kitchen ventilation fan"}, {"label": "B", "text": "Fingers touch the mouth, transferring saliva and bacteria to food; ash and cigarette butts cause physical contamination; and smoke causes droplet coughing"}, {"label": "C", "text": "It lowers the room temperature"}, {"label": "D", "text": "Tobacco smoke turns cooked meat blue"}], "correctOption": "B", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 77, "sourcePage": 16}, {"id": 553, "chapterId": "food-07", "subtopic": "Personal Hygiene, Handwashing & Illness Reporting", "question": "What is the primary purpose of wearing clean protective clothing (chef whites, aprons, hats)?", "options": [{"label": "A", "text": "To keep the food handler's personal street clothes clean"}, {"label": "B", "text": "To protect open food from microbiological and physical contaminants carried on the handler's personal clothes and body"}, {"label": "C", "text": "To keep the kitchen warm in winter"}, {"label": "D", "text": "To show the rank of the chef"}], "correctOption": "B", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 78, "sourcePage": 16}, {"id": 554, "chapterId": "food-07", "subtopic": "Personal Hygiene, Handwashing & Illness Reporting", "question": "Which practice regarding protective clothing is UNACCEPTABLE?", "options": [{"label": "A", "text": "Wearing light-coloured garments without external pockets"}, {"label": "B", "text": "Removing protective aprons before visiting the toilet"}, {"label": "C", "text": "Wearing protective kitchen whites on public transport while travelling to and from work"}, {"label": "D", "text": "Storing outdoor clothing in lockers away from food rooms"}], "correctOption": "C", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 79, "sourcePage": 16}, {"id": 555, "chapterId": "food-07", "subtopic": "Personal Hygiene, Handwashing & Illness Reporting", "question": "What is the mandatory rule regarding food handlers who suffer from diarrhoea, vomiting, or confirmed food poisoning?", "options": [{"label": "A", "text": "They can work as long as they wear rubber gloves and an apron"}, {"label": "B", "text": "They must take pain relief and work only in the dishwashing area"}, {"label": "C", "text": "They must report their symptoms to their supervisor immediately, be excluded from food handling, and not return until 48 hours symptom-free"}, {"label": "D", "text": "They can return to work 12 hours after taking medication"}], "correctOption": "C", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 80, "sourcePage": 17}, {"id": 556, "chapterId": "food-07", "subtopic": "Personal Hygiene, Handwashing & Illness Reporting", "question": "Under the 48-hour rule, when is an excluded food handler legally allowed to resume food preparation duties?", "options": [{"label": "A", "text": "Exactly 24 hours after their last loose bowel movement"}, {"label": "B", "text": "At least 48 hours after symptoms of diarrhoea and vomiting have completely stopped (and any prescribed medication has ceased)"}, {"label": "C", "text": "As soon as their fever breaks"}, {"label": "D", "text": "Whenever the kitchen becomes short-staffed"}], "correctOption": "B", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 81, "sourcePage": 17}, {"id": 557, "chapterId": "food-07", "subtopic": "Personal Hygiene, Handwashing & Illness Reporting", "question": "What is a carrier in food safety epidemiology?", "options": [{"label": "A", "text": "A refrigerated delivery vehicle carrying dairy stock"}, {"label": "B", "text": "An individual who harbours and excretes pathogenic organisms (e.g., Typhoid or Hepatitis) without showing any outward signs or symptoms of illness"}, {"label": "C", "text": "A pest insect carrying dirt into a dry store"}, {"label": "D", "text": "A waiter carrying trays to dining tables"}], "correctOption": "B", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 82, "sourcePage": 17}, {"id": 558, "chapterId": "food-07", "subtopic": "Personal Hygiene, Handwashing & Illness Reporting", "question": "When should basic induction food hygiene training be delivered to new food handlers?", "options": [{"label": "A", "text": "After 6 months of continuous employment"}, {"label": "B", "text": "Before they begin handling open food on their first day"}, {"label": "C", "text": "Only after an outbreak occurs"}, {"label": "D", "text": "During their annual performance review COOKING STANDARDS (pp. 14, 16, 21)"}], "correctOption": "B", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 83, "sourcePage": 17}, {"id": 559, "chapterId": "food-08", "subtopic": "Critical Temperatures, Thawing & Cooking Standards", "question": "What is the minimum core temperature that should normally be achieved at the centre of high-risk food during thorough cooking to ensure safety?", "options": [{"label": "A", "text": "50°C"}, {"label": "B", "text": "60°C"}, {"label": "C", "text": "At least 75°C"}, {"label": "D", "text": "120°C"}], "correctOption": "C", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 84, "sourcePage": 18}, {"id": 560, "chapterId": "food-08", "subtopic": "Critical Temperatures, Thawing & Cooking Standards", "question": "What is the minimum safe holding temperature for hot food displayed on a service buffet?", "options": [{"label": "A", "text": "37°C"}, {"label": "B", "text": "50°C"}, {"label": "C", "text": "Above 60°C (typically 63°C in many standards)"}, {"label": "D", "text": "100°C"}], "correctOption": "C", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 85, "sourcePage": 18}, {"id": 561, "chapterId": "food-08", "subtopic": "Critical Temperatures, Thawing & Cooking Standards", "question": "What is the maximum safe operating temperature for a commercial food storage refrigerator?", "options": [{"label": "A", "text": "15°C"}, {"label": "B", "text": "10°C"}, {"label": "C", "text": "Below 5°C (0°C to 4°C ideally)"}, {"label": "D", "text": "-18°C"}], "correctOption": "C", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 86, "sourcePage": 18}, {"id": 562, "chapterId": "food-08", "subtopic": "Critical Temperatures, Thawing & Cooking Standards", "question": "Why is inadequate thawing of large frozen poultry (e.g., whole turkeys) a major cause of food poisoning?", "options": [{"label": "A", "text": "The skin becomes too dry during roasting"}, {"label": "B", "text": "The centre remains frozen or cold, so normal cooking time fails to reach the lethal 75°C core temperature, allowing bacteria to survive"}, {"label": "C", "text": "The bones become soft and brittle"}, {"label": "D", "text": "Ice inside the bird puts out the oven flame"}], "correctOption": "B", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 87, "sourcePage": 18}, {"id": 563, "chapterId": "food-08", "subtopic": "Critical Temperatures, Thawing & Cooking Standards", "question": "Where should thawing of raw frozen meat and poultry take place?", "options": [{"label": "A", "text": "On a warm stainless steel preparation table in direct sunlight"}, {"label": "B", "text": "In a sink filled with standing warm water"}, {"label": "C", "text": "Inside a dedicated defrosting refrigerator (below 5°C) in a deep, covered drip tray on the lowest shelf"}, {"label": "D", "text": "Next to the dining room service pass"}], "correctOption": "C", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 88, "sourcePage": 18}, {"id": 564, "chapterId": "food-08", "subtopic": "Critical Temperatures, Thawing & Cooking Standards", "question": "When reheating previously cooked stews, gravies, or pies, what temperature must be achieved?", "options": [{"label": "A", "text": "Lukewarm throughout (approx. 40°C)"}, {"label": "B", "text": "50°C for 2 minutes"}, {"label": "C", "text": "Piping hot throughout, reaching at least 75°C (stews approaching 100°C or simmering)"}, {"label": "D", "text": "Reheating is forbidden under all circumstances"}], "correctOption": "C", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 89, "sourcePage": 18}, {"id": 565, "chapterId": "food-08", "subtopic": "Critical Temperatures, Thawing & Cooking Standards", "question": "Hot food being cooled for refrigerated storage must be cooled as rapidly as possible to prevent:", "options": [{"label": "A", "text": "The food from losing its natural colour"}, {"label": "B", "text": "Prolonged time in the Danger Zone (5°C to 60°C), which permits surviving spores to germinate and multiply"}, {"label": "C", "text": "The refrigerator shelves from cracking"}, {"label": "D", "text": "Ice forming on the surface of the food SCENARIO QUESTIONS"}], "correctOption": "B", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 90, "sourcePage": 18}, {"id": 566, "chapterId": "food-09", "subtopic": "Advanced Conceptual & Tricky Scenarios", "question": "Scenario: A batch of beef stew is cooked to 85°C, left on a counter at 28°C for 7 hours, and then reheated to 75°C before serving. Customers become violently ill. What is the most likely scientific cause?", "options": [{"label": "A", "text": "Metallic poisoning from the spoon"}, {"label": "B", "text": "Bacteria multiplied and produced heat-stable toxins during the 7 hours at room temperature, which were not destroyed by reheating"}, {"label": "C", "text": "Spoilage moulds formed on the surface"}, {"label": "D", "text": "The stew developed a high acid content"}], "correctOption": "B", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 91, "sourcePage": 19}, {"id": 567, "chapterId": "food-09", "subtopic": "Advanced Conceptual & Tricky Scenarios", "question": "Scenario: A food handler washes their hands thoroughly, dries them with a reusable cloth hanging by the sink, and prepares ready-to-eat sandwiches. Why is this a serious hazard?", "options": [{"label": "A", "text": "Paper towels are cheaper than fabric"}, {"label": "B", "text": "The communal reusable cloth harbours bacteria from previous users, re-contaminating clean hands immediately before food preparation"}, {"label": "C", "text": "Fabric towels remove skin oils"}, {"label": "D", "text": "Reusable cloths cause chemical burns"}], "correctOption": "B", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 92, "sourcePage": 19}, {"id": 568, "chapterId": "food-09", "subtopic": "Advanced Conceptual & Tricky Scenarios", "question": "Scenario: An environmental health officer finds a food handler wearing a wristwatch, a diamond engagement ring, and a plain gold wedding band. Which items must be removed?", "options": [{"label": "A", "text": "Only the plain gold band"}, {"label": "B", "text": "The wristwatch and the diamond engagement ring (the plain band is acceptable)"}, {"label": "C", "text": "None of them, as long as hands are washed"}, {"label": "D", "text": "All items including the plain band must be welded shut"}], "correctOption": "B", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 93, "sourcePage": 19}, {"id": 569, "chapterId": "food-09", "subtopic": "Advanced Conceptual & Tricky Scenarios", "question": "Scenario: A catering company prepares chicken mayonnaise sandwiches for a wedding. Which combination of ingredients represents the highest microbiological risk?", "options": [{"label": "A", "text": "Commercial pasteurized bottled mayonnaise and thoroughly cooked, chilled chicken breast"}, {"label": "B", "text": "Homemade mayonnaise made with unpasteurized raw eggs and warm, slow-cooled boiled chicken"}, {"label": "C", "text": "Canned tuna and processed cheddar cheese slices"}, {"label": "D", "text": "Baked bread rolls and salted butter"}], "correctOption": "B", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 94, "sourcePage": 19}, {"id": 570, "chapterId": "food-09", "subtopic": "Advanced Conceptual & Tricky Scenarios", "question": "Scenario: A cook tastes soup from a simmering pot using a metal tasting spoon, licks the spoon clean, and puts it directly back into the pot to stir. What hazard has occurred?", "options": [{"label": "A", "text": "Physical contamination from the spoon handle"}, {"label": "B", "text": "Microbiological contamination, with oral bacteria (e.g., staphylococci) transferred via saliva directly into the food"}, {"label": "C", "text": "Chemical contamination from saliva enzymes"}, {"label": "D", "text": "Metallic food poisoning from the spoon"}], "correctOption": "B", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 95, "sourcePage": 19}, {"id": 571, "chapterId": "food-09", "subtopic": "Advanced Conceptual & Tricky Scenarios", "question": "Scenario: Why is it hazardous to wash raw whole chicken carcasses in a food preparation sink before cooking?", "options": [{"label": "A", "text": "It makes the chicken meat watery and tough"}, {"label": "B", "text": "Water splashing from the raw chicken aerosolizes and spreads pathogens (Campylobacter or Salmonella) up to a metre across surrounding surfaces, cloths, and ready-to-eat foods"}, {"label": "C", "text": "It removes the chicken's natural protective preservatives"}, {"label": "D", "text": "Sinks absorb chicken proteins permanently"}], "correctOption": "B", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 96, "sourcePage": 19}, {"id": 572, "chapterId": "food-09", "subtopic": "Advanced Conceptual & Tricky Scenarios", "question": "Scenario: A chef notices that frozen beef steaks have thawed slightly on the delivery truck because the refrigeration unit broke down. What is the correct corrective action?", "options": [{"label": "A", "text": "Refreeze the steaks immediately in the deep freezer"}, {"label": "B", "text": "Reject the delivery and return it to the supplier"}, {"label": "C", "text": "Cook all the steaks to medium-rare immediately"}, {"label": "D", "text": "Marinate the steaks in vinegar to kill bacteria"}], "correctOption": "B", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 97, "sourcePage": 20}, {"id": 573, "chapterId": "food-09", "subtopic": "Advanced Conceptual & Tricky Scenarios", "question": "Scenario: A food handler has a minor weeping pimple on their forehead and a septic scratch on their thumb. What controls are required?", "options": [{"label": "A", "text": "Take an aspirin and continue cooking"}, {"label": "B", "text": "Wash hands, cover the thumb with a blue waterproof dressing and fingerstall, avoid touching the face, and report to the supervisor"}, {"label": "C", "text": "Work only in the vegetable storage area without dressings"}, {"label": "D", "text": "Squeeze the pimple over the kitchen sink before starting work"}], "correctOption": "B", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 98, "sourcePage": 20}, {"id": 574, "chapterId": "food-09", "subtopic": "Advanced Conceptual & Tricky Scenarios", "question": "Scenario: A bag of raw potatoes covered in garden soil is brought into a commercial kitchen and placed on a stainless steel preparation table next to sliced cooked ham. What is the primary hazard?", "options": [{"label": "A", "text": "The ham will absorb water from the potatoes"}, {"label": "B", "text": "Soil harbours dangerous spore-forming bacteria (e.g., Clostridium) and physical grit that can contaminate the ready-to-eat ham"}, {"label": "C", "text": "Potatoes emit ethylene gas that spoils cooked meats"}, {"label": "D", "text": "Soil causes chemical pesticide poisoning instantly"}], "correctOption": "B", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 99, "sourcePage": 20}, {"id": 575, "chapterId": "food-09", "subtopic": "Advanced Conceptual & Tricky Scenarios", "question": "Scenario: A bottle of concentrated sanitizing chemical is stored on a high shelf directly above an uncovered container of cooked rice. The bottle has a small leak. What type of hazard does this represent?", "options": [{"label": "A", "text": "Biological hazard"}, {"label": "B", "text": "Chemical hazard"}, {"label": "C", "text": "Allergenic hazard"}, {"label": "D", "text": "Physical hazard only COMPREHENSIVE DRILLS (pp. 3–25)"}], "correctOption": "B", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 100, "sourcePage": 20}, {"id": 576, "chapterId": "food-10", "subtopic": "Quick-Fire Terminology & Comprehensive Drills", "question": "The scientific term for microorganisms that cause illness is:", "options": [{"label": "A", "text": "Spoilage flora"}, {"label": "B", "text": "Pathogens"}, {"label": "C", "text": "Mycotoxins"}, {"label": "D", "text": "Yeasts"}], "correctOption": "B", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 101, "sourcePage": 21}, {"id": 577, "chapterId": "food-10", "subtopic": "Quick-Fire Terminology & Comprehensive Drills", "question": "The process of heating milk to 72°C for 15 seconds to destroy pathogenic vegetative bacteria is known as:", "options": [{"label": "A", "text": "Sterilisation"}, {"label": "B", "text": "Canning"}, {"label": "C", "text": "Pasteurisation"}, {"label": "D", "text": "Irradiation"}], "correctOption": "C", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 102, "sourcePage": 21}, {"id": 578, "chapterId": "food-10", "subtopic": "Quick-Fire Terminology & Comprehensive Drills", "question": "Food poisoning bacteria reproduce by dividing into two. This asexual reproduction method is called:", "options": [{"label": "A", "text": "Spore germination"}, {"label": "B", "text": "Binary fission"}, {"label": "C", "text": "Fermentation"}, {"label": "D", "text": "Cross-contamination"}], "correctOption": "B", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 103, "sourcePage": 21}, {"id": 579, "chapterId": "food-10", "subtopic": "Quick-Fire Terminology & Comprehensive Drills", "question": "Which organism is an example of an intestinal parasite found in raw, undercooked meat or fish?", "options": [{"label": "A", "text": "Norovirus"}, {"label": "B", "text": "Staphylococcus aureus"}, {"label": "C", "text": "Parasitic worms (e.g., tapeworms or Anisakis)"}, {"label": "D", "text": "Mould spores"}], "correctOption": "C", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 104, "sourcePage": 21}, {"id": 580, "chapterId": "food-10", "subtopic": "Quick-Fire Terminology & Comprehensive Drills", "question": "What type of food preservation uses high salt and nitrate concentrations to remove moisture and inhibit bacterial growth?", "options": [{"label": "A", "text": "Canning"}, {"label": "B", "text": "Curing or salting (e.g., bacon, salami)"}, {"label": "C", "text": "Blanching"}, {"label": "D", "text": "Pasteurisation"}], "correctOption": "B", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 105, "sourcePage": 21}, {"id": 581, "chapterId": "food-10", "subtopic": "Quick-Fire Terminology & Comprehensive Drills", "question": "What is the minimum temperature for the core of cooked poultry to ensure safety?", "options": [{"label": "A", "text": "60°C"}, {"label": "B", "text": "65°C"}, {"label": "C", "text": "75°C"}, {"label": "D", "text": "55°C"}], "correctOption": "C", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 106, "sourcePage": 21}, {"id": 582, "chapterId": "food-10", "subtopic": "Quick-Fire Terminology & Comprehensive Drills", "question": "What is the main food safety risk of allowing domestic pets (cats or dogs) into food premises?", "options": [{"label": "A", "text": "They eat expensive food stock"}, {"label": "B", "text": "They shed hairs, carry fleas or ticks, and harbour pathogens (such as Salmonella and Campylobacter) in their paws, coats, and saliva"}, {"label": "C", "text": "They cause allergic reactions in kitchen stoves"}, {"label": "D", "text": "They lower the room temperature"}], "correctOption": "B", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 107, "sourcePage": 21}, {"id": 583, "chapterId": "food-10", "subtopic": "Quick-Fire Terminology & Comprehensive Drills", "question": "Why are food handlers instructed NOT to use their apron to wipe their hands?", "options": [{"label": "A", "text": "Aprons get stained and look unattractive"}, {"label": "B", "text": "Aprons accumulate grease, raw juices, and dirt, acting as a major vehicle of cross-contamination back to clean hands"}, {"label": "C", "text": "Aprons are made of fireproof material that damages skin"}, {"label": "D", "text": "Aprons must remain dry for insulation"}], "correctOption": "B", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 108, "sourcePage": 21}, {"id": 584, "chapterId": "food-10", "subtopic": "Quick-Fire Terminology & Comprehensive Drills", "question": "What is the primary hazard of serving raw oysters on the half-shell?", "options": [{"label": "A", "text": "Physical cuts from the oyster shell"}, {"label": "B", "text": "Oysters filter large volumes of seawater and can concentrate human sewage pathogens (e.g., norovirus, Vibrio) in their digestive tracts"}, {"label": "C", "text": "Oysters contain high levels of copper"}, {"label": "D", "text": "Oysters produce bacterial spores in their shells"}], "correctOption": "B", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 109, "sourcePage": 22}, {"id": 585, "chapterId": "food-10", "subtopic": "Quick-Fire Terminology & Comprehensive Drills", "question": "An employee who has consumed food known to have caused an outbreak in their household must:", "options": [{"label": "A", "text": "Keep quiet and continue working if they feel fine"}, {"label": "B", "text": "Report the situation immediately to their supervisor, as they may be an asymptomatic carrier"}, {"label": "C", "text": "Take double doses of antibiotics while at work"}, {"label": "D", "text": "Wash their hands once at the start of the day"}], "correctOption": "B", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 110, "sourcePage": 22}, {"id": 586, "chapterId": "food-10", "subtopic": "Quick-Fire Terminology & Comprehensive Drills", "question": "Which of the following is a common physical hazard derived from cleaning equipment?", "options": [{"label": "A", "text": "Washing soda crystals"}, {"label": "B", "text": "Loose bristles from scrubbing brushes and pieces of scouring pads"}, {"label": "C", "text": "Chlorine fumes"}, {"label": "D", "text": "Hot water vapour"}], "correctOption": "B", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 111, "sourcePage": 22}, {"id": 587, "chapterId": "food-10", "subtopic": "Quick-Fire Terminology & Comprehensive Drills", "question": "Why must raw vegetables be prepared in a separate area using dedicated green chopping boards?", "options": [{"label": "A", "text": "To make the vegetable salad taste sweeter"}, {"label": "B", "text": "To prevent soil organisms and bacteria on raw produce from contaminating ready-to-eat cooked items"}, {"label": "C", "text": "Green boards keep vegetables crisp"}, {"label": "D", "text": "It is an aesthetic standard for restaurant inspectors"}], "correctOption": "B", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 112, "sourcePage": 22}, {"id": 588, "chapterId": "food-10", "subtopic": "Quick-Fire Terminology & Comprehensive Drills", "question": "Why is it unsafe to leave a large stockpot of boiling soup on the stove overnight to cool down naturally?", "options": [{"label": "A", "text": "The soup will evaporate completely"}, {"label": "B", "text": "The soup remains in the Temperature Danger Zone (5°C–60°C) for many hours, creating optimal conditions for rapid bacterial growth and toxin production"}, {"label": "C", "text": "The metal pot will melt"}, {"label": "D", "text": "The soup becomes too acidic"}], "correctOption": "B", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 113, "sourcePage": 22}, {"id": 589, "chapterId": "food-10", "subtopic": "Quick-Fire Terminology & Comprehensive Drills", "question": "What is the purpose of an approved supplier policy?", "options": [{"label": "A", "text": "To ensure the business pays the lowest possible price"}, {"label": "B", "text": "To guarantee that incoming raw materials originate from clean, inspected, and legally compliant sources that maintain high hygiene standards"}, {"label": "C", "text": "To buy food exclusively from overseas markets"}, {"label": "D", "text": "To avoid paying taxes on raw ingredients"}], "correctOption": "B", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 114, "sourcePage": 22}, {"id": 590, "chapterId": "food-10", "subtopic": "Quick-Fire Terminology & Comprehensive Drills", "question": "Which statement about bacterial multiplication is correct?", "options": [{"label": "A", "text": "Bacteria multiply faster at 2°C than at 37°C"}, {"label": "B", "text": "Bacteria require light to reproduce"}, {"label": "C", "text": "One bacterium can multiply into millions within a few hours if warmth, moisture, food, and time are present"}, {"label": "D", "text": "Bacteria can multiply inside hermetically sealed cans boiled for 3 hours"}], "correctOption": "C", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 115, "sourcePage": 22}, {"id": 591, "chapterId": "food-10", "subtopic": "Quick-Fire Terminology & Comprehensive Drills", "question": "What is the maximum period that high-risk food should be kept at ambient room temperature during preparation?", "options": [{"label": "A", "text": "As long as the chef needs"}, {"label": "B", "text": "24 hours"}, {"label": "C", "text": "Kept to an absolute minimum (less than 20–30 minutes)"}, {"label": "D", "text": "8 hours"}], "correctOption": "C", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 116, "sourcePage": 23}, {"id": 592, "chapterId": "food-10", "subtopic": "Quick-Fire Terminology & Comprehensive Drills", "question": "What is the main food safety risk associated with uncovered rubbish bins in food rooms?", "options": [{"label": "A", "text": "The bins take up too much floor space"}, {"label": "B", "text": "They attract pests (flies, rodents), produce foul odours, and allow airborne bacteria to contaminate food preparation areas"}, {"label": "C", "text": "Rubbish bins reduce kitchen lighting"}, {"label": "D", "text": "They cause metallic food poisoning"}], "correctOption": "B", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 117, "sourcePage": 23}, {"id": 593, "chapterId": "food-10", "subtopic": "Quick-Fire Terminology & Comprehensive Drills", "question": "What should a food handler do if they drop a clean knife on the kitchen floor?", "options": [{"label": "A", "text": "Wipe it on their trousers and continue chopping"}, {"label": "B", "text": "Blow on the blade to remove dust"}, {"label": "C", "text": "Send it to the wash-up area for cleaning and disinfection, and take a clean, sanitized knife"}, {"label": "D", "text": "Rinse it quickly under cold running water without soap"}], "correctOption": "C", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 118, "sourcePage": 23}, {"id": 594, "chapterId": "food-10", "subtopic": "Quick-Fire Terminology & Comprehensive Drills", "question": "What is the primary purpose of cleaning and disinfection?", "options": [{"label": "A", "text": "Cleaning kills all spores; disinfection removes grease"}, {"label": "B", "text": "Cleaning removes visible dirt, food residues, and grease; disinfection reduces microorganisms to a safe, acceptable level"}, {"label": "C", "text": "Cleaning is done once a year; disinfection is done weekly"}, {"label": "D", "text": "Cleaning uses chemicals; disinfection uses only dry paper"}], "correctOption": "B", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 119, "sourcePage": 23}, {"id": 595, "chapterId": "food-10", "subtopic": "Quick-Fire Terminology & Comprehensive Drills", "question": "What is the single most critical message of the Level 2 Food Safety Handbook?", "options": [{"label": "A", "text": "Food poisoning is unavoidable in catering"}, {"label": "B", "text": "Food hygiene is solely the responsibility of the environmental health officer"}, {"label": "C", "text": "Food poisoning can be prevented by controlling hazards, preventing contamination, stopping bacterial multiplication, and maintaining high personal hygiene"}, {"label": "D", "text": "Always use low-cost suppliers to maximize profits"}], "correctOption": "C", "sourceTitle": "Highfield Food Safety Level 2 — Question Bank", "sourceQuestionId": 120, "sourcePage": 23}, {"id": 596, "chapterId": "comm-01", "subtopic": "Communication Skills & Personality Development", "question": "Communication is defined as the process of:", "options": [{"label": "A", "text": "Speaking loudly and clearly to a large audience"}, {"label": "B", "text": "Sharing information, thoughts, feelings, or instructions between two or more people so that the message is understood"}, {"label": "C", "text": "Memorizing industry-specific vocabulary for written examinations"}, {"label": "D", "text": "Using only non-verbal hand gestures in a workplace environment"}], "correctOption": "B", "sourceTitle": "Communication & Workplace Skills (Chapters 1–5) — Question Bank", "sourceQuestionId": 1, "sourcePage": 3}, {"id": 597, "chapterId": "comm-01", "subtopic": "Communication Skills & Personality Development", "question": "In the basic communication model, what is the correct chronological sequence of components?", "options": [{"label": "A", "text": "Message → Sender → Receiver → Channel → Feedback"}, {"label": "B", "text": "Sender → Message → Channel → Receiver → Feedback"}, {"label": "C", "text": "Channel → Sender → Message → Feedback → Receiver"}, {"label": "D", "text": "Sender → Receiver → Message → Feedback → Channel"}], "correctOption": "B", "sourceTitle": "Communication & Workplace Skills (Chapters 1–5) — Question Bank", "sourceQuestionId": 2, "sourcePage": 3}, {"id": 598, "chapterId": "comm-01", "subtopic": "Communication Skills & Personality Development", "question": "A head chef calls out \"Fire Table 5!\" to the line cooks, and the kitchen team immediately begins cooking. In this scenario, what represents the Channel?", "options": [{"label": "A", "text": "The chef"}, {"label": "B", "text": "\"Fire Table 5!\""}, {"label": "C", "text": "The chef's spoken voice"}, {"label": "D", "text": "The line cooks"}], "correctOption": "C", "sourceTitle": "Communication & Workplace Skills (Chapters 1–5) — Question Bank", "sourceQuestionId": 3, "sourcePage": 3}, {"id": 599, "chapterId": "comm-01", "subtopic": "Communication Skills & Personality Development", "question": "In the same scenario (\"Fire Table 5!\"), what constitutes the Feedback?", "options": [{"label": "A", "text": "The printed order ticket on the kitchen counter"}, {"label": "B", "text": "The chef shouting the order"}, {"label": "C", "text": "The kitchen team starting to cook the dishes"}, {"label": "D", "text": "The dining guests sitting at Table 5"}], "correctOption": "C", "sourceTitle": "Communication & Workplace Skills (Chapters 1–5) — Question Bank", "sourceQuestionId": 4, "sourcePage": 3}, {"id": 600, "chapterId": "comm-01", "subtopic": "Communication Skills & Personality Development", "question": "Which of the following is considered the single most important professional skill in the hospitality industry?", "options": [{"label": "A", "text": "Accounting"}, {"label": "B", "text": "Communication"}, {"label": "C", "text": "Interior decorating"}, {"label": "D", "text": "Menu graphic design"}], "correctOption": "B", "sourceTitle": "Communication & Workplace Skills (Chapters 1–5) — Question Bank", "sourceQuestionId": 5, "sourcePage": 3}, {"id": 601, "chapterId": "comm-01", "subtopic": "Communication Skills & Personality Development", "question": "Which category of communication includes greeting guests, taking food orders, and calling kitchen orders?", "options": [{"label": "A", "text": "Written Communication"}, {"label": "B", "text": "Verbal (Spoken) Communication"}, {"label": "C", "text": "Visual Communication"}, {"label": "D", "text": "Digital Communication"}], "correctOption": "B", "sourceTitle": "Communication & Workplace Skills (Chapters 1–5) — Question Bank", "sourceQuestionId": 6, "sourcePage": 3}, {"id": 602, "chapterId": "comm-01", "subtopic": "Communication Skills & Personality Development", "question": "A server stands with an upright posture, makes warm eye contact, and wears a pristine uniform. These are all examples of:", "options": [{"label": "A", "text": "Digital Communication"}, {"label": "B", "text": "Written Communication"}, {"label": "C", "text": "Non-Verbal Communication"}, {"label": "D", "text": "Verbal Communication"}], "correctOption": "C", "sourceTitle": "Communication & Workplace Skills (Chapters 1–5) — Question Bank", "sourceQuestionId": 7, "sourcePage": 3}, {"id": 603, "chapterId": "comm-01", "subtopic": "Communication Skills & Personality Development", "question": "Emails, printed menus, reservation logs, and incident reports belong to which communication type?", "options": [{"label": "A", "text": "Visual"}, {"label": "B", "text": "Digital"}, {"label": "C", "text": "Written"}, {"label": "D", "text": "Non-verbal"}], "correctOption": "C", "sourceTitle": "Communication & Workplace Skills (Chapters 1–5) — Question Bank", "sourceQuestionId": 8, "sourcePage": 4}, {"id": 604, "chapterId": "comm-01", "subtopic": "Communication Skills & Personality Development", "question": "Social media replies, online automated booking confirmations, and customer service chatbots are examples of:", "options": [{"label": "A", "text": "Visual Communication"}, {"label": "B", "text": "Non-Verbal Communication"}, {"label": "C", "text": "Digital Communication"}, {"label": "D", "text": "Verbal Communication"}], "correctOption": "C", "sourceTitle": "Communication & Workplace Skills (Chapters 1–5) — Question Bank", "sourceQuestionId": 9, "sourcePage": 4}, {"id": 605, "chapterId": "comm-01", "subtopic": "Communication Skills & Personality Development", "question": "Safety notice signs, illuminated exit signboards, and illustrated menus with dish photographs are classified as:", "options": [{"label": "A", "text": "Digital Communication"}, {"label": "B", "text": "Visual Communication"}, {"label": "C", "text": "Written Communication only"}, {"label": "D", "text": "Non-Verbal Gestures"}], "correctOption": "B", "sourceTitle": "Communication & Workplace Skills (Chapters 1–5) — Question Bank", "sourceQuestionId": 10, "sourcePage": 4}, {"id": 606, "chapterId": "comm-01", "subtopic": "Communication Skills & Personality Development", "question": "According to research by Professor Albert Mehrabian, what percentage of the total impact in face-to-face communication comes from the actual words used?", "options": [{"label": "A", "text": "55%"}, {"label": "B", "text": "38%"}, {"label": "C", "text": "7%"}, {"label": "D", "text": "93%"}], "correctOption": "C", "sourceTitle": "Communication & Workplace Skills (Chapters 1–5) — Question Bank", "sourceQuestionId": 11, "sourcePage": 4}, {"id": 607, "chapterId": "comm-01", "subtopic": "Communication Skills & Personality Development", "question": "According to Mehrabian's 7–38–55 Rule, tone of voice accounts for what percentage of total communication impact?", "options": [{"label": "A", "text": "7%"}, {"label": "B", "text": "38%"}, {"label": "C", "text": "55%"}, {"label": "D", "text": "50%"}], "correctOption": "B", "sourceTitle": "Communication & Workplace Skills (Chapters 1–5) — Question Bank", "sourceQuestionId": 12, "sourcePage": 4}, {"id": 608, "chapterId": "comm-01", "subtopic": "Communication Skills & Personality Development", "question": "What percentage of face-to-face communication impact is derived from body language?", "options": [{"label": "A", "text": "7%"}, {"label": "B", "text": "38%"}, {"label": "C", "text": "55%"}, {"label": "D", "text": "45%"}], "correctOption": "C", "sourceTitle": "Communication & Workplace Skills (Chapters 1–5) — Question Bank", "sourceQuestionId": 13, "sourcePage": 4}, {"id": 609, "chapterId": "comm-01", "subtopic": "Communication Skills & Personality Development", "question": "What is the fundamental takeaway of the 7–38–55 Rule for hospitality professionals?", "options": [{"label": "A", "text": "Words are the only element that matters when resolving guest issues"}, {"label": "B", "text": "Written communication is superior to spoken communication"}, {"label": "C", "text": "HOW you say something matters far more than WHAT you say"}, {"label": "D", "text": "Tone of voice alone communicates 100% of a speaker's meaning"}], "correctOption": "C", "sourceTitle": "Communication & Workplace Skills (Chapters 1–5) — Question Bank", "sourceQuestionId": 14, "sourcePage": 4}, {"id": 610, "chapterId": "comm-01", "subtopic": "Communication Skills & Personality Development", "question": "In a professional hospitality context, personality development is defined as:", "options": [{"label": "A", "text": "Changing one's core personal identity to match company marketing"}, {"label": "B", "text": "The process of improving how you think, behave, present yourself, and interact with others to become professional, confident, and effective"}, {"label": "C", "text": "Memorizing scripted conversations to recite to guests without variation"}, {"label": "D", "text": "Wearing expensive branded clothing while at work"}], "correctOption": "B", "sourceTitle": "Communication & Workplace Skills (Chapters 1–5) — Question Bank", "sourceQuestionId": 15, "sourcePage": 4}, {"id": 611, "chapterId": "comm-01", "subtopic": "Communication Skills & Personality Development", "question": "Which aspect of hospitality personality development relates to grooming, wearing a clean uniform, and maintaining upright posture?", "options": [{"label": "A", "text": "How you grow"}, {"label": "B", "text": "How you treat others"}, {"label": "C", "text": "How you look"}, {"label": "D", "text":
