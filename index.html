<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>The Flavor Lab — COTHM Culinary Arts Midterm Prep</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=DM+Sans:wght@400;500;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #FFF9F0;
            --card: #fff;
            --ink: #18233B;
            --mut: #5b6580;
            --line: #ece3d4;
            --sh: 0 8px 24px rgba(24, 35, 59, .08);
            --ok: #128a72;
            --bad: #c9304a;
            --r: 20px
        }

        [data-theme=dark] {
            --bg: #111a2e;
            --card: #1b2742;
            --ink: #f6efe3;
            --mut: #a9b3cc;
            --line: #2c3a5c;
            --sh: 0 8px 24px rgba(0, 0, 0, .35);
            --ok: #4fe0c2;
            --bad: #ff8497
        }

        * {
            box-sizing: border-box
        }

        html {
            scroll-behavior: smooth
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font: 16px/1.55 'DM Sans', system-ui, sans-serif;
            background-image: radial-gradient(circle at 10% 0, #ffad3622, transparent 40%), radial-gradient(circle at 90% 10%, #7282ff22, transparent 40%);
            min-height: 100vh;
            overflow-x: hidden
        }

        h1,
        h2,
        h3 {
            font-family: Fraunces, Georgia, serif;
            line-height: 1.15;
            margin: 0 0 .5em
        }

        h1 {
            font-size: clamp(2rem, 6vw, 3.6rem);
            font-weight: 800
        }

        h2 {
            font-size: 1.7rem
        }

        a {
            color: inherit
        }

        button {
            font: inherit;
            color: inherit;
            cursor: pointer
        }

        :focus-visible {
            outline: 3px solid #7282ff;
            outline-offset: 2px
        }

        header {
            position: sticky;
            top: 0;
            z-index: 20;
            background: color-mix(in srgb, var(--bg) 88%, transparent);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--line)
        }

        nav {
            display: flex;
            align-items: center;
            gap: 6px;
            max-width: 1100px;
            margin: auto;
            padding: 8px 14px;
            overflow-x: auto;
            scrollbar-width: none
        }

        .logo {
            font: 800 1.2rem Fraunces, serif;
            white-space: nowrap;
            margin-right: auto;
            text-decoration: none
        }

        nav a.n {
            padding: 9px 13px;
            border-radius: 99px;
            text-decoration: none;
            white-space: nowrap;
            font-weight: 500;
            min-height: 44px;
            display: flex;
            align-items: center
        }

        nav a.n[aria-current=page] {
            background: var(--ink);
            color: var(--bg)
        }

        main {
            max-width: 1100px;
            margin: auto;
            padding: 22px 14px 80px;
            animation: in .35s ease
        }

        @keyframes in {
            from {
                opacity: 0;
                transform: translateY(8px)
            }
        }

        .card {
            background: var(--card);
            border-radius: var(--r);
            box-shadow: var(--sh);
            padding: 20px;
            border: 1px solid var(--line)
        }

        .grid {
            display: grid;
            gap: 16px;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr))
        }

        .btn {
            border: 0;
            border-radius: 14px;
            padding: 12px 20px;
            font-weight: 700;
            background: var(--ink);
            color: var(--bg);
            min-height: 46px;
            transition: transform .15s
        }

        .btn:hover {
            transform: translateY(-2px)
        }

        .btn.ghost {
            background: transparent;
            color: var(--ink);
            border: 2px solid var(--line)
        }

        .btn.pri {
            background: #FF6578;
            color: #fff
        }

        .btn:disabled {
            opacity: .45;
            cursor: not-allowed;
            transform: none
        }

        .hero {
            display: grid;
            gap: 24px;
            grid-template-columns: 1.3fr 1fr;
            align-items: center;
            padding: 10px 0 26px
        }

        .hero p {
            font-size: 1.15rem;
            color: var(--mut)
        }

        .hero .acts {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 16px
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px
        }

        .stat {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 14px
        }

        .stat b {
            display: block;
            font: 800 1.8rem Fraunces, serif
        }

        .stat span {
            color: var(--mut);
            font-size: .85rem
        }

        .ring {
            --p: 0;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: conic-gradient(#36C9AE calc(var(--p)*1%), var(--line) 0);
            display: grid;
            place-items: center;
            transition: .8s
        }

        .ring i {
            font: 800 1.5rem Fraunces, serif;
            font-style: normal;
            background: var(--card);
            width: 100px;
            height: 100px;
            border-radius: 50%;
            display: grid;
            place-items: center
        }

        .ch {
            position: relative;
            overflow: hidden;
            border-top: 8px solid var(--c);
            transition: transform .2s, box-shadow .2s
        }

        .ch:hover {
            transform: translateY(-4px)
        }

        .ch .em {
            font-size: 2.4rem;
            position: absolute;
            right: 12px;
            top: 6px;
            opacity: .9
        }

        .bar {
            height: 9px;
            background: var(--line);
            border-radius: 9px;
            overflow: hidden
        }

        .bar>div {
            height: 100%;
            background: var(--c, #36C9AE);
            transition: width .5s;
            border-radius: 9px
        }

        .mut {
            color: var(--mut);
            font-size: .9rem
        }

        .row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center
        }

        .sp {
            flex: 1
        }

        .opt {
            display: flex;
            gap: 12px;
            width: 100%;
            text-align: left;
            padding: 14px 16px;
            margin: 10px 0;
            border-radius: 16px;
            border: 2px solid var(--line);
            background: var(--card);
            min-height: 56px;
            align-items: center;
            transition: .15s
        }

        .opt:hover:not(:disabled) {
            border-color: var(--c);
            transform: translateY(-2px)
        }

        .opt .l {
            flex: none;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: var(--c);
            color: #fff;
            display: grid;
            place-items: center;
            font-weight: 700
        }

        .opt.sel {
            border-color: var(--c);
            background: color-mix(in srgb, var(--c) 14%, var(--card))
        }

        .opt.good {
            border-color: var(--ok);
            background: color-mix(in srgb, var(--ok) 16%, var(--card))
        }

        .opt.bad {
            border-color: var(--bad);
            background: color-mix(in srgb, var(--bad) 14%, var(--card))
        }

        .opt .tag {
            margin-left: auto;
            font-weight: 700;
            white-space: nowrap
        }

        .q {
            font: 600 1.4rem/1.35 Fraunces, serif
        }

        .fb {
            padding: 12px 16px;
            border-radius: 14px;
            margin-top: 12px;
            font-weight: 500
        }

        .fb.good {
            background: color-mix(in srgb, var(--ok) 16%, transparent)
        }

        .fb.bad {
            background: color-mix(in srgb, var(--bad) 14%, transparent)
        }

        .pal {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
            gap: 6px
        }

        .pal button {
            height: 40px;
            border-radius: 10px;
            border: 2px solid var(--line);
            background: var(--card)
        }

        .pal .a {
            background: #7282FF;
            color: #fff;
            border-color: #7282FF
        }

        .pal .f {
            outline: 3px solid #FFAD36
        }

        .pal .c {
            border: 3px solid var(--ink)
        }

        .two {
            display: grid;
            gap: 16px;
            grid-template-columns: 1fr 280px
        }

        input,
        select {
            font: inherit;
            padding: 10px 12px;
            border-radius: 12px;
            border: 2px solid var(--line);
            background: var(--card);
            color: var(--ink);
            min-height: 44px
        }

        label.k {
            display: flex;
            gap: 8px;
            align-items: center;
            margin: 8px 0
        }

        table {
            border-collapse: collapse;
            width: 100%
        }

        td,
        th {
            padding: 8px 10px;
            border-bottom: 1px solid var(--line);
            text-align: left
        }

        details {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 12px 16px;
            margin: 10px 0
        }

        summary {
            font-weight: 700;
            cursor: pointer;
            min-height: 32px
        }

        .toast {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--ink);
            color: var(--bg);
            padding: 10px 18px;
            border-radius: 99px;
            z-index: 50
        }

        .pop {
            position: fixed;
            font-size: 1.6rem;
            pointer-events: none;
            animation: fly 1.3s ease-out forwards;
            z-index: 40
        }

        @keyframes fly {
            to {
                transform: translate(var(--x), -260px) rotate(360deg);
                opacity: 0
            }
        }

        .modal {
            position: fixed;
            inset: 0;
            background: #0008;
            display: grid;
            place-items: center;
            z-index: 60;
            padding: 16px
        }

        .modal .card {
            max-width: 420px
        }

        @media(max-width:760px) {

            .hero,
            .two {
                grid-template-columns: 1fr
            }

            .q {
                font-size: 1.2rem
            }
        }

        @media(prefers-reduced-motion:reduce) {
            * {
                animation: none !important;
                transition: none !important
            }
        }
    </style>
</head>

 6, "sourcePage": 2}, {"id": 292, "chapterId": "part2-veg", "subtopic": "Advanced Vegetable Preparation & Preservation", "question": "Glazed vegetables are finished when:", "options": [{"label": "A", "text": "They are mushy"}, {"label": "B", "text": "They appear shiny and the liquid has reduced to a syrup/glaze"}, {"label": "C", "text": "They are pale"}, {"label": "D", "text": "They are dry"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 7, "sourcePage": 2}, {"id": 293, "chapterId": "part2-veg", "subtopic": "Advanced Vegetable Preparation & Preservation", "question": "Blanching and shocking (ice bath) accomplishes all EXCEPT:", "options": [{"label": "A", "text": "Setting color"}, {"label": "B", "text": "Killing all spores (it does NOT sterilize — only reduces enzymes)"}, {"label": "C", "text": "Loosening skins"}, {"label": "D", "text": "Cleaning surface"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 8, "sourcePage": 2}, {"id": 294, "chapterId": "part2-veg", "subtopic": "Advanced Vegetable Preparation & Preservation", "question": "Frozen vegetables are typically blanched before freezing primarily to:", "options": [{"label": "A", "text": "Add flavor"}, {"label": "B", "text": "Inactivate enzymes that cause deterioration during storage"}, {"label": "C", "text": "Freeze faster"}, {"label": "D", "text": "Add color"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 9, "sourcePage": 3}, {"id": 295, "chapterId": "part2-veg", "subtopic": "Advanced Vegetable Preparation & Preservation", "question": "Dried vegetables (like dried mushrooms or tomatoes) should be rehydrated by:", "options": [{"label": "A", "text": "Boiling rapidly"}, {"label": "B", "text": "Soaking in warm/room-temperature liquid (often the cooking liquid)"}, {"label": "C", "text": "Frying"}, {"label": "D", "text": "Roasting"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 10, "sourcePage": 3}, {"id": 296, "chapterId": "part2-veg", "subtopic": "Advanced Vegetable Preparation & Preservation", "question": "When using canned vegetables, the liquid (brine) should usually be:", "options": [{"label": "A", "text": "Used as is (too salty)"}, {"label": "B", "text": "Drained and rinsed, or adjusted for seasoning"}, {"label": "C", "text": "Thrown away immediately without tasting"}, {"label": "D", "text": "Reduced heavily"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 11, "sourcePage": 3}, {"id": 297, "chapterId": "part2-veg", "subtopic": "Advanced Vegetable Preparation & Preservation", "question": "The term à l'anglaise (English style) for boiling vegetables means:", "options": [{"label": "A", "text": "In butter"}, {"label": "B", "text": "In plenty of rapidly boiling, salted water, served plain or with butter"}, {"label": "C", "text": "In cream"}, {"label": "D", "text": "In broth"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 12, "sourcePage": 3}, {"id": 298, "chapterId": "part2-veg", "subtopic": "Advanced Vegetable Preparation & Preservation", "question": "À la crème refers to vegetables cooked/served with:", "options": [{"label": "A", "text": "Oil"}, {"label": "B", "text": "Béchamel or heavy cream sauce"}, {"label": "C", "text": "Vinegar"}, {"label": "D", "text": "Tomato sauce"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 13, "sourcePage": 3}, {"id": 299, "chapterId": "part2-veg", "subtopic": "Advanced Vegetable Preparation & Preservation", "question": "When sautéing hard vegetables (carrots, celery) alongside soft ones (zucchini, peppers):", "options": [{"label": "A", "text": "Add all together"}, {"label": "B", "text": "Add hard vegetables first (or cut them smaller/thinner) to ensure even doneness"}, {"label": "C", "text": "Add soft first"}, {"label": "D", "text": "Do not mix"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 14, "sourcePage": 3}, {"id": 300, "chapterId": "part2-veg", "subtopic": "Advanced Vegetable Preparation & Preservation", "question": "Roasting vegetables at high heat (400–425 °F / 200–220 °C) enhances flavor through:", "options": [{"label": "A", "text": "Steaming"}, {"label": "B", "text": "Caramelization of natural sugars and Maillard browning"}, {"label": "C", "text": "Boiling"}, {"label": "D", "text": "Fermentation"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 15, "sourcePage": 3}, {"id": 301, "chapterId": "part2-potatoes", "subtopic": "Potatoes & Potato Products", "question": "Botanically, the potato is classified as a:", "options": [{"label": "A", "text": "Root"}, {"label": "B", "text": "Tuber (modified underground stem)"}, {"label": "C", "text": "Bulb"}, {"label": "D", "text": "Rhizome"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 16, "sourcePage": 4}, {"id": 302, "chapterId": "part2-potatoes", "subtopic": "Potatoes & Potato Products", "question": "The two main culinary classifications of potatoes are based on:", "options": [{"label": "A", "text": "Color"}, {"label": "B", "text": "Starch content: high-starch (floury) vs. low-starch (waxy)"}, {"label": "C", "text": "Size"}, {"label": "D", "text": "Country of origin"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 17, "sourcePage": 4}, {"id": 303, "chapterId": "part2-potatoes", "subtopic": "Potatoes & Potato Products", "question": "High-starch/floury potatoes (e.g., Russet/Burbank, Idaho) are characterized by:", "options": [{"label": "A", "text": "Waxy texture"}, {"label": "B", "text": "Dry, fluffy texture when cooked; low sugar content; skin separates easily"}, {"label": "C", "text": "Firm, moist, holds shape"}, {"label": "D", "text": "Very sweet"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 18, "sourcePage": 4}, {"id": 304, "chapterId": "part2-potatoes", "subtopic": "Potatoes & Potato Products", "question": "Low-starch/waxy potatoes (e.g., red, new, fingerling, Yukon Gold) have:", "options": [{"label": "A", "text": "Fluffy texture"}, {"label": "B", "text": "Higher moisture and sugar; firm, waxy texture; holds shape well"}, {"label": "C", "text": "Dry, mealy"}, {"label": "D", "text": "No starch"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 19, "sourcePage": 4}, {"id": 305, "chapterId": "part2-potatoes", "subtopic": "Potatoes & Potato Products", "question": "All-purpose potatoes (medium starch) are best suited for:", "options": [{"label": "A", "text": "Only mashing"}, {"label": "B", "text": "Most general cooking (boiling, roasting, pan-frying, soups)"}, {"label": "C", "text": "Only frying"}, {"label": "D", "text": "Only salads"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 20, "sourcePage": 4}, {"id": 306, "chapterId": "part2-potatoes", "subtopic": "Potatoes & Potato Products", "question": "For mashed potatoes (purée), the best choice is:", "options": [{"label": "A", "text": "Waxy"}, {"label": "B", "text": "High-starch/floury (Russet) — yields light, fluffy texture"}, {"label": "C", "text": "Only red"}, {"label": "D", "text": "Sweet potato"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 21, "sourcePage": 4}, {"id": 307, "chapterId": "part2-potatoes", "subtopic": "Potatoes & Potato Products", "question": "For potato salads where you want slices to hold shape, use:", "options": [{"label": "A", "text": "Floury"}, {"label": "B", "text": "Waxy (red, new) or all-purpose"}, {"label": "C", "text": "Only baking potatoes"}, {"label": "D", "text": "Sweet potatoes"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 22, "sourcePage": 4}, {"id": 308, "chapterId": "part2-potatoes", "subtopic": "Potatoes & Potato Products", "question": "To test whether a potato is floury or waxy, you can perform a:", "options": [{"label": "A", "text": "Taste test"}, {"label": "B", "text": "Specific gravity test (float in brine — high-starch sinks more)"}, {"label": "C", "text": "Color test"}, {"label": "D", "text": "Smell test"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 23, "sourcePage": 4}, {"id": 309, "chapterId": "part2-potatoes", "subtopic": "Potatoes & Potato Products", "question": "Green discoloration on potatoes indicates the presence of:", "options": [{"label": "A", "text": "Chlorophyll (harmless alone)"}, {"label": "B", "text": "Solanine — a toxic glycoalkaloid (must be peeled/cut away deeply)"}, {"label": "C", "text": "Mold"}, {"label": "D", "text": "Iron oxidation"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 24, "sourcePage": 4}, {"id": 310, "chapterId": "part2-potatoes", "subtopic": "Potatoes & Potato Products", "question": "Solanine poisoning from potatoes causes symptoms including:", "options": [{"label": "A", "text": "Happiness"}, {"label": "B", "text": "Nausea, headache, and neurological issues (avoid eating green parts/sprouts)"}, {"label": "C", "text": "Energy boost"}, {"label": "D", "text": "Vitamin C overdose"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 25, "sourcePage": 5}, {"id": 311, "chapterId": "part2-potatoes", "subtopic": "Potatoes & Potato Products", "question": "Black spots inside potatoes are caused by:", "options": [{"label": "A", "text": "Iron"}, {"label": "B", "text": "Bruising/damage (oxidation) or disease — should be cut out"}, {"label": "C", "text": "Cooking too fast"}, {"label": "D", "text": "Undercooking"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 26, "sourcePage": 5}, {"id": 312, "chapterId": "part2-potatoes", "subtopic": "Potatoes & Potato Products", "question": "Potatoes should be stored:", "options": [{"label": "A", "text": "Refrigerated (cold converts starch to sugar = bad texture/sweetness)"}, {"label": "B", "text": "Cool (45–50 °F / 7–10 °C), dark, dry, ventilated, away from onions"}, {"label": "C", "text": "Warm"}, {"label": "D", "text": "In sunlight"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 27, "sourcePage": 5}, {"id": 313, "chapterId": "part2-potatoes", "subtopic": "Potatoes & Potato Products", "question": "Refrigerating raw potatoes for long periods causes:", "options": [{"label": "A", "text": "Faster cooking"}, {"label": "B", "text": "Starch-to-sugar conversion (makes them sweet and dark when fried)"}, {"label": "C", "text": "Sprouting inhibition"}, {"label": "D", "text": "Softening"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 28, "sourcePage": 5}, {"id": 314, "chapterId": "part2-potatoes", "subtopic": "Potatoes & Potato Products", "question": "Peeling potatoes should be done:", "options": [{"label": "A", "text": "Long before cooking"}, {"label": "B", "text": "As close to cooking as possible to prevent discoloration/waste"}, {"label": "C", "text": "After boiling"}, {"label": "D", "text": "Never"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 29, "sourcePage": 5}, {"id": 315, "chapterId": "part2-potatoes", "subtopic": "Potatoes & Potato Products", "question": "Cut potatoes turn gray/brown due to enzymatic browning (tyrosinase); to prevent this, hold cut potatoes in:", "options": [{"label": "A", "text": "Hot water"}, {"label": "B", "text": "Cold water (submerged to exclude air) or acidulated water"}, {"label": "C", "text": "Oil"}, {"label": "D", "text": "Open air"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 30, "sourcePage": 5}, {"id": 316, "chapterId": "part2-potatoes", "subtopic": "Potatoes & Potato Products", "question": "Soaking cut potatoes in water:", "options": [{"label": "A", "text": "Adds nutrients"}, {"label": "B", "text": "Leaches some water-soluble vitamins (vitamin C) but prevents browning"}, {"label": "C", "text": "Adds starch"}, {"label": "D", "text": "Is never necessary"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 31, "sourcePage": 5}, {"id": 317, "chapterId": "part2-potatoes", "subtopic": "Potatoes & Potato Products", "question": "When boiling potatoes, start them in:", "options": [{"label": "A", "text": "Cold water (allows even heating through to center before exterior overcooks)"}, {"label": "B", "text": "Rapidly boiling water"}, {"label": "C", "text": "Oil"}, {"label": "D", "text": "Steam"}], "correctOption": "A", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 32, "sourcePage": 5}, {"id": 318, "chapterId": "part2-potatoes", "subtopic": "Potatoes & Potato Products", "question": "Starting potatoes in cold water vs. boiling water affects:", "options": [{"label": "A", "text": "Color only"}, {"label": "B", "text": "Evenness of cooking (cold start = more even; hot start = may be uneven/outside mushy)"}, {"label": "C", "text": "Flavor"}, {"label": "D", "text": "Nutritional value only"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 33, "sourcePage": 6}, {"id": 319, "chapterId": "part2-potatoes", "subtopic": "Potatoes & Potato Products", "question": "Potatoes are done boiling when:", "options": [{"label": "A", "text": "They float"}, {"label": "B", "text": "A paring knife or skewer slips through with little resistance (tender throughout)"}, {"label": "C", "text": "They burst"}, {"label": "D", "text": "Water turns cloudy"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuesti ": "part2-potatoes", "subtopic": "Potatoes & Potato Products", "question": "Classic French potato purée (Pommes Purée) contains roughly:", "options": [{"label": "A", "text": "Only potatoes"}, {"label": "B", "text": "Approximately 1 part butter to 4 parts potato (by weight), plus hot milk/cream"}, {"label": "C", "text": "Equal butter and potato"}, {"label": "D", "text": "No fat"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 39, "sourcePage": 6}, {"id": 325, "chapterId": "part2-potatoes", "subtopic": "Potatoes & Potato Products", "question": "Pommes Duchesse is made by:", "options": [{"label": "A", "text": "Boiling and mashing"}, {"label": "B", "text": "Mixing potato purée with egg yolks and butter, then piping into shapes and baking/browning"}, {"label": "C", "text": "Frying"}, {"label": "D", "text": "Grilling"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 40, "sourcePage": 6}, {"id": 326, "chapterId": "part2-potatoes", "subtopic": "Potatoes & Potato Products", "question": "Pommes Duchesse piped shapes are usually finished by:", "options": [{"label": "A", "text": "Steaming"}, {"label": "B", "text": "Baking/gilding in oven until golden brown"}, {"label": "C", "text": "Boiling"}, {"label": "D", "text": "Deep-frying"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 41, "sourcePage": 6}, {"id": 327, "chapterId": "part2-potatoes", "subtopic": "Potatoes & Potato Products", "question": "Baked potatoes should have skins:", "options": [{"label": "A", "text": "Scrubbed, oiled/salted (optional), pricked to allow steam escape"}, {"label": "B", "text": "Peeled"}, {"label": "C", "text": "Wrapped tightly in foil (steams instead of bakes)"}], "correctOption": "A", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 42, "sourcePage": 7}, {"id": 328, "chapterId": "part2-potatoes", "subtopic": "Potatoes & Potato Products", "question": "Pricking baked potatoes before baking prevents:", "options": [{"label": "A", "text": "Drying out"}, {"label": "B", "text": "Bursting from internal steam pressure"}, {"label": "C", "text": "Browning"}, {"label": "D", "text": "Seasoning absorption"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 43, "sourcePage": 7}, {"id": 329, "chapterId": "part2-potatoes", "subtopic": "Potatoes & Potato Products", "question": "Ideal baking temperature for potatoes is:", "options": [{"label": "A", "text": "300 °F"}, {"label": "B", "text": "400–425 °F (200–220 °C) until tender (45 min – 1 hr)"}, {"label": "C", "text": "500 °F"}, {"label": "D", "text": "200 °F"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 44, "sourcePage": 7}, {"id": 330, "chapterId": "part2-potatoes", "subtopic": "Potatoes & Potato Products", "question": "To test a baked potato for doneness, it should yield to:", "options": [{"label": "A", "text": "Gentle squeeze (soft throughout)"}, {"label": "B", "text": "Hard touch"}, {"label": "C", "text": "Knife slip (squeeze is the traditional test)"}, {"label": "D", "text": "Color change"}], "correctOption": "A", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 45, "sourcePage": 7}, {"id": 331, "chapterId": "part2-potatoes", "subtopic": "Potatoes & Potato Products", "question": "Roasted potatoes differ from baked in that they are usually:", "options": [{"label": "A", "text": "Whole and unpeeled"}, {"label": "B", "text": "Cut into pieces, often tossed with fat/herbs, high heat for browning"}, {"label": "C", "text": "Boiled first"}, {"label": "D", "text": "Wrapped"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 46, "sourcePage": 7}, {"id": 332, "chapterId": "part2-potatoes", "subtopic": "Potatoes & Potato Products", "question": "For crispy roasted potatoes, the key technique is:", "options": [{"label": "A", "text": "Boiling thoroughly first"}, {"label": "B", "text": "Parboiling/blanching briefly, then roughing up the surface (fluffing edges), roasting in hot fat"}, {"label": "C", "text": "Using no oil"}, {"label": "D", "text": "Low temperature"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 47, "sourcePage": 7}, {"id": 333, "chapterId": "part2-potatoes", "subtopic": "Potatoes & Potato Products", "question": "Sautéed potatoes (Pommes Sautées) are:", "options": [{"label": "A", "text": "Deep-fried"}, {"label": "B", "text": "Pan-fried in a moderate amount of fat until golden and tender, often finished with herbs"}, {"label": "C", "text": "Boiled"}, {"label": "D", "text": "Raw"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 48, "sourcePage": 7}, {"id": 334, "chapterId": "part2-potatoes", "subtopic": "Potatoes & Potato Products", "question": "Pommes Lyonnaise (Lyon-style potatoes) are sautéed with:", "options": [{"label": "A", "text": "Cream"}, {"label": "B", "text": "Onions and parsley (sometimes finished in oven)"}, {"label": "C", "text": "Bacon only"}, {"label": "D", "text": "Cheese"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 49, "sourcePage": 7}, {"id": 335, "chapterId": "part2-potatoes", "subtopic": "Potatoes & Potato Products", "question": "When pan-frying/sautéing raw potatoes, do NOT:", "options": [{"label": "A", "text": "Use enough fat"}, {"label": "B", "text": "Crowd the pan (lowers temperature = steaming instead of browning)"}, {"label": "C", "text": "Use medium-high heat"}, {"label": "D", "text": "Season"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 50, "sourcePage": 7}, {"id": 336, "chapterId": "part2-potatoes", "subtopic": "Potatoes & Potato Products", "question": "Hash browns / shredded pan-fried potatoes require:", "options": [{"label": "A", "text": "Boiling first"}, {"label": "B", "text": "Raw shredded potatoes, squeezed dry of excess moisture, pressed flat in hot fat"}, {"label": "C", "text": "Mashing"}, {"label": "D", "text": "Baking"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 51, "sourcePage": 8}, {"id": 337, "chapterId": "part2-potatoes", "subtopic": "Potatoes & Potato Products", "question": "French fries (Pommes Frites) are:", "options": [{"label": "A", "text": "Boiled"}, {"label": "B", "text": "Deep-fried in fat (usually twice — once to cook/blanch, second to crisp/brown)"}, {"label": "C", "text": "Baked"}, {"label": "D", "text": "Sautéed"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 52, "sourcePage": 8}, {"id": 338, "chapterId": "part2-potatoes", "subtopic": "Potatoes & Potato Products", "question": "The double-frying method for french fries:", "options": [{"label": "A", "text": "Takes longer unnecessarily"}, {"label": "B", "text": "First fry at lower temperature (325–350 °F) to cook through; second fry at higher (375 °F) to crisp and brown"}, {"label": "C", "text": "Fries once only"}, {"label": "D", "text": "Uses oil then butter"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 53, "sourcePage": 8}, {"id": 339, "chapterId": "part2-potatoes", "subtopic": "Potatoes & Potato Products", "question": "Before frying, cut potatoes should be:", "options": [{"label": "A", "text": "Dried thoroughly"}, {"label": "B", "text": "Rinsed of excess surface starch AND patted very dry (prevents splattering, ensures crispness)"}, {"label": "C", "text": "Soaked in water until fried"}, {"label": "D", "text": "Sugared"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 54, "sourcePage": 8}, {"id": 340, "chapterId": "part2-potatoes", "subtopic": "Potatoes & Potato Products", "question": "Oil temperature for frying potatoes should typically be maintained around:", "options": [{"label": "A", "text": "250 °F"}, {"label": "B", "text": "325–375 °F (165–190 °C) — too cool = greasy, too hot = burns outside/raw inside"}, {"label": "C", "text": "500 °F"}, {"label": "D", "text": "212 °F"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 55, "sourcePage": 8}, {"id": 341, "chapterId": "part2-potatoes", "subtopic": "Potatoes & Potato Products", "question": "Pommes Soufflées (puffed potatoes) achieve their hollow, puffed interior through:", "options": [{"label": "A", "text": "Baking"}, {"label": "B", "text": "Double-frying at different temperatures causing steam puffing"}, {"label": "C", "text": "Whipping air in"}, {"label": "D", "text": "Yeast"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 56, "sourcePage": 8}, {"id": 342, "chapterId": "part2-potatoes", "subtopic": "Potatoes & Potato Products", "question": "Pommes Paillasson (hash brown cake / Rösti style) is:", "options": [{"label": "A", "text": "Mashed"}, {"label": "B", "text": "Shredded raw potato formed into a cake, pressed, and pan-fried/browned on both sides"}, {"label": "C", "text": "Boiled"}, {"label": "D", "text": "Souffléed"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 57, "sourcePage": 8}, {"id": 343, "chapterId": "part2-potatoes", "subtopic": "Potatoes & Potato Products", "question": "A gratin is:", "options": [{"label": "A", "text": "A soup"}, {"label": "B", "text": "A dish topped with breadcrumbs, cheese, and/or butter, browned under a salamander/broiler/gratin oven"}, {"label": "C", "text": "A salad"}, {"label": "D", "text": "A sauce"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 58, "sourcePage": 8}, {"id": 344, "chapterId": "part2-potatoes", "subtopic": "Potatoes & Potato Products", "question": "Gratin Dauphinois is a classic French dish of:", "options": [{"label": "A", "text": "Thinly sliced raw potatoes baked in cream/garlic/seasonings (often no egg) with cheese crust"}, {"label": "B", "text": "Mashed potatoes with ham"}, {"label": "C", "text": "Fried potatoes"}, {"label": "D", "text": "Boiled potatoes"}], "correctOption": "A", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 59, "sourcePage": 9}, {"id": 345, "chapterId": "part2-potatoes", "subtopic": "Potatoes & Potato Products", "question": "Key to preventing Gratin Dauphinois from curdling/separating:", "options": [{"label": "A", "text": "High heat"}, {"label": "B", "text": "Gentle baking, not boiling the cream excessively; some flour coating on potatoes helps stabilize"}, {"label": "C", "text": "No cream"}, {"label": "D", "text": "No cheese"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 60, "sourcePage": 9}, {"id": 346, "chapterId": "part2-potatoes", "subtopic": "Potatoes & Potato Products", "question": "Boulangère potatoes are baked with:", "options": [{"label": "A", "text": "Cream"}, {"label": "B", "text": "Onions and stock/broth (no cream), sometimes with lamb drippings"}, {"label": "C", "text": "Cheese only"}, {"label": "D", "text": "Sugar"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 61, "sourcePage": 9}, {"id": 347, "chapterId": "part2-potatoes", "subtopic": "Potatoes & Potato Products", "question": "Anna potatoes (Pommes Anna) are:", "options": [{"label": "A", "text": "Mashed"}, {"label": "B", "text": "Very thinly sliced potatoes arranged in layers in a special pan with butter, cooked until crisp/golden (turned out like a cake)"}, {"label": "C", "text": "Shredded"}, {"label": "D", "text": "Boiled G. Other Preparations"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 62, "sourcePage": 9}, {"id": 348, "chapterId": "part2-potatoes", "subtopic": "Potatoes & Potato Products", "question": "Potato croquettes are:", "options": [{"label": "A", "text": "Baked"}, {"label": "B", "text": "Breaded and deep-fried balls of potato purée (often mixed with egg/binder)"}, {"label": "C", "text": "Boiled"}, {"label": "D", "text": "Raw"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 63, "sourcePage": 9}, {"id": 349, "chapterId": "part2-potatoes", "subtopic": "Potatoes & Potato Products", "question": "Stuffed potatoes (baked jackets) should have the flesh scooped out while:", "options": [{"label": "A", "text": "Cold"}, {"label": "B", "text": "Hot"}, {"label": "C", "text": "Frozen"}, {"label": "D", "text": "Raw, mixed with other ingredients, then returned to shell to bake again"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 64, "sourcePage": 9}, {"id": 350, "chapterId": "part2-potatoes", "subtopic": "Potatoes & Potato Products", "question": "When making hash (corned beef hash, etc.), the potatoes should be:", "options": [{"label": "A", "text": "Raw"}, {"label": "B", "text": "Cooked (boiled/baked) previously, then diced and pan-fried"}, {"label": "C", "text": "Pureed"}, {"label": "D", "text": "Fried only"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 65, "sourcePage": 9}, {"id": 351, "chapterId": "part2-dairy", "subtopic": "Dairy Products: Butter & Beyond", "question": "By US legal standard, butter must contain at least:", "options": [{"label": "A", "text": "60% fat"}, {"label": "B", "text": "80% milkfat"}, {"label": "C", "text": "90% fat"}, {"label": "D", "text": "70% fat"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 66, "sourcePage": 10}, {"id": 352, "chapterId": "part2-dairy", "subtopic": "Dairy Products: Butter & Beyond", "question": "The remaining approximate composition of butter (besides the ~80% fat) is:", "options": [{"label": "A", "text": "Protein and sugar"}, {"label": "B", "text": "16– , "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 75, "sourcePage": 11}, {"id": 361, "chapterId": "part2-dairy", "subtopic": "Dairy Products: Butter & Beyond", "question": "Beurre noisette (brown/nutty butter) is made by:", "options": [{"label": "A", "text": "Melting gently"}, {"label": "B", "text": "Heating butter until the milk solids turn golden brown and smell nutty/toasty"}, {"label": "C", "text": "Burning it black"}, {"label": "D", "text": "Freezing it"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 76, "sourcePage": 11}, {"id": 362, "chapterId": "part2-dairy", "subtopic": "Dairy Products: Butter & Beyond", "question": "Beurre noir (black butter) is made by:", "options": [{"label": "A", "text": "Light browning"}, {"label": "B", "text": "Heating butter further than noisette until the solids are very dark brown/almost black (often finished with vinegar/capers)"}, {"label": "C", "text": "Clarifying"}, {"label": "D", "text": "Churning"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 77, "sourcePage": 11}, {"id": 363, "chapterId": "part2-dairy", "subtopic": "Dairy Products: Butter & Beyond", "question": "Compound butters (flavored butters like maître d'hôtel, garlic herb) are made by:", "options": [{"label": "A", "text": "Heating"}, {"label": "B", "text": "Softening butter and mixing in flavorings (herbs, spices, wine, shallots), then rolling/chilling"}, {"label": "C", "text": "Clarifying"}, {"label": "D", "text": "Browning"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 78, "sourcePage": 11}, {"id": 364, "chapterId": "part2-dairy", "subtopic": "Dairy Products: Butter & Beyond", "question": "Beurre monté is an emulsion technique where:", "options": [{"label": "A", "text": "Butter is melted separately"}, {"label": "B", "text": "Small cubes of cold butter are whisked into a small amount of warm liquid to gar first"}, {"label": "D", "text": "Using aluminum pans"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 87, "sourcePage": 12}, {"id": 373, "chapterId": "part2-dairy", "subtopic": "Dairy Products: Butter & Beyond", "question": "If a dairy sauce breaks/curdles (separates):", "options": [{"label": "A", "text": "Throw away immediately"}, {"label": "B", "text": "Can sometimes be rescued by adding a small amount of cold liquid or an ice cube and whisking vigorously off heat, or blending"}, {"label": "C", "text": "Keep boiling"}, {"label": "D", "text": "Add salt"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 88, "sourcePage": 12}, {"id": 374, "chapterId": "part2-dairy", "subtopic": "Dairy Products: Butter & Beyond", "question": "An egg grade (AA, A, B) refers to:", "options": [{"label": "A", "text": "Size"}, {"label": "B", "text": "Interior quality (air cell size, white firmness, yolk prominence) and shell condition"}, {"label": "C", "text": "Weight only"}, {"label": "D", "text": "Color"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 89, "sourcePage": 12}, {"id": 375, "chapterId": "part2-dairy", "subtopic": "Dairy Products: Butter & Beyond", "question": "Egg sizes (Small, Medium, Large, XL, Jumbo) refer to:", "options": [{"label": "A", "text": "Shell thickness"}, {"label": "B", "text": "Minimum weight per dozen (Large = approx. 24 oz / 680 g per dozen)"}, {"label": "C", "text": "Yolk size"}, {"label": "D", "text": "Age"}], "correctOption": "B", "sourceTitle": "The Professional Chef — Part II", "sourceQuestionId": 90, "sourcePage": 12}, {"id": 376, "chapterId": "part2-dairy", "subtopic": "Dairy Products: Butter & Beyond", "question": "The white (albumen) begins to coagulate (set) at approximately:", "options": [{"label": "A", "text": "180 °F"}, {"label": "B", "text": "140–149 °F (60–65 °C)"}, {"label": "C", "text": "212 °F"}, {"la
