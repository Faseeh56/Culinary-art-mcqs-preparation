ext": "Housekeeper"}, {"label": "B", "text": "Valet"}, {"label": "C", "text": "Concierge"}, {"label": "D", "text": "Sommelier"}], "correctOption": "C", "sourceTitle": "Communication & Workplace Skills (Chapters 1–5) — Question Bank", "sourceQuestionId": 56, "sourcePage": 11}, {"id": 652, "chapterId": "comm-03", "subtopic": "Basic English for the Workplace", "question": "A large, premium hotel accommodation featuring separate connected living and sleeping areas is a:", "options": [{"label": "A", "text": "Standard single"}, {"label": "B", "text": "Suite"}, {"label": "C", "text": "Dormitory"}, {"label": "D", "text": "Cabana"}], "correctOption": "B", "sourceTitle": "Communication & Workplace Skills (Chapters 1–5) — Question Bank", "sourceQuestionId": 57, "sourcePage": 11}, {"id": 653, "chapterId": "comm-03", "subtopic": "Basic English for the Workplace", "question": "Free facilities and services provided to hotel guests (such as high-speed Wi-Fi, swimming pool access, gym, and bathrobes) are called:", "options": [{"label": "A", "text": "Tariffs"}, {"label": "B", "text": "Amenities"}, {"label": "C", "text": "Surcharges"}, {"label": "D", "text": "Luggage"}], "correctOption": "B", "sourceTitle": "Communication & Workplace Skills (Chapters 1–5) — Question Bank", "sourceQuestionId": 58, "sourcePage": 11}, {"id": 654, "chapterId": "comm-03", "subtopic": "Basic English for the Workplace", "question": "The hotel department responsible for cleaning, sanitizing, and servicing guest rooms and public areas is:", "options": [{"label": "A", "text": "Front office"}, {"label": "B", "text": "Concierge"}, {"label": "C", "text": "Housekeeping"}, {"label": "D", "text": "Security"}], "correctOption": "C", "sourceTitle": "Communication & Workplace Skills (Chapters 1–5) — Question Bank", "sourceQuestionId": 59, "sourcePage": 11}, {"id": 655, "chapterId": "comm-03", "subtopic": "Basic English for the Workplace", "question": "The metric expressing the percentage of total hotel rooms occupied by paying guests on a given night is:", "options": [{"label": "A", "text": "Room turnover"}, {"label": "B", "text": "Occupancy"}, {"label": "C", "text": "Yield quota"}, {"label": "D", "text": "Density"}], "correctOption": "B", "sourceTitle": "Communication & Workplace Skills (Chapters 1–5) — Question Bank", "sourceQuestionId": 60, "sourcePage": 11}, {"id": 656, "chapterId": "comm-03", "subtopic": "Basic English for the Workplace", "question": "A specialized parking service where hotel staff park and retrieve guests' personal motor vehicles is:", "options": [{"label": "A", "text": "Transit"}, {"label": "B", "text": "Concierge"}, {"label": "C", "text": "Valet service"}, {"label": "D", "text": "Housekeeping"}], "correctOption": "C", "sourceTitle": "Communication & Workplace Skills (Chapters 1–5) — Question Bank", "sourceQuestionId": 61, "sourcePage": 12}, {"id": 657, "chapterId": "comm-03", "subtopic": "Basic English for the Workplace", "question": "The evening hotel service where housekeeping prepares the bed, dims lighting, and places chocolates on pillows is called:", "options": [{"label": "A", "text": "Early check-in"}, {"label": "B", "text": "Room turnover"}, {"label": "C", "text": "Turndown service"}, {"label": "D", "text": "Room audit"}], "correctOption": "C", "sourceTitle": "Communication & Workplace Skills (Chapters 1–5) — Question Bank", "sourceQuestionId": 62, "sourcePage": 12}, {"id": 658, "chapterId": "comm-03", "subtopic": "Basic English for the Workplace", "question": "When a guest receives permission to vacate their hotel room past the standard checkout time (e.g., at 3:00 PM instead of 11:00 AM), it is a:", "options": [{"label": "A", "text": "Early departure"}, {"label": "B", "text": "Late check-out"}, {"label": "C", "text": "Check-in delay"}, {"label": "D", "text": "Turndown extension"}], "correctOption": "B", "sourceTitle": "Communication & Workplace Skills (Chapters 1–5) — Question Bank", "sourceQuestionId": 63, "sourcePage": 12}, {"id": 659, "chapterId": "comm-03", "subtopic": "Basic English for the Workplace", "question": "A detailed, structured schedule or travel plan outlining destinations, times, and activities for a journey is an:", "options": [{"label": "A", "text": "Boarding pass"}, {"label": "B", "text": "Visa"}, {"label": "C", "text": "Itinerary"}, {"label": "D", "text": "Excursion"}], "correctOption": "C", "sourceTitle": "Communication & Workplace Skills (Chapters 1–5) — Question Bank", "sourceQuestionId": 64, "sourcePage": 12}, {"id": 660, "chapterId": "comm-03", "subtopic": "Basic English for the Workplace", "question": "A short, organized recreational trip or tour taken during a larger vacation is an:", "options": [{"label": "A", "text": "Transit"}, {"label": "B", "text": "Excursion"}, {"label": "C", "text": "Transfer"}, {"label": "D", "text": "Itinerary"}], "correctOption": "B", "sourceTitle": "Communication & Workplace Skills (Chapters 1–5) — Question Bank", "sourceQuestionId": 65, "sourcePage": 12}, {"id": 661, "chapterId": "comm-03", "subtopic": "Basic English for the Workplace", "question": "An official government endorsement stamped into a passport granting permission to enter a specific foreign country is a:", "options": [{"label": "A", "text": "Boarding pass"}, {"label": "B", "text": "Identity card"}, {"label": "C", "text": "Visa"}, {"label": "D", "text": "Customs receipt"}], "correctOption": "C", "sourceTitle": "Communication & Workplace Skills (Chapters 1–5) — Question Bank", "sourceQuestionId": 66, "sourcePage": 12}, {"id": 662, "chapterId": "comm-03", "subtopic": "Basic English for the Workplace", "question": "Passing through an intermediate airport or city solely on the way to another final destination is termed:", "options": [{"label": "A", "text": "Transfer"}, {"label": "B", "text": "Transit"}, {"label": "C", "text": "Destination"}, {"label": "D", "text": "Excursion"}], "correctOption": "B", "sourceTitle": "Communication & Workplace Skills (Chapters 1–5) — Question Bank", "sourceQuestionId": 67, "sourcePage": 12}, {"id": 663, "chapterId": "comm-03", "subtopic": "Basic English for the Workplace", "question": "Pre-arranged passenger transportation between an airport terminal and a hotel property is called an airport:", "options": [{"label": "A", "text": "Transit"}, {"label": "B", "text": "Transfer"}, {"label": "C", "text": "Visa"}, {"label": "D", "text": "Excursion"}], "correctOption": "B", "sourceTitle": "Communication & Workplace Skills (Chapters 1–5) — Question Bank", "sourceQuestionId": 68, "sourcePage": 12}, {"id": 664, "chapterId": "comm-03", "subtopic": "Basic English for the Workplace", "question": "The official document containing flight numbers, seat assignments, and boarding gate details that allows a passenger onto an aircraft is a:", "options": [{"label": "A", "text": "Passport"}, {"label": "B", "text": "Boarding pass"}, {"label": "C", "text": "Travel itinerary"}, {"label": "D", "text": "Visa slip"}], "correctOption": "B", "sourceTitle": "Communication & Workplace Skills (Chapters 1–5) — Question Bank", "sourceQuestionId": 69, "sourcePage": 13}, {"id": 665, "chapterId": "comm-03", "subtopic": "Basic English for the Workplace", "question": "A vacation product that bundles airfare, hotel accommodation, ground transportation, and activities into a single fixed price is a:", "options": [{"label": "A", "text": "Eco-tour"}, {"label": "B", "text": "À la carte journey"}, {"label": "C", "text": "Package tour"}, {"label": "D", "text": "Transit pass"}], "correctOption": "C", "sourceTitle": "Communication & Workplace Skills (Chapters 1–5) — Question Bank", "sourceQuestionId": 70, "sourcePage": 13}, {"id": 666, "chapterId": "comm-03", "subtopic": "Basic English for the Workplace", "question": "Responsible travel to natural areas that conserves the environment, respects wildlife, and sustains local communities is:", "options": [{"label": "A", "text": "Mass tourism"}, {"label": "B", "text": "Eco-tourism"}, {"label": "C", "text": "Package touring"}, {"label": "D", "text": "Corporate transit"}], "correctOption": "B", "sourceTitle": "Communication & Workplace Skills (Chapters 1–5) — Question Bank", "sourceQuestionId": 71, "sourcePage": 13}, {"id": 667, "chapterId": "comm-03", "subtopic": "Basic English for the Workplace", "question": "The ultimate geographic location to which a traveler is journeying is their:", "options": [{"label": "A", "text": "Origin"}, {"label": "B", "text": "Transit point"}, {"label": "C", "text": "Destination"}, {"label": "D", "text": "Itinerary"}], "correctOption": "C", "sourceTitle": "Communication & Workplace Skills (Chapters 1–5) — Question Bank", "sourceQuestionId": 72, "sourcePage": 13}, {"id": 668, "chapterId": "comm-03", "subtopic": "Basic English for the Workplace", "question": "\"May I help you with your luggage?\" and \"How may I assist you today?\" represent which professional sentence pattern?", "options": [{"label": "A", "text": "Pattern 2: Describing / Informing"}, {"label": "B", "text": "Pattern 1: Offering Help"}, {"label": "C", "text": "Pattern 3: Confirming"}, {"label": "D", "text": "Pattern 4: Polite Requests"}], "correctOption": "B", "sourceTitle": "Communication & Workplace Skills (Chapters 1–5) — Question Bank", "sourceQuestionId": 73, "sourcePage": 13}, {"id": 669, "chapterId": "comm-03", "subtopic": "Basic English for the Workplace", "question": "\"Breakfast is served from 7:00 AM to 10:00 AM in the Garden Restaurant.\" is an example of:", "options": [{"label": "A", "text": "Offering help"}, {"label": "B", "text": "Confirming details"}, {"label": "C", "text": "Describing / Informing"}, {"label": "D", "text": "Making a request"}], "correctOption": "C", "sourceTitle": "Communication & Workplace Skills (Chapters 1–5) — Question Bank", "sourceQuestionId": 74, "sourcePage": 13}, {"id": 670, "chapterId": "comm-03", "subtopic": "Basic English for the Workplace", "question": "\"Just to confirm: a deluxe room for two nights, correct?\" represents:", "options": [{"label": "A", "text": "Pattern 1: Offering Help"}, {"label": "B", "text": "Pattern 2: Describing"}, {"label": "C", "text": "Pattern 3: Confirming Details"}, {"label": "D", "text": "Pattern 4: Complaining"}], "correctOption": "C", "sourceTitle": "Communication & Workplace Skills (Chapters 1–5) — Question Bank", "sourceQuestionId": 75, "sourcePage": 13}, {"id": 671, "chapterId": "comm-03", "subtopic": "Basic English for the Workplace", "question": "\"Could you please spell your last name for me?\" and \"Would you mind waiting for just one moment?\" represent:", "options": [{"label": "A", "text": "Offering assistance"}, {"label": "B", "text": "Confirming dates"}, {"label": "C", "text": "Polite requests"}, {"label": "D", "text": "Describing facilities"}], "correctOption": "C", "sourceTitle": "Communication & Workplace Skills (Chapters 1–5) — Question Bank", "sourceQuestionId": 76, "sourcePage": 13}, {"id": 672, "chapterId": "comm-03", "subtopic": "Basic English for the Workplace", "question": "Why must a hospitality professional always repeat back key details (room numbers, dates, food modifications)?", "options": [{"label": "A", "text": "To make the conversation last longer"}, {"label": "B", "text": "To prevent costly operational errors and ensure mutual understanding"}, {"label": "C", "text": "To test the guest's memory"}, {"label": "D", "text": "To practice their spoken English grammar INTERPERSONAL COMMUNICATION (pp. 24–28)"}], "correctOption": "B", "sourceTitle": "Communication & Workplace Skills (Chapters 1–5) — Question Bank", "sourceQuestionId": 77, "sourcePage": 14}, {"id": 673, "chapterId": "comm-04", "subtopic": "Everyday & Interpersonal Communication", "question": "A question that can be answered only with a simple \"Yes\" or \"No\" (such as \"Do you have a reservation?\") is a(n):", "options": [{"label": "A", "text": "Open question"}, {"label": "B", "text": "Closed question"}, {"label": "C", "text": "Probing question"}, {"label": "D", "text": "Reflective question"}], "correctOption": "B", "sourceTitle": "Communication & Workplace Skills (Chapters 1–5) — Question Bank", "sourceQuestionId": 78, "sourcePage": 15}, {"id": 674, "chapterId": "comm-04", "subtopic": "Everyday & Interpersonal Communication", "question": "Which of the following is an example of an open question designed to gather detailed information?", "options": [{"label": "A", "text": "\"Did you enjoy your meal?\""}, {"label": "B", "text": "\"Would you like a window table?\""}, {"label": "C", "text": "\"Is everything satisfactory?\""}, {"label": "D", "text": "\"What type of room would you prefer for your stay?\""}], "correctOption": "D", "sourceTitle": "Communication & Workplace Skills (Chapters 1–5) — Question Bank", "sourceQuestionId": 79, "sourcePage": 15}, {"id": 675, "chapterId": "comm-04", "subtopic": "Everyday & Interpersonal Communication", "question": "What is the professional rule of thumb regarding the strategic use of open and closed questions?", "options": [{"label": "A", "text": "Start with closed questions, then switch to open questions to close the transaction"}, {"label": "B", "text": "Start with an open question to discover needs, then use closed questions to confirm specific details"}, {"label": "C", "text": "Avoid asking open questions because they take up too much time"}, {"label": "D", "text": "Use closed questions exclusively during guest check-in"}], "correctOption": "B", "sourceTitle": "Communication & Workplace Skills (Chapters 1–5) — Question Bank", "sourceQuestionId": 80, "sourcePage": 15}, {"id": 676, "chapterId": "comm-04", "subtopic": "Everyday & Interpersonal Communication", "question": "In the professional CARE Formula for giving answers, what does the letter C stand for?", "options": [{"label": "A", "text": "Calculate"}, {"label": "B", "text": "Confirm (acknowledge the request warmly, e.g., \"The swimming pool, of course!\")"}, {"label": "C", "text": "Close"}, {"label": "D", "text": "Correct"}], "correctOption": "B", "sourceTitle": "Communication & Workplace Skills (Chapters 1–5) — Question Bank", "sourceQuestionId": 81, "sourcePage": 15}, {"id": 677, "chapterId": "comm-04", "subtopic": "Everyday & Interpersonal Communication", "question": "In the CARE Formula, what action does the step R require?", "options": [{"label": "A", "text": "Refuse the request"}, {"label": "B", "text": "Repeat the rules"}, {"label": "C", "text": "Recommend (provide helpful extra suggestions, e.g., \"We also have a gym right next to it.\")"}, {"label": "D", "text": "Report to security"}], "correctOption": "C", "sourceTitle": "Communication & Workplace Skills (Chapters 1–5) — Question Bank", "sourceQuestionId": 82, "sourcePage": 15}, {"id": 678, "chapterId": "comm-04", "subtopic": "Everyday & Interpersonal Communication", "question": "What are the complete four stages of the CARE Formula?", "options": [{"label": "A", "text": "Call → Assist → Resolve → Exit"}, {"label": "B", "text": "Confirm → Answer → Recommend → End politely"}, {"label": "C", "text": "Check → Apologize → Refund → Explain"}, {"label": "D", "text": "Connect → Ask → Review → Evaluate"}], "correctOption": "B", "sourceTitle": "Communication & Workplace Skills (Chapters 1–5) — Question Bank", "sourceQuestionId": 83, "sourcePage": 15}, {"id": 679, "chapterId": "comm-04", "subtopic": "Everyday & Interpersonal Communication", "question": "What is the correct way to execute the E (End) step of the CARE Formula?", "options": [{"label": "A", "text": "Walk away immediately after delivering the answer"}, {"label": "B", "text": "Ask the guest for a cash tip"}, {"label": "C", "text": "Ask a closing service question: \"Is there anything else I can help you with?\""}, {"label": "D", "text": "Tell the guest to read the hotel brochure"}], "correctOption": "C", "sourceTitle": "Communication & Workplace Skills (Chapters 1–5) — Question Bank", "sourceQuestionId": 84, "sourcePage": 15}, {"id": 680, "chapterId": "comm-04", "subtopic": "Everyday & Interpersonal Communication", "question": "What is the core difference between hearing and active listening?", "options": [{"label": "A", "text": "Hearing is done with ears; listening is done with eyes"}, {"label": "B", "text": "Hearing is a passive biological process; active listening is a professional skill requiring conscious focus and deliberate effort"}, {"label": "C", "text": "Hearing is an active skill; listening is purely accidental"}, {"label": "D", "text": "There is no difference; they are exact synonyms"}], "correctOption": "B", "sourceTitle": "Communication & Workplace Skills (Chapters 1–5) — Question Bank", "sourceQuestionId": 85, "sourcePage": 16}, {"id": 681, "chapterId": "comm-04", "subtopic": "Everyday & Interpersonal Communication", "question": "What are the 5 steps of active listening in correct order?", "options": [{"label": "A", "text": "Hear → Think → Speak → Argue → Forget"}, {"label": "B", "text": "Focus → Observe → Listen → Confirm → Respond"}, {"label": "C", "text": "Greet → Recommend → Answer → Confirm → End"}, {"label": "D", "text": "Look → Write → Promise → Deliver → Check"}], "correctOption": "B", "sourceTitle": "Communication & Workplace Skills (Chapters 1–5) — Question Bank", "sourceQuestionId": 86, "sourcePage": 16}, {"id": 682, "chapterId": "comm-04", "subtopic": "Everyday & Interpersonal Communication", "question": "What is a key behavior of a poor listener in hospitality?", "options": [{"label": "A", "text": "Maintains supportive eye contact"}, {"label": "B", "text": "Nods and uses vocal cues like \"I see\""}, {"label": "C", "text": "Interrupts the guest before they finish speaking or looks at their mobile phone"}, {"label": "D", "text": "Paraphrases key points to ensure understanding"}], "correctOption": "C", "sourceTitle": "Communication & Workplace Skills (Chapters 1–5) — Question Bank", "sourceQuestionId": 87, "sourcePage": 16}, {"id": 683, "chapterId": "comm-04", "subtopic": "Everyday & Interpersonal Communication", "question": "Which practice builds strong interpersonal relationships with repeat hotel guests?", "options": [{"label": "A", "text": "Treating all guests like complete strangers to stay formal"}, {"label": "B", "text": "Using the guest's name when known and remembering their individual preferences"}, {"label": "C", "text": "Asking guests personal questions regarding their finances"}, {"label": "D", "text": "Sharing internal staff gossip with dining guests"}], "correctOption": "B", "sourceTitle": "Communication & Workplace Skills (Chapters 1–5) — Question Bank", "sourceQuestionId": 88, "sourcePage": 16}, {"id": 684, "chapterId": "comm-04", "subtopic": "Everyday & Interpersonal Communication", "question": "How does empathy transform hospitality service?", "options": [{"label": "A", "text": "It allows staff to charge higher rates for rooms"}, {"label": "B", "text": "It transforms a cold, mechanical transaction into a genuine human connection"}, {"label": "C", "text": "It replaces the need for standard operating procedures"}, {"label": "D", "text": "It forces guests to agree with management decisions"}], "correctOption": "B", "sourceTitle": "Communication & Workplace Skills (Chapters 1–5) — Question Bank", "sourceQuestionId": 89, "sourcePage": 16}, {"id": 685, "chapterId": "comm-04", "subtopic": "Everyday & Interpersonal Communication", "question": "An exhausted guest arrives at the front desk after a 14-hour delayed flight. Which response demonstrates true empathy?", "options": [{"label": "A", "text": "\"Passport and credit card, please.\""}, {"label": "B", "text": "\"Check-in is at 3:00 PM, you'll have to sit in the lobby.\""}, {"label": "C", "text": "\"Welcome! You must be tired after such a long journey. Let me get you checked in as quickly as possible. Can I bring you some water while I process this?\""}, {"label": "D", "text": "\"Flights are always delayed, it happens to everyone.\""}], "correctOption": "C", "sourceTitle": "Communication & Workplace Skills (Chapters 1–5) — Question Bank", "sourceQuestionId": 90, "sourcePage": 16}, {"id": 686, "chapterId": "comm-04", "subtopic": "Everyday & Interpersonal Communication", "question": "What phrase should you use when you need a guest to wait for a few seconds while you pull up their file?", "options": [{"label": "A", "text": "\"Wait a minute.\""}, {"label": "B", "text": "\"Hold on.\""}, {"label": "C", "text": "\"Just one moment, please.\""}, {"label": "D", "text": "\"Stop talking.\""}], "correctOption": "C", "sourceTitle": "Communication & Workplace Skills (Chapters 1–5) — Question Bank", "sourceQuestionId": 91, "sourcePage": 16}, {"id": 687, "chapterId": "comm-04", "subtopic": "Everyday & Interpersonal Communication", "question": "When taking a heavy coat or carrying bags for a guest, the most polished expression is:", "options": [{"label": "A", "text": "\"Give that to me.\""}, {"label": "B", "text": "\"Allow me.\""}, {"label": "C", "text": "\"I have to take this.\""}, {"label": "D", "text": "\"Let's go.\""}], "correctOption": "B", "sourceTitle": "Communication & Workplace Skills (Chapters 1–5) — Question Bank", "sourceQuestionId": 92, "sourcePage": 16}, {"id": 688, "chapterId": "comm-04", "subtopic": "Everyday & Interpersonal Communication", "question": "When escorting a guest through a dining room or corridor to their table, you should say:", "options": [{"label": "A", "text": "\"Follow behind me.\""}, {"label": "B", "text": "\"Right this way, please.\""}, {"label": "C", "text": "\"Move over there.\""}, {"label": "D", "text": "\"Your table is somewhere in the corner.\""}], "correctOption": "B", "sourceTitle": "Communication & Workplace Skills (Chapters 1–5) — Question Bank", "sourceQuestionId": 93, "sourcePage": 17}, {"id": 689, "chapterId": "comm-04", "subtopic": "Everyday & Interpersonal Communication", "question": "During a meal service, when checking whether guests are pleased with their dishes, the professional question is:", "options": [{"label": "A", "text": "\"Are you done eating yet?\""}, {"label": "B", "text": "\"Is the food okay or what?\""}, {"label": "C", "text": "\"Is everything to your satisfaction?\""}, {"label": "D", "text": "\"Do you want more food?\""}], "correctOption": "C", "sourceTitle": "Communication & Workplace Skills (Chapters 1–5) — Question Bank", "sourceQuestionId": 94, "sourcePage": 17}, {"id": 690, "chapterId": "comm-04", "subtopic": "Everyday & Interpersonal Communication", "question": "When service is unavoidably delayed, what should staff say to waiting guests?", "options": [{"label": "A", "text": "\"Don't blame me, the kitchen is slow.\""}, {"label": "B", "text": "\"We appreciate your patience.\""}, {"label": "C", "text": "\"You have to wait your turn.\""}, {"label": "D", "text": "\"There is nothing I can do.\""}], "correctOption": "B", "sourceTitle": "Communication & Workplace Skills (Chapters 1–5) — Question Bank", "sourceQuestionId": 95, "sourcePage": 17}, {"id": 691, "chapterId": "comm-04", "subtopic": "Everyday & Interpersonal Communication", "question": "When a guest says \"Thank you so much for your wonderful service!\", what is the mandatory professional response?", "options": [{"label": "A", "text": "\"No problem.\""}, {"label": "B", "text": "\"Yup.\""}, {"label": "C", "text": "\"My pleasure!\" (never say \"No problem\" in hospitality)"}, {"label": "D", "text": "\"It's just my job.\""}], "correctOption": "C", "sourceTitle": "Communication & Workplace Skills (Chapters 1–5) — Question Bank", "sourceQuestionId": 96, "sourcePage": 17}, {"id": 692, "chapterId": "comm-04", "subtopic": "Everyday & Interpersonal Communication", "question": "Why is saying \"No problem\" considered unprofessional in luxury hospitality?", "options": [{"label": "A", "text": "It is too difficult to pronounce"}, {"label": "B", "text": "It implies that serving the guest could have been a problem or burden, whereas \"My pleasure\" affirms delight in serving them"}, {"label": "C", "text": "Guests do not understand modern slang"}, {"label": "D", "text": "It is an illegal phrase under hospitality labor laws"}], "correctOption": "B", "sourceTitle": "Communication & Workplace Skills (Chapters 1–5) — Question Bank", "sourceQuestionId": 97, "sourcePage": 17}, {"id": 693, "chapterId": "comm-04", "subtopic": "Everyday & Interpersonal Communication", "question": "What is the correct phrase when an error has occurred on an order or bill?", "options": [{"label": "A", "text": "\"The computer made a mistake.\""}, {"label": "B", "text": "\"I sincerely apologize.\""}, {"label": "C", "text": "\"It's not my fault.\""}, {"label": "D", "text": "\"You misunderstood the menu.\""}], "correctOption": "B", "sourceTitle": "Communication & Workplace Skills (Chapters 1–5) — Question Bank", "sourceQuestionId": 98, "sourcePage": 17}, {"id": 694, "chapterId": "comm-04", "subtopic": "Everyday & Interpersonal Communication", "question": "When speaking officially on behalf of your establishment at a banquet or check-in, you say:", "options": [{"label": "A", "text": "\"From my side...\""}, {"label": "B", "text": "\"According to me...\""}, {"label": "C", "text": "\"On behalf of [Hotel Name]...\""}, {"label": "D", "text": "\"My friends and I welcome you...\" (pp. 29–31)"}], "correctOption": "C", "sourceTitle": "Communication & Workplace Skills (Chapters 1–5) — Question Bank", "sourceQuestionId": 99, "sourcePage": 17}, {"id": 695, "chapterId": "comm-05", "subtopic": "Responsibility, Ethics & Leadership", "question": "Which statement reflects an employee who takes professional ownership?", "options": [{"label": "A", "text": "\"I didn't know it was my responsibility.\""}, {"label": "B", "text": "\"That is not in my job description.\""}, {"label": "C", "text": "\"I noticed the issue and fixed it before the guest saw it.\""}, {"label": "D", "text": "\"I don't know how that happened. Not my fault.\""}], "correctOption": "C", "sourceTitle": "Communication & Workplace Skills (Chapters 1–5) — Question Bank", "sourceQuestionId": 100, "sourcePage": 18}, {"id": 696, "chapterId": "comm-05", "subtopic": "Responsibility, Ethics & Leadership", "question": "When an employee makes a service error, an irresponsible worker hides it, while a responsible professional:", "options": [{"label": "A", "text": "Blames the trainee on duty"}, {"label": "B", "text": "Acknowledges the error proactively and reports that it has already been corrected"}, {"label": "C", "text": "Waits until the guest posts an online complaint"}, {"label": "D", "text": "Pretends the error never took place"}], "correctOption": "B", "sourceTitle": "Communication & Workplace Skills (Chapters 1–5) — Question Bank", "sourceQuestionId": 101, "sourcePage": 18}, {"id": 697, "chapterId": "comm-05", "subtopic": "Responsibility, Ethics & Leadership", "question": "What is the ethical definition of integrity in the workplace?", "options": [{"label": "A", "text": "Working hard only when the General Manager is standing in the room"}, {"label": "B", "text": "Doing the right thing even when no one is watching"}, {"label": "C", "text": "Ensuring you never get caught breaking company rules"}, {"label": "D", "text": "Agreeing with everything senior colleagues say"}], "correctOption": "B", "sourceTitle": "Communication & Workplace Skills (Chapters 1–5) — Question Bank", "sourceQuestionId": 102, "sourcePage": 18}, {"id": 698, "chapterId": "comm-05", "subtopic": "Responsibility, Ethics & Leadership", "question": "A guest leaves an expensive leather wallet containing cash on a restaurant table. The ethical protocol is:", "options": [{"label": "A", "text": "Keep it in your locker until the end of the week to see if someone asks"}, {"label": "B", "text": "Split the cash with the busser and turn in the empty wallet"}, {"label": "C", "text": "Hand it in to Lost & Found immediately with zero hesitation"}, {"label": "D", "text": "Leave it on the table for the next dining party to handle"}], "correctOption": "C", "sourceTitle": "Communication & Workplace Skills (Chapters 1–5) — Question Bank", "sourceQuest g through an intermediate airport solely on their way to another destination country"}, {"label": "C", "text": "They have lost their luggage"}, {"label": "D", "text": "They are applying for permanent citizenship"}], "correctOption": "B", "sourceTitle": "Communication & Workplace Skills (Chapters 1–5) — Question Bank", "sourceQuestionId": 127, "sourcePage": 21}, {"id": 723, "chapterId": "comm-05", "subtopic": "Responsibility, Ethics & Leadership", "question": "Scenario: A server accidentally drops a tray of glasses in the kitchen service area. An irresponsible worker runs away. What does a worker with integrity and ownership do?", "options": [{"label": "A", "text": "Accuse the dishwasher of leaving the floor slippery"}, {"label": "B", "text": "Immediately clear the broken glass safely to protect team members, notify the supervisor, and log the breakage honestly"}, {"label": "C", "text": "Hide the broken glass in the linen hamper"}, {"label": "D", "text": "Ignore the mess and start serving food immediately"}], "correctOption": "B", "sourceTitle": "Communication & Workplace Skills (Chapters 1–5) — Question Bank", "sourceQuestionId": 128, "sourcePage": 21}, {"id": 724, "chapterId": "comm-05", "subtopic": "Responsibility, Ethics & Leadership", "question": "In the hospitality phrase \"à la carte\", how is it pronounced and what is its grammatical function?", "options": [{"label": "A", "text": "Pronounced ay-la-cart; means an all-inclusive set buffet"}, {"label": "B", "text": "Pronounced ah-lah-KART; functions as an adverb/adjective meaning dishes ordered individually from the menu"}, {"label": "C", "text": "Pronounced ah-la-CAR-tay; means food cooked in a cart"}, {"label": "D", "text": "Pronounced al-CART; means free food given to guests"}], "correctOption": "B", "sourceTitle": "Communication & Workplace Skills (Chapters 1–5) — Question Bank", "sourceQuestionId": 129, "sourcePage": 21}, {"id": 725, "chapterId": "comm-05", "subtopic": "Responsibility, Ethics & Leadership",                 const n = +$('#n').value, timed = $('#t').checked, course = $('#rapid-course').value;
                const pool = QS.filter(q => course === 'all' || courseOf(q.chapterId) === course).map(q => q.id);
                startSession({ mode: 'rapid', title: 'Rapid-Fire', color: '#FF6578', qids: shuffle(pool).slice(0,n), rapidTimed: timed });
            };
        }
        /* ---------- mistakes / bookmarks ---------- */
        function listPage(title, ids, mode) { const f = $('#f')?.value || 'all', s = ($('#s')?.value || '').toLowerCase(); ids = ids.filter(i => (f === 'all' || QB[i].chapterId === f) && (!s || QB[i].question.toLowerCase().includes(s))); return ids }
        function mistakes() {
            const all = Object.keys(st.att).map(Number).filter(i => st.att[i].w > 0).sort((a, b) => (st.att[b].ok === false) - (st.att[a].ok === false) || st.att[b].w - st.att[a].w);
            const draw = () => { const ids = listPage('', all); const open = ids.filter(i => !st.mast.includes(i)); $('#L').innerHTML = ids.length ? ids.map(i => { const q = QB[i], a = st.att[i], m = st.mast.includes(i); return `<div class="card" style="margin:10px 0;border-left:8px solid ${CHB[q.chapterId].color}"><b>Q${i}. ${esc(q.question)}</b><p class="mut">${CHB[q.chapterId].em} ${esc(CHB[q.chapterId].title)} · wrong ${a.w}× · last attempt ${new Date(a.t).toLocaleDateString()} · ${m ? '✓ mastered' : a.ok ? 'answered correctly since' : 'still wrong'}</p><button class="btn ghost" data-m="${i}">${m ? 'Unmark mastered' : 'Mark mastered'}</button></div>` }).join('') : '<div class="card"><h3>Nothing here yet 🎉</h3><p>Wrong answers will appear in this notebook automatically.</p></div>'; $('#pr').disabled = !open.length; $('#pr').onclick = () => startSession({ mode: 'practice', title: 'Mistake Notebook', color: '#FF6578', qids: open }); $('#L').querySelectorAll('[data-m]').forEach(b => b.onclick = () => { const i = +b.dataset.m, k = st.mast.indexOf(i); k < 0 ? st.mast.push(i) : st.mast.splice(k, 1); save(); draw() }) };
            app.innerHTML = `<h1>The Mistake Notebook</h1><div class="row"><select id="f" aria-label="Chapter filter"><option value="all">All chapters</option>${CHS.map(c => `<option value="${c.id}">${esc(c.title)}</option>`).join('')}</select><span class="sp"></span><button class="btn pri" id="pr">Practice unmastered mistakes</button></div><div id="L"></div>`; $('#f').onchange = draw; draw()
        }
        function bookmarks() {
            const draw = () => { const ids = listPage('', st.bm); $('#L').innerHTML = ids.length ? ids.map(i => `<div class="card" style="margin:10px 0"><b>Q${i}. ${esc(QB[i].question)}</b><p class="mut">${CHB[QB[i].chapterId].em} ${esc(CHB[QB[i].chapterId].title)}</p><button class="btn ghost" data-r="${i}">Remove</button></div>`).join('') : '<div class="card"><h3>No bookmarks</h3><p>Tap ☆ Bookmark during practice to save a question.</p></div>'; $('#pr').disabled = !st.bm.length; $('#L').querySelectorAll('[data-r]').forEach(b => b.onclick = () => { st.bm = st.bm.filter(x => x !== +b.dataset.r); save(); draw() }) };
            app.innerHTML = `<h1>Bookmarks</h1><div class="row"><input id="s" placeholder="Search saved questions" aria-label="Search"><select id="f" aria-label="Chapter filter"><option value="all">All chapters</option>${CHS.map(c => `<option value="${c.id}">${esc(c.title)}</option>`).join('')}</select><span class="sp"></span><button class="btn pri" id="pr">Practice bookmarks</button></div><div id="L"></div>`; $('#s').oninput = draw; $('#f').onchange = draw; $('#pr').onclick = () => startSession({ mode: 'practice', title: 'Bookmarks', color: '#7282FF', qids: listPage('', st.bm) }); draw()
        }
        /* ---------- revision vault (from PDF pp.37-38) ---------- */
        const VAULT = [['🌡 Key temperatures', [['Danger Zone', '41–135 °F (5–57 °C)'], ['Reheat / Poultry / Stuffed', '165 °F (74 °C)'], ['Ground meat', '155 °F (68 °C)'], ['Whole cuts & Fish', '145 °F (63 °C)'], ['Fish receiving → storage → selling', '−1 to 1 °C → 0 °C → 3–4 °C'], ['Chiller / Freezer', '0 to −2 °C / −18 °C (0 °F)'], ['Poach / Simmer / Boil', '160–180 °F / 185–205 °F / 212 °F'], ['Dry store', '50–70 °F (10–21 °C)']]],
        ['📏 Measurements', [['Pound', '1 lb = 454 g'], ['Kilogram', '1 kg = 2.2 lb'], ['Ounce', '1 oz = 28.35 g'], ['Gallon', '1 gal = 4 qt ≈ 3.8 L'], ['Cup', '1 cup ≈ 250 ml'], ['Tablespoon', '1 tbsp = 3 tsp'], ['Abbreviations', 'oz = ounce, pt = pint, qt = quart, gal = gallon']]],
        ['🔪 Knives', [['Chef\'s', '8–12" all-purpose'], ['Paring', '2–4" trim/peel'], ['Tools', 'Steel = hone, Whetstone = sharpen'], ['Safety', 'Carry blade down; never catch a falling knife']]],
        ['🥕 Mirepoix', [['Basic', '2:1:1 onion-carrot-celery'], ['White', 'onion, leek, celery (no carrot)'], ['Brown', 'caramelized'], ['Sachet / Bouquet garni', 'Sachet = spices in cheesecloth; Bouquet garni = tied herbs']]],
        ['🍲 Mother sauces', [['Béchamel', 'white roux + milk'], ['Velouté', 'white roux + white stock'], ['Espagnole', 'brown roux + brown stock'], ['Tomato', ''], ['Hollandaise', 'butter + yolk + acid emulsion'], ['Demi-glace', 'Espagnole + brown stock, reduced'], ['Liaison / Slurry', 'Liaison = yolk + cream; Slurry = starch + cold water']]],
        ['🥣 Soups', [['Clear', 'broth / consommé (clarified with clearmeat)'], ['Thick', 'cream (roux), purée (own starch), bisque (shellfish), chowder'], ['Cold', 'gazpacho, vichyssoise']]],
        ['🔥 Cooking methods', [['Dry', 'roast/bake (oven, uncovered), grill (heat below), broil/salamander (heat above), sauté, pan-fry, deep-fry, stir-fry'], ['Moist', 'poach, simmer, boil, steam, blanch'], ['Combination', 'braise (large cuts, sear + covered liquid), stew (small pieces, submerged)'], ['Heat transfer', 'Conduction = contact; Convection = moving air/liquid; Radiation = waves'], ['Browning', 'caramelization = sugar; Maillard = protein + sugar']]],
        ['🐟 Fish & shellfish', [['Fish', 'Round vs flat; lean (<5% fat) vs fatty'], ['Crustaceans', 'shrimp, lobster, crab, crayfish'], ['Mollusks', 'bivalves (clam, oyster, mussel, scallop) + univalves (conch, abalone)'], ['Cephalopods', 'squid (calamari), octopus, cuttlefish'], ['Fresh', 'clear eyes, red gills, ocean smell'], ['Storage / cooking', 'Store on self-draining ice; cook to 145 °F']]],
        ['🍎 Produce', [['Potato', 'tuber, NOT root'], ['Herbs', 'leaves'], ['Families', 'Cabbage = cauliflower, broccoli, bok choy, kale · Lettuce = iceberg · Onion = leek, garlic, shallot'], ['Other', 'Morel = mushroom; Cilantro = coriander leaf; Jalapeño = Mexico'], ['Fruit', 'Stone = peach, nectarine, plum, cherry; Pineapple = multiple fruit + bromelain'], ['Perishability', 'Raspberries very perishable; blueberries firmer; citrus = winter'], ['Ethylene', 'Producers away from sensitive items']]],
        ['🧀 Grains & dairy', [['Milk / cream', 'Whole milk ~3.25–3.5% fat; heavy cream 36–40%'], ['Cheese', 'Fresh = feta, mozzarella, ricotta · Cheddar = firm · Parmigiano-Reggiano = hard, aged years (2–7) · Danish Blue = blue-veined'], ['Rice', 'Jasmine = long-grain; Arborio = risotto']]],
        ['📦 Rotation & safety', [['Rotation', 'FIFO first in, first out · FEFO first expired, first out · LIFO last in, first out'], ['Systems', 'HACCP = Hazard Analysis Critical Control Points; CCP = Critical Control Point; OSHA = workplace safety (US)'], ['Illness', 'Foodborne illness = pathogens'], ['Cooling', '135→70 °F in 2 h, 70→41 °F in 4 h'], ['Storage', 'Store RTE above, poultry below']]]];
        function vault() { app.innerHTML = `<h1>Revision Vault</h1><p class="mut">Content from the one-page revision sheet in the question bank (pp. 37–38).</p>${VAULT.map(([t, r], i) => `<details ${i === 0 ? 'open' : ''}><summary>${t}</summary><table>${r.map(x => `<tr><th scope="row">${esc(x[0])}</th><td>${esc(x[1])}</td></tr>`).join('')}</table></details>`).join('')}` }
        /* ---------- progress ---------- */
        function progress() {
            const o = overall(), mastered = QS.filter(q => isMastered(q.id)).length;
            app.innerHTML = `<h1>Progress</h1><div class="stats" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))"><div class="stat"><b>${o.att}/${QS.length}</b><span>coverage</span></div><div class="stat"><b>${o.acc == null ? '—' : o.acc + '%'}</b><span>overall accuracy</span></div><div class="stat"><b>${mastered}</b><span>mastered (marked, or correct twice and latest correct)</span></div><div class="stat"><b>${Object.values(st.att).filter(a => a.w > 0 && !a.ok).length}</b><span>currently difficult</span></div></div>
 <h3 style="margin-top:20px">By chapter</h3>${CHS.map(c => { const s = chStats(c.id); return `<p style="margin:8px 0">${CHB[c.id].em} ${esc(c.title)} — ${s.pct}% attempted, ${s.acc == null ? 'n/a' : s.acc + '% accuracy'}<span class="bar" style="display:block"><span style="display:block;height:100%;width:${s.acc || 0}%;background:${CHB[c.id].color}"></span></span></p>` }).join('')}
 <h3>Exam history</h3>${st.exams.length ? `<table><tr><th>Date</th><th>Score</th><th>Questions</th></tr>${st.exams.slice().reverse().map(e => `<tr><td>${new Date(e.t).toLocaleString()}</td><td>${e.pct}%</td><td>${e.c}/${e.n}</td></tr>`).join('')}</table>` : '<p class="mut">No exams taken yet.</p>'}
 <h3>Your data</h3><p class="mut">Stored only in this browser on this device; it doesn't sync.</p><div class="row"><button class="btn ghost" id="ex">Export JSON</button><label class="btn ghost" style="display:inline-flex;align-items:center">Import JSON<input id="im" type="file" accept=".json" hidden></label><button class="btn pri" id="rs">Reset progress</button></div>`;
            $('#ex').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(st)], { type: 'application/json' })); a.download = 'flavor-lab-progress.json'; a.click() };
            $('#im').onchange = async e => { try { const o = JSON.parse(await e.target.files[0].text()); if (o.v !== 1) throw 0; st = { ...blank(), ...o }; save(); toast('Imported'); progress() } catch (_) { toast('Invalid progress file') } };
            $('#rs').onclick = () => { const m = document.createElement('div'); m.className = 'modal'; m.innerHTML = '<div class="card" role="dialog" aria-modal="true"><h3>Reset all progress?</h3><p>This permanently deletes attempts, bookmarks, exams and streak on this browser.</p><div class="row"><button class="btn ghost" id="no">Cancel</button><button class="btn pri" id="yes">Yes, reset</button></div></div>'; document.body.append(m); m.querySelector('#no').onclick = () => m.remove(); m.querySelector('#yes').onclick = () => { const t = st.theme; st = { ...blank(), theme: t }; save(); m.remove(); progress() } }
        }
        nav();
    </script>
</body>
